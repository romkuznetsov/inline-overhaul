name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Settings layer gates
        run: npm run gate

      # Прототип нормативен (PRD Р8), поэтому расхождение с ним ловится
      # здесь же: гейты схемы, дымовой рендер, проверки по выводу и
      # перегенерация раздела 9 с Приложением B без diff (Г24).
      - name: Prototype gates
        run: npm run gate:prototype

      # Седьмой шаг — браузер — здесь **пока не стоит**, и это не отказ от
      # решения заказчика 2026-09-11, а его цена, найденная первым же прогоном.
      #
      # Шаг был добавлен в тот же день и уронил CI, оставаясь зелёным у меня:
      # гейт меряет **вычисленные величины**, а они зависят от шрифтов машины.
      # На Linux-раннере строка со ссылкой даёт высоту 24 против 19 у текста, и
      # подложка перенесённого блока считается иначе. Это ровно У-78: «зелёный
      # у меня» и «зелёный у всех» — разные утверждения, и здесь их развёл
      # сервер, а не рассуждение.
      #
      # Чтобы шаг сюда вернулся, гейт надо сделать независимым от машины —
      # свой шрифт в странице вместо системного. Это названная работа, она
      # стоит в docs/REMAINING_WORK.md; до неё шаг гоняется руками.
      - name: Build
        run: npm run build

      - name: Bundle sanity
        run: node --check dist/main.js
