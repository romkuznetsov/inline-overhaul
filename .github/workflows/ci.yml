name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Settings layer gates
        run: npm run gate

      # Прототип нормативен (PRD Р8), поэтому расхождение с ним ловится
      # здесь же: гейты схемы, дымовой рендер, проверки по выводу и
      # перегенерация раздела 9 с Приложением B без diff (Г24).
      - name: Prototype gates
        run: npm run gate:prototype

      # Седьмой шаг — браузер — здесь **пока не стоит**, и это не отказ от
      # решения заказчика 2026-09-11, а его цена, найденная первым же прогоном.
      #
      # Шаг был добавлен в тот же день и уронил CI, оставаясь зелёным у меня.
      # Это ровно У-78: «зелёный у меня» и «зелёный у всех» — разные
      # утверждения, и здесь их развёл сервер, а не рассуждение.
      #
      # Причина, записанная тогда здесь же («гейт меряет вертикаль, а она
      # зависит от шрифтов: 24 против 19»), НЕВЕРНА и снята 2026-09-11 вечером:
      # по журналу того самого прогона эти числа совпадают с моими до точки.
      # Упало одно утверждение — про подложку у правого края содержимого, — и
      # оно очищено от машины: нарушением считается только подложка там, где
      # написанное на её зрительной строке до края не дошло.
      #
      # Воспроизвести падение у себя не вышло (восемь семейств шрифтов,
      # семнадцать ширин ящика — везде зелено, и на старой проверке тоже), и
      # 2026-09-13 стало понятно почему: у того утверждения не было ни одного
      # предмета на моей машине — до правого края не доходит ни одна подложка,
      # 0 из 20 при крае 520. Менять это шрифтам и ширинам было нечем.
      #
      # С тех пор у утверждения есть положительный контроль (подмена
      # rows-never-cut: оба пути резки рядов отключены разом, и оно краснеет с
      # числами), а «подложка убежала» и «зрительной строки под ней не
      # нашлось» разведены на два разных сообщения: раньше это был один null и
      # оба случая читались как нарушение.
      #
      # **Шаг возвращён 2026-09-13 по его решению В-113, и возвращён ради
      # одного вопроса: назвать, что именно здесь падает.** Он выбрал разовую
      # выкладку рабочей ветки (не main, не релиз) вместо прогона у себя, и это
      # снимает запрет на push только для этой ветки и только ради прогона.
      #
      # Если шаг покраснеет — в отчёте будут числа: какой прямоугольник, где
      # кончается написанное на его зрительной строке, где край ящика, — и
      # отдельной строкой случай «померить нечем». Если позеленеет, вопрос
      # тоже закрыт: значит падение снялось правкой 2026-09-11, очищавшей
      # утверждение от машины, и шаг остаётся здесь насовсем.
      #
      # `continue-on-error` не ставится нарочно: тихо жёлтый шаг — это шаг,
      # которого нет (A15).
      - name: Browser gate
        run: |
          npx playwright install --with-deps chromium
          npm run gate:browser

      - name: Build
        run: npm run build

      - name: Bundle sanity
        run: node --check dist/main.js
