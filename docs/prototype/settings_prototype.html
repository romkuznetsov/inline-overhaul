const state = {};
const bindings = new Map();
let previewRefreshers = [];
let activeTab = "general";
let selectedFieldId = "status";
let showAll = false;
let wheelField = 0, wheelValue = 2;
let dialog = null;

function setIn(obj, path, value) {
  const keys = path.split("");
  let cur = obj;
  for (let i = 0; i < keys.length - 1; i++) cur = (cur[keys[i]] ??= {});
  cur[keys[keys.length - 1]] = value;
}
function getIn(obj, path) { return path.split("").reduce((a, k) => (a == null ? a : a[k]), obj); }
function seed() {
  for (const g of SCHEMA) for (const it of g.items) if ("path" in it && it.path) setIn(state, it.path, it.default);
}

const LIVE = {};
function val(p) { return Object.prototype.hasOwnProperty.call(LIVE, p) ? LIVE[p] : getIn(state, p); }

const ctx = {
  get: p => getIn(state, p),
  set(path, value) { setIn(state, path, value); delete LIVE[path]; notify(path); },
  run(action) {
    document.getElementById("proto-hint").textContent =
      "Action \"" + action + "\" would run here, then report the result in a notice";
  },
  goTo(id) { jumpTo(id); }
};

function bind(path, fn) {
  if (!bindings.has(path)) bindings.set(path, new Set());
  bindings.get(path).add(fn);
}

/* Точечное обновление вместо полной перерисовки — PRD Р-4. Список колбэков
   снимается до вызова: любой из них может пересобрать контент. */
let notifying = false;
function notify(changedPath) {
  const queue = [];
  for (const [path, set] of bindings) {
    if (path !== changedPath && !path.startsWith(changedPath + "")) continue;
    for (const fn of set) if (!queue.includes(fn)) queue.push(fn);
  }
  if (!notifying) {
    notifying = true;
    try {
      if (queue.includes(renderContent)) renderContent();
      else for (const fn of queue) fn();
    } finally { notifying = false; }
  }
  refreshPreviews();
  syncTabs();
}
function refreshPreviews() { for (const fn of previewRefreshers) { try { fn(); } catch (_) {} } }

/* ============================================================ DOM helpers */

function el(tag, cls, parent, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function rich(node, html) {
  const parts = String(html).split(/(<code>.*?<\/code>|<b>.*?<\/b>)/g);
  for (const p of parts) {
    if (!p) continue;
    if (p.startsWith("<code>")) el("code", null, node, p.slice(6, -7));
    else if (p.startsWith("<b>")) el("b", null, node, p.slice(3, -4));
    else node.appendChild(document.createTextNode(p));
  }
  return node;
}
function cssVar(n, k, v) { n.style.setProperty(k, v); return n; }
function selectEl(parent, options, value, label, cls) {
  const s = el("select", cls || "io-select", parent);
  s.setAttribute("aria-label", label);
  options.forEach(o => {
    const isObj = typeof o === "object";
    const opt = el("option", null, s, isObj ? o.label : o);
    opt.value = isObj ? o.value : o;
  });
  s.value = value;
  return s;
}
function textEl(parent, value, ph, label, cls) {
  const i = el("input", cls || "io-text", parent);
  i.type = "text"; i.value = value; if (ph) i.placeholder = ph;
  i.setAttribute("aria-label", label);
  return i;
}
function iconBtn(parent, glyph, label, title) {
  const b = el("button", "io-icon", parent, glyph);
  b.type = "button";
  b.setAttribute("aria-label", label);
  if (title) b.title = title;
  return b;
}

/* The grip is the handle, not the row. A row holds text inputs, and a
   browser gives a press on an input to the input, so a draggable row never
   starts a drag from inside one. */
function dragHandle(grip, row, onMove, index) {
  grip.draggable = true;
  grip.setAttribute("role", "button");
  grip.setAttribute("aria-label", "Drag to reorder");
  grip.title = "Drag to reorder";
  grip.addEventListener("dragstart", e => {
    row.classList.add("io-dragging");
    try { e.dataTransfer.setData("text/plain", String(index)); } catch (_) {}
    try { e.dataTransfer.effectAllowed = "move"; } catch (_) {}
  });
  grip.addEventListener("dragend", () => row.classList.remove("io-dragging"));

  row.addEventListener("dragover", e => {
    e.preventDefault();
    row.classList.add("io-dragover");
  });
  row.addEventListener("dragleave", () => row.classList.remove("io-dragover"));
  row.addEventListener("drop", e => {
    e.preventDefault();
    row.classList.remove("io-dragover");
    let from = NaN;
    try { from = Number(e.dataTransfer.getData("text/plain")); } catch (_) {}
    if (!Number.isNaN(from) && from !== index) onMove(from, index);
  });
  return grip;
}

function groupsFor(t) { return SCHEMA.filter(g => g.tab === t).sort((a, b) => a.order - b.order); }
function countSettings(t) {
  let n = 0;
  for (const g of groupsFor(t)) for (const it of g.items) if (it.kind !== "custom") n++;
  return n;
}
function field(id) { return FIELDS.find(f => f.id === id); }
function fieldsOn(side) { return FIELDS.filter(f => f.position === side); }
/* the value this line carries for whichever field the bars are set to */
function fieldValue(node) {
  const id = val("visual.tagBars.fieldId") || "status";
  const f = field(id);
  const token = node && node.v ? node.v[id] : null;
  if (!token || !f) return null;
  return f.values.find(v => v.token === token) || null;
}

/* ============================================================ Tabs */

function renderTabs() {
  const host = document.getElementById("tabs");
  host.textContent = "";
  TABS.forEach(t => {
    const b = el("button", "io-tab", host, t.label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.tab = t.id;
    const c = el("span", "io-tab__count", b, String(countSettings(t.id)));
    c.setAttribute("aria-hidden", "true");
    b.addEventListener("click", () => selectTab(t.id));
    b.addEventListener("keydown", e => {
      const i = TABS.findIndex(x => x.id === t.id);
      if (e.key === "ArrowRight") { e.preventDefault(); selectTab(TABS[(i + 1) % TABS.length].id, true); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); selectTab(TABS[(i - 1 + TABS.length) % TABS.length].id, true); }
    });
  });
  syncTabs();
}
function syncTabs() {
  document.querySelectorAll(".io-tab").forEach(b => {
    const isActive = b.dataset.tab === activeTab;
    b.classList.toggle("io-tab--active", isActive);
    b.setAttribute("aria-selected", isActive ? "true" : "false");
    b.tabIndex = isActive ? 0 : -1;
    const gate = TAB_MODULE[b.dataset.tab];
    const off = gate && !ctx.get(gate);
    b.querySelector(".io-tab__count").textContent = off ? "off" : String(countSettings(b.dataset.tab));
  });
}
function selectTab(id, focus) {
  activeTab = id; dialog = null;
  renderContent(true); syncTabs();
  if (focus) document.querySelector('.io-tab[data-tab="' + id + '"]').focus();
}
function jumpTo(id) {
  const owner = SCHEMA.find(g => g.items.some(it => it.id === id));
  if (!owner) return;
  activeTab = owner.tab;
  renderContent(true); syncTabs();
  requestAnimationFrame(() => {
    const node = document.querySelector('[data-item="' + id + '"]');
    if (!node) return;
    node.scrollIntoView({ block: "center", behavior: "smooth" });
    node.classList.remove("io-item--flash");
    void node.offsetWidth;
    node.classList.add("io-item--flash");
  });
}

/* ============================================================ Content */

function renderContent(resetScroll) {
  const host = document.getElementById("content");
  const keepScroll = resetScroll ? 0 : host.scrollTop;
  host.textContent = "";
  bindings.clear();
  previewRefreshers = [];
  document.querySelectorAll(".io-scrim").forEach(n => n.remove());
  queueMicrotask(() => { host.scrollTop = keepScroll; });

  bind("ui.showTips", renderContent);

  const gate = TAB_MODULE[activeTab];
  if (gate && !ctx.get(gate)) {
    const master = SCHEMA.find(g => g.id === "modules").items.find(i => i.path === gate);
    const g = el("div", "io-group", host);
    el("div", "io-group__heading", g, TABS.find(t => t.id === activeTab).label);
    renderItem(g, Object.assign({}, master, { id: master.id + "-tab" }));
    el("p", "io-empty", g, "This module is off, so its settings are hidden. Turn it on to configure it");
    return;
  }

  for (const group of groupsFor(activeTab)) {
    if (group.visible) for (const d of group.visible.deps) bind(d, renderContent);
    const forced = group.visible && !group.visible.test(ctx);
    if (forced && !showAll) continue;

    const g = el("div", "io-group" + (forced ? " io-group--forced" : ""), host);
    if (!/-intro$/.test(group.id)) {
      const h = el("div", "io-group__heading io-item__namerow", g, group.heading);
      attachTip(h, group.tip, group.heading, g);
      commentAffordance(h, g, "group:" + group.id);
    }
    if (group.intro) rich(el("p", "io-group__intro", g), group.intro);
    if (group.commands) {
      const row = el("div", "io-group__cmds", g);
      el("span", "io-group__cmdlabel", row, group.commands.length > 1 ? "Commands" : "Command");
      group.commands.forEach(cmd => commandChip(row, cmd));
    }
    for (const item of group.items) renderItem(g, item);
  }
  if (dialog) renderDialog();
}

/* A tip belongs directly under the thing it explains. Anchoring it to the
   row that carries the ? is the only way that stays true when the block
   below grows a table. */
function attachTip(anchorRow, text, label, fallbackHost) {
  if (!text || !ctx.get("ui.showTips")) return;
  let tipEl = null;
  const help = el("button", "io-help", anchorRow, "?");
  help.type = "button";
  help.setAttribute("aria-expanded", "false");
  help.setAttribute("aria-label", "More about " + label);
  help.addEventListener("click", () => {
    const shown = help.getAttribute("aria-expanded") === "true";
    help.setAttribute("aria-expanded", shown ? "false" : "true");
    if (shown) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
    tipEl = rich(el("div", "io-tip"), text);
    if (typeof anchorRow.insertAdjacentElement === "function") {
      anchorRow.insertAdjacentElement("afterend", tipEl);
    } else if (fallbackHost) {
      fallbackHost.appendChild(tipEl);
    }
  });
}

/* the same thing, taking an item so existing call sites read unchanged */
function attachTipItem(anchorRow, host, item) {
  attachTip(anchorRow, item.tip, item.name, host);
}

function helpButton(nameRow, info, item) {
  if (!item.tip || !ctx.get("ui.showTips")) return;
  /* on a settings row the description sits between, so the tip goes after it */
  let tipEl = null;
  const help = el("button", "io-help", nameRow, "?");
  help.type = "button";
  help.setAttribute("aria-expanded", "false");
  help.setAttribute("aria-label", "More about " + item.name);
  help.addEventListener("click", () => {
    const shown = help.getAttribute("aria-expanded") === "true";
    help.setAttribute("aria-expanded", shown ? "false" : "true");
    if (shown) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
    tipEl = rich(el("div", "io-tip"), item.tip);
    const anchor = info.querySelector(".io-meta");
    if (anchor) info.insertBefore(tipEl, anchor); else info.appendChild(tipEl);
  });
}

function renderItem(parent, item) {
  if (item.kind === "custom") {
    if (item.visible) for (const d of item.visible.deps) bind(d, renderContent);
    const hidden = item.visible && !item.visible.test(ctx);
    if (hidden && !showAll) return;
    const holder = el("div", "io-custom" + (hidden ? " io-item--forced" : ""), parent);
    holder.dataset.item = item.id;
    if (commentMode || String(NOTES["item:" + item.id] || "").trim()) {
      const bar = el("div", "io-item__namerow", holder);
      el("div", "io-cell", bar, item.id);
      commentAffordance(bar, holder, "item:" + item.id);
    }
    item.render(holder, ctx);
    return;
  }

  if (item.visible) for (const d of item.visible.deps) bind(d, renderContent);
  const forced = item.visible && !item.visible.test(ctx);
  if (forced && !showAll) return;

  const row = el("div", "io-item" + (forced ? " io-item--forced" : ""), parent);
  row.dataset.item = item.id;
  const info = el("div", "io-item__info", row);
  const nameRow = el("div", "io-item__namerow", info);
  el("div", "io-item__name", nameRow, item.name);
  helpButton(nameRow, info, item);
  if (item.desc) rich(el("div", "io-item__desc", info), item.desc);

  const meta = el("div", "io-meta", info);
  el("code", "is-id", meta, item.id);
  if (item.path) el("code", null, meta, item.path);
  if (item.searchTerms) el("code", null, meta, "was: " + item.searchTerms.join(", "));

  commentAffordance(nameRow, info, "item:" + item.id);

  if (item.seeAlso) {
    const link = el("button", "io-see", info, "→ " + item.seeAlso.label);
    link.type = "button";
    link.addEventListener("click", () => ctx.goTo(item.seeAlso.id));
  }

  const control = el("div", "io-item__control", row);
  CONTROLS[item.kind](control, item);

  if (item.disabled) {
    const apply = () => row.classList.toggle("io-item--disabled", item.disabled.test(ctx));
    apply();
    for (const d of item.disabled.deps) bind(d, apply);
  }
}

/* ============================================================ Controls */

const CONTROLS = {
  toggle(host, item) {
    const input = el("input", "io-toggle", host);
    input.type = "checkbox";
    input.checked = !!ctx.get(item.path);
    input.setAttribute("aria-label", item.name);
    input.addEventListener("change", () => ctx.set(item.path, input.checked));
    bind(item.path, () => { input.checked = !!ctx.get(item.path); });
  },
  dropdown(host, item) {
    const s = selectEl(host, item.options, String(ctx.get(item.path)), item.name);
    s.addEventListener("change", () => ctx.set(item.path, s.value));
    bind(item.path, () => { s.value = String(ctx.get(item.path)); });
  },
  /* PRD Р-6: the unit is on the control, and the value is written on
     release rather than on every pixel of the drag. */
  slider(host, item) {
    const range = el("input", "io-range", host);
    range.type = "range";
    range.min = item.min; range.max = item.max; range.step = item.step;
    range.value = ctx.get(item.path);
    range.setAttribute("aria-label", item.name);
    const out = el("span", "io-value", host);
    const fmt = v => v + (item.unit ? " " + item.unit : "");
    out.textContent = fmt(range.value);
    range.addEventListener("input", () => {
      out.textContent = fmt(range.value);
      out.classList.add("io-value--pending");
      out.classList.remove("io-value--saved");
      LIVE[item.path] = Number(range.value);
      refreshPreviews();
    });
    range.addEventListener("change", () => {
      ctx.set(item.path, Number(range.value));
      out.classList.remove("io-value--pending");
      out.classList.add("io-value--saved");
      setTimeout(() => out.classList.remove("io-value--saved"), 900);
    });
    bind(item.path, () => { range.value = ctx.get(item.path); out.textContent = fmt(range.value); });
  },
  number(host, item) {
    const input = el("input", "io-number", host);
    input.type = "number";
    if (item.min != null) input.min = item.min;
    if (item.max != null) input.max = item.max;
    input.value = ctx.get(item.path);
    input.setAttribute("aria-label", item.name);
    input.addEventListener("change", () => ctx.set(item.path, Number(input.value)));
    bind(item.path, () => { input.value = ctx.get(item.path); });
  },
  /* PRD Р-7: written on blur and Enter, not on every keystroke. */
  text(host, item) {
    const cls = "io-text" + (item.wide ? " io-text--wide" : "") + (item.mono ? " io-text--mono" : "");
    const input = el("input", cls, host);
    input.type = "text";
    input.value = ctx.get(item.path) ?? "";
    input.setAttribute("aria-label", item.name);
    input.addEventListener("input", () => { LIVE[item.path] = input.value; refreshPreviews(); });
    input.addEventListener("blur", () => ctx.set(item.path, input.value));
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    bind(item.path, () => { if (document.activeElement !== input) input.value = ctx.get(item.path) ?? ""; });
  },
  textarea(host, item) {
    const ta = el("textarea", "io-textarea", host);
    ta.rows = item.rows || 4;
    ta.value = ctx.get(item.path) ?? "";
    ta.setAttribute("aria-label", item.name);
    ta.addEventListener("blur", () => ctx.set(item.path, ta.value));
    bind(item.path, () => { if (document.activeElement !== ta) ta.value = ctx.get(item.path) ?? ""; });
  },
  color(host, item) {
    const input = el("input", "io-color", host);
    input.type = "color";
    input.value = ctx.get(item.path) || item.default;
    input.setAttribute("aria-label", item.name);
    input.addEventListener("input", () => { LIVE[item.path] = input.value; refreshPreviews(); });
    input.addEventListener("change", () => ctx.set(item.path, input.value));
    if (item.allowReset) {
      const reset = el("button", "io-reset", host, "Reset");
      reset.type = "button";
      reset.addEventListener("click", () => ctx.set(item.path, item.default));
    }
    bind(item.path, () => { input.value = ctx.get(item.path) || item.default; });
  },
  buttons(host, item) {
    for (const b of item.buttons) {
      const btn = el("button", "io-btn" + (b.cta ? " io-btn--cta" : ""), host, b.label);
      btn.type = "button";
      btn.addEventListener("click", () => ctx.run(b.action));
    }
  }
};

/* ============================================================ Preview parts */

/* One color per field type, so the same type always looks the same. */
const TYPE_COLOR = { tag: "#c2683f", link: "#3b82c4", element: "#7a9e3b" };

/* A field has no color of its own: a tag field borrows its first value's
   fill, everything else takes the color of its type. */
function fieldColor(f) {
  if (f.type === "tag") {
    const v = f.values.find(x => x.depth === 0);
    return v ? v.color : TYPE_COLOR.tag;
  }
  return TYPE_COLOR[f.type];
}

function previewShell(host, caption, tip) {
  const box = el("div", "io-preview", host);
  const cap = el("div", "io-preview__cap", box);
  el("span", null, cap, caption);
  attachTip(cap, tip, caption, box);
  el("span", "io-preview__rule", cap);
  return box;
}
function applyTagVars(node) {
  cssVar(node, "--io-opacity-left",  String(val("visual.tags.opacityLeft") / 100));
  cssVar(node, "--io-opacity-right", String(val("visual.tags.opacityRight") / 100));
  cssVar(node, "--io-text-scale",    String(val("visual.tags.textSizePct") / 100));
  cssVar(node, "--io-bubble-x",      String(val("visual.tags.bubbleWidthPct") / 100));
  cssVar(node, "--io-bubble-y",      String(val("visual.tags.bubbleHeightPct") / 100));
  cssVar(node, "--io-empty-x",       String(val("visual.tags.emptyBubblePct") / 100));
  cssVar(node, "--io-corners",       String((100 - val("visual.tags.cornersPct")) / 100));
}
/* A bubble with no text keeps a normal bubble's height: the non-breaking
   space holds the line box open while the color hides it. */
function bubble(parent, v, textOverride) {
  const empty = v.shown === "nothing";
  const label = empty ? " " : (textOverride != null ? textOverride
    : (v.shown === "custom" ? (v.custom || " ") : "#" + v.token));
  const b = el("span", "io-bubble" + (empty ? " io-bubble--empty" : ""), parent, label);
  cssVar(b, "--io-bubble-bg", v.color);
  if (v.textColor) cssVar(b, "--io-bubble-fg", v.textColor);
  return b;
}
function pickPair(f) {
  for (let i = 0; i < f.values.length; i++) {
    if (f.values[i].depth === 0 && f.values[i + 1] && f.values[i + 1].depth === 1) {
      return [f.values[i], f.values[i + 1]];
    }
  }
  return [f.values.find(v => v.depth === 0) || null, null];
}
function renderTagField(parent, f) {
  const [p, c] = pickPair(f);
  if (!p) { el("span", "io-bubble io-bubble--empty", parent, " "); return; }
  if (!c) { bubble(parent, p); return; }
  if (val("pkm.behavior.childTagFormat") === "combined") bubble(parent, c, "#" + p.token + "/" + c.token);
  else { bubble(parent, p); bubble(parent, c); }
}
function renderFieldToken(parent, f) {
  if (f.type === "tag") return renderTagField(parent, f);
  if (f.type === "link") {
    const v = f.values[0];
    el("span", "io-link", parent, v ? v.token : "[[ ]]");
    return;
  }
  el("span", "io-elem", parent, f.marker + " " + f.format);
}

function fieldChip(parent, f) {
  const b = el("span", "io-bubble", parent, f.short || f.name);
  cssVar(b, "--io-bubble-bg", fieldColor(f));
  return b;
}
/* The shape of a line: one chip per field, in writing order. */
function structuralLine(parent, chipFor) {
  const line = el("div", "io-line", parent);
  applyTagVars(line);
  el("span", "io-line__prefix", line, "- ");
  const put = (side, list) => list.forEach(f => (chipFor ? chipFor(side, f) : fieldChip(side, f)));
  const left = fieldsOn("Left");
  if (left.length) put(el("span", "io-line__side io-line__side--left", line), left);
  el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator1") || "||"));
  el("span", "io-line__text", line, "your text");
  el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator2") || "||"));
  const right = fieldsOn("Right");
  if (right.length) put(el("span", "io-line__side io-line__side--right", line), right);
  else el("span", "io-line__hint", line, "nothing on the right yet");
  return line;
}



function renderLinePreview(host) {
  const box = previewShell(host, "Live preview",
    "One chip per Field, in the order they are written. Everything you change below shows up here: rename a Field, " +
    "give it a short name, move it to the other side, or change a Separator");
  const holder = el("div", "io-struct", box);

  /* Three rows on one grid: the line, then the block brackets, then the
     separator captions. The captions are taken out of the flow so a long
     word cannot widen the narrow separator column. */
  const draw = () => {
    holder.textContent = "";
    applyTagVars(holder);

    const cell = (cls, fill) => {
      const c = el("div", "io-struct__cell " + cls, holder);
      if (fill) fill(c);
      return c;
    };
    cell("io-struct__prefix", c => el("span", "io-line__prefix", c, "- "));
    cell("io-struct__side io-line__side--left", c => fieldsOn("Left").forEach(f => fieldChip(c, f)));
    cell("io-struct__sep", c => el("span", "io-line__sep", c, String(val("pkm.lineFormat.separator1") || "||")));
    cell("io-struct__text", c => el("span", "io-line__text", c, "your text"));
    cell("io-struct__sep", c => el("span", "io-line__sep", c, String(val("pkm.lineFormat.separator2") || "||")));
    cell("io-struct__side io-line__side--right", c => {
      const right = fieldsOn("Right");
      if (right.length) right.forEach(f => fieldChip(c, f));
      else el("span", "io-line__hint", c, "empty");
    });

    /* row two: brackets under the two blocks, a tick under each separator */
    el("div", null, holder);
    const block = text => {
      const w = el("div", "io-struct__block", holder);
      el("div", "io-struct__bracket", w);
      el("div", "io-struct__name", w, text);
    };
    block("Left Block");
    el("div", "io-struct__tick", holder);
    el("div", null, holder);
    el("div", "io-struct__tick", holder);
    block("Right Block");

    /* row three: the separator captions, centred on their own column */
    el("div", null, holder);
    el("div", null, holder);
    el("span", null, el("div", "io-struct__sepname", holder), "separator 1");
    el("div", null, holder);
    el("span", null, el("div", "io-struct__sepname", holder), "separator 2");
    el("div", null, holder);
  };

  draw();
  previewRefreshers.push(draw);
  ["pkm.lineFormat.separator1", "pkm.lineFormat.separator2"].forEach(p => bind(p, draw));
}

function renderTagPreview(host) {

function renderBarsPreview(host) {
  const box = previewShell(host, "Live preview",
    "A Bar belongs to the line that carries the Field, and runs the full height of that line and everything nested " +
    "under it \u2014 tagged or not. Deeper lines with a Value of their own get a Bar in the next lane along. Every Bar " +
    "sits in the margin, so the text column never moves");
  const tree = el("div", "io-tree", box);

  const drawLine = (parent, node, depth) => {
    const line = el("div", "io-line", parent);
    applyTagVars(line);
    cssVar(line, "--io-depth", String(depth));
    el("span", "io-line__prefix", line, "- ");
    /* the line always carries whatever it carries: switching the field
       changes the bars, never the text */
    const active = ctx.get("visual.tagBars.active");
    const chosen = val("visual.tagBars.fieldId") || "status";
    const hideChosen = active && !ctx.get("visual.tagBars.tagVisibility");
    const shown = [];
    ["status", "priority"].forEach(id => {
      const token = node.v ? node.v[id] : null;
      if (!token) return;
      if (id === chosen && hideChosen) return;
      const f = field(id);
      const value = f && f.values.find(x => x.token === token);
      if (value) shown.push(value);
    });
    if (shown.length) {
      const sideEl = el("span", "io-line__side io-line__side--left", line);
      shown.forEach(value => bubble(sideEl, value));
    }
    /* the Separator only goes when nothing is left in front of the text.
       If the one tag there was is the one the Bar replaced, whether the
       Separator goes with it is what the setting below decides. */
    const replaced = hideChosen && !!fieldValue(node);
    const sepHidden = !shown.length &&
      (!replaced || ctx.get("visual.tagBars.hideSeparatorWhenOnlyStripToken"));
    if (!sepHidden) el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator1") || "||"));
    el("span", "io-line__text", line, node.text);
  };

  const drawNode = (parent, node, depth, lane) => {
    const active = ctx.get("visual.tagBars.active");
    const cap = val("visual.tagBars.stripesToShow");
    const v = fieldValue(node);
    const bar = active && v && lane < cap;

    const nodeBox = el("div", "io-node" + (bar ? " io-node--bar" : ""), parent);
    if (bar) {
      cssVar(nodeBox, "--io-bar-color", v.color);
      cssVar(nodeBox, "--io-lane", String(lane));
    }
    drawLine(nodeBox, node, depth);
    node.children.forEach(c => drawNode(nodeBox, c, depth + 1, bar ? lane + 1 : lane));
  };

  const draw = () => {
    tree.textContent = "";
    cssVar(tree, "--io-bar-thickness", val("visual.tagBars.thickness") + "px");
    cssVar(tree, "--io-bar-gap",       val("visual.tagBars.childOffset") + "px");
    cssVar(tree, "--io-bar-distance",  val("visual.tagBars.spacing") + "px");
    TREE.forEach(n => drawNode(tree, n, 0, 0));
  };
  draw();
  previewRefreshers.push(draw);
  ["visual.tagBars.active", "visual.tagBars.tagVisibility", "visual.tagBars.fieldId",
   "visual.tagBars.hideSeparatorWhenOnlyStripToken", "visual.tagBars.stripesToShow",
   "visual.tagBars.thickness", "visual.tagBars.childOffset", "visual.tagBars.spacing"]
    .forEach(p => bind(p, draw));
}

function renderWheelPreview(host) {
  const box = previewShell(host, "Live preview",
    "The middle row is your line. The scroller sits on the second Field from the left and shows exactly what the " +
    "settings ask for: <code>Values per side</code> rows on each side that <code>Opens</code> allows. The list is a " +
    "loop, so it keeps going past the last Value and starts again");
  const stage = el("div", "io-wheelstage", box);

  const draw = () => {
    stage.textContent = "";
    const scroller  = ctx.get("visual.tagWheel.scroller.enabled");
    const perSide   = scroller ? val("visual.tagWheel.scroller.size") : 0;
    const direction = ctx.get("visual.tagWheel.scroller.direction");
    const markers   = ctx.get("visual.tagWheel.showMarkers");

    const left = fieldsOn("Left");
    const shown = left[1] || left[0] || FIELDS[0];
    const values = shown.type === "element" ? [shown.marker + " " + shown.format]
      : shown.values.map(v => (markers ? "#" : "") + v.token);
    const n = values.length;
    const at = n > 2 ? Math.floor(n / 2) : 0;   /* the middle, so both sides read clearly */

    /* upwards you keep meeting the next value, downwards the previous one,
       both wrapping round the loop, so the panel is always full */
    const rows = perSide && n ? perSide : 0;
    const upIdx = [], downIdx = [];
    for (let k = rows; k >= 1; k--) upIdx.push((at + k) % n);
    for (let k = 1; k <= rows; k++) downIdx.push(((at - k) % n + n) % n);
    const up   = direction === "down" ? [] : upIdx;
    const down = direction === "up"   ? [] : downIdx;

    const ROW = 21;
    cssVar(box, "--io-wheel-up",   (up.length   ? up.length   * ROW + 14 : 0) + "px");
    cssVar(box, "--io-wheel-down", (down.length ? down.length * ROW + 14 : 0) + "px");

    const panel = (idx, where) => {
      if (!idx.length) return null;
      const p = el("span", "io-wheelpanel io-wheelpanel--" + where, null);
      cssVar(p, "--io-wheel-bg", val("visual.tagWheel.fillColor") || "#f1e596");
      cssVar(p, "--io-wheel-fg", val("visual.tagWheel.textColor") || "#5d5b6b");
      idx.forEach(i => el("span", "io-wheelval", p, values[i]));
      return p;
    };

    structuralLine(stage, (side, f) => {
      const isShown = f === shown;
      const col = el("span", "io-wheelcol", side);
      const chip = el("span", "io-bubble" + (isShown ? " io-bubble--current" : ""), col,
        isShown ? values[at] : (f.short || f.name));
      cssVar(chip, "--io-bubble-bg", fieldColor(f));
      if (!isShown) return;
      const u = panel(up, "up");
      if (u) col.appendChild(u);
      const d = panel(down, "down");
      if (d) col.appendChild(d);
    });
  };
  draw();
  previewRefreshers.push(draw);
  ["visual.tagWheel.scroller.size", "visual.tagWheel.scroller.direction",
   "visual.tagWheel.scroller.enabled", "visual.tagWheel.showMarkers",
   "visual.tagWheel.fillColor", "visual.tagWheel.textColor",
   "pkm.lineFormat.separator1", "pkm.lineFormat.separator2"].forEach(p => bind(p, draw));
}

/* ============================================================ Fields editor */

/* A field and the child field that belongs to it move as one block: the
   child takes its side from the parent, so it can never end up on the
   opposite side of the line. */
function fieldBlock(f) {
  const out = [f];
  FIELDS.forEach(x => { if (x.parent === f.id) out.push(x); });
  return out;
}
function blockOwner(f) { return f.parent ? (field(f.parent) || f) : f; }

function setFieldSide(f, side) {
  const owner = blockOwner(f);
  fieldBlock(owner).forEach(x => { x.position = side; });
  refreshPreviews();
  renderContent();
}

/* Put the dragged block immediately before the field it was dropped on,
   and adopt that field's side. */
function moveFieldBefore(dragged, target) {
  const owner = blockOwner(dragged);
  if (!owner || owner === blockOwner(target)) return;
  const block = fieldBlock(owner);
  const side = blockOwner(target).position;
  block.forEach(x => { x.position = side; });
  block.forEach(x => { const i = FIELDS.indexOf(x); if (i >= 0) FIELDS.splice(i, 1); });
  const at = Math.max(0, FIELDS.indexOf(target));
  FIELDS.splice(at, 0, ...block);
  refreshPreviews();
  renderContent();
}
function moveFieldToSideEnd(dragged, side) {
  const owner = blockOwner(dragged);
  if (!owner) return;
  const block = fieldBlock(owner);
  block.forEach(x => { x.position = side; });
  block.forEach(x => { const i = FIELDS.indexOf(x); if (i >= 0) FIELDS.splice(i, 1); });
  FIELDS.push(...block);
  refreshPreviews();
  renderContent();
}

/* Стрелка на краю стороны переносит Field через линию: иначе с клавиатуры
   сторону не сменить, а тянуть мышью — единственный путь, чего быть не должно. */
function stepField(f, dir) {
  const owner = blockOwner(f);
  const side = owner.position;
  const peers = FIELDS.filter(x => !x.parent && x.position === side);
  const i = peers.indexOf(owner);
  const target = peers[i + dir];
  if (target) {
    if (dir < 0) moveFieldBefore(owner, target);
    else if (peers[i + 2]) moveFieldBefore(owner, peers[i + 2]);
    else moveFieldToSideEnd(owner, side);
    return;
  }
  /* Край стороны: уходим через линию. Left Block нарисован выше Right, и
     стрелка обязана этому подчиняться: вниз с низа Left попадаешь в начало
     Right, вверх с верха Right — в конец Left. */
  const other = side === "Left" ? "Right" : "Left";
  const there = FIELDS.filter(x => !x.parent && x.position === other);
  if (dir > 0 && there[0]) moveFieldBefore(owner, there[0]);
  else moveFieldToSideEnd(owner, other);
}

function renderFieldList(list) {
  let dragged = null;

  const side = (value, label, hint) => {
    const sec = el("div", "io-side", list);
    const cap = el("div", "io-side__cap", sec);
    el("span", "io-side__label", cap, label);
    if (hint) el("span", "io-side__hint", cap, hint);

    sec.addEventListener("dragover", e => { e.preventDefault(); sec.classList.add("io-side--over"); });
    sec.addEventListener("dragleave", () => sec.classList.remove("io-side--over"));
    sec.addEventListener("drop", e => {
      e.preventDefault();
      sec.classList.remove("io-side--over");
      if (dragged) moveFieldToSideEnd(dragged, value);
    });

    const rows = FIELDS.filter(f => f.position === value);
    if (!rows.length) el("div", "io-side__empty", sec, "nothing on this side");

    rows.forEach(f => {
      const b = el("div", "io-fields__item" + (f.parent ? " io-fields__item--child" : ""), sec);
      const current = f.id === selectedFieldId;
      b.setAttribute("aria-current", current ? "true" : "false");

      const grip = el("span", "io-grip", b, "⠿");
      grip.draggable = true;
      grip.setAttribute("role", "button");
      grip.setAttribute("aria-label", "Drag " + f.name + " to reorder it or move it to the other side");
      grip.title = f.parent ? "Moves with " + field(f.parent).name : "Drag to reorder, or across the line to change side";
      grip.addEventListener("dragstart", e => {
        dragged = f;
        b.classList.add("io-dragging");
        try { e.dataTransfer.setData("text/plain", f.id); } catch (_) {}
      });
      grip.addEventListener("dragend", () => { b.classList.remove("io-dragging"); dragged = null; });

      b.addEventListener("dragover", e => { e.preventDefault(); e.stopPropagation(); b.classList.add("io-dragover"); });
      b.addEventListener("dragleave", () => b.classList.remove("io-dragover"));
      b.addEventListener("drop", e => {
        e.preventDefault(); e.stopPropagation();
        b.classList.remove("io-dragover");
        if (dragged) moveFieldBefore(dragged, f);
      });

      /* выбор — кнопка внутри ряда, а не сам ряд: рядом стоят ещё две кнопки */
      const pick = el("button", "io-fields__pick", b);
      pick.type = "button";
      el("span", "io-fields__name", pick, f.name);
      cssVar(el("span", "io-chip io-chip--typed", pick, TYPE_LABEL[f.type]), "--io-chip-bg", TYPE_COLOR[f.type]);
      pick.addEventListener("click", () => { selectedFieldId = f.id; renderContent(); });

      /* Дочерний Field ходит за родителем, своих стрелок у него нет */
      const tools = el("span", "io-fields__tools", b);
      if (!f.parent) {
        const up = iconBtn(tools, "↑", "Move " + f.name + " up",
          "Move up, and across the line at the top");
        up.addEventListener("click", ev => { ev.stopPropagation(); stepField(f, -1); });
        const down = iconBtn(tools, "↓", "Move " + f.name + " down",
          "Move down, and across the line at the bottom");
        down.addEventListener("click", ev => { ev.stopPropagation(); stepField(f, 1); });
      }
    });
    return sec;
  };

  side("Left", "Left Block", "");
  el("div", "io-side__rule", list);
  side("Right", "Right Block", "");

  const addWrap = el("div", "io-fields__add", list);
  const add = el("button", "io-btn io-btn--sm", addWrap, "Add Field");
  add.type = "button";

}

function valuesTable(host, f) {
  const isLink = f.type === "link";
  const box = el("div", "io-vals" + (isLink ? " io-vals--link" : ""), host);
  const scroll = el("div", "io-scroll", box);
  const inner = el("div", "io-vals__inner" + (isLink ? " io-vals__inner--link" : ""), scroll);

  const head = el("div", "io-vals__head", inner);
  (isLink ? ["", "Value", "Prefix", ""]
          : ["", "Level", "Value", "Prefix", "Show", "Fill", "Text", "Preview", ""])
    .forEach(t => el("div", null, head, t));

  f.values.forEach((v, i) => {
    const row = el("div", "io-vals__row" + (v.depth ? " io-vals__row--child" : ""), inner);
    dragHandle(el("div", "io-grip", row, "\u283F"), row, (from, to) => moveIn(f.values, from, to), i);

    if (!isLink) {
      const depth = el("div", "io-depthcell", row);
      const prev = f.values[i - 1];
      if (v.depth) {
        const out = iconBtn(depth, "\u2190", "Make " + v.token + " a top-level Value", "Move out one level");
        out.addEventListener("click", () => { v.depth = 0; renderContent(); });
      } else {
        const inn = iconBtn(depth, "\u2192", "Make " + v.token + " a child Value", "Move in one level");
        inn.disabled = !prev || prev.depth === 1;
        inn.addEventListener("click", () => { v.depth = 1; renderContent(); });
      }
    }

    const cell = el("div", "io-valcell", row);

/* how many fields share this property decides Auto */
function isList(f, sharing) {
  const c = f.cardinality || "auto";
  if (c === "list") return true;
  if (c === "one") return false;
  return sharing > 1;
}



function yamlValueFor(f) {
  /* the plain form never carries a marker: no hash on a tag, no emoji on an
     element, no brackets on a link */
  const plain = f.type === "element" ? f.format
    : f.type === "link" ? String(f.values[0] ? f.values[0].token : "value").replace(/^\[\[|\]\]$/g, "")
    : (f.values[0] ? f.values[0].token : "value");
  const asWritten = f.type === "element" ? f.marker + " " + plain
    : f.type === "tag" ? "#" + plain
    : "[[" + plain + "]]";
  return (f.valueRule || "raw") === "clean" ? plain : asWritten;
}

function yamlLineFor(f) {
  const sharing = FIELDS.filter(x => x.property && x.property === f.property).length;
  const v = yamlValueFor(f);
  return isList(f, sharing) ? f.property + ": [" + v + "]" : f.property + ": " + v;
}

function propertyPicker(host, f, redraw) {
  const wrap = el("div", "io-pick2", host);

    list.textContent = "";
    const q = String(input.value || "").trim().toLowerCase();

      const b = el("button", "io-pick2__opt", list);

        e.preventDefault();
        f.property = p.name;
        input.value = p.name;
        close();
        redraw();
        refreshPreviews();
      });
    });
  };
  input.addEventListener("focus", fill);
  input.addEventListener("input", () => { f.property = input.value; fill(); });
  input.addEventListener("blur", () => { setTimeout(() => { close(); redraw(); refreshPreviews(); }, 60); });
  return wrap;
}

/* ============================================================ Smart rules */

function kindOf(id) { return KINDS.find(k => k.id === id); }
function pickValues(kind) {
  if (kind === "tag") {
    return FIELDS.filter(f => f.type === "tag").map(f => ({ name:f.name, values:f.values.map(v => "#" + v.token) }));
  }
  if (kind === "element") {
    return FIELDS.filter(f => f.type === "element").map(f => ({ name:f.name, values:[f.marker] }));
  }
  return FIELDS.filter(f => f.type === "link").map(f => ({ name:f.name, values:f.values.map(v => v.token) }));
}

function renderSmartRules(host) {
  const list = el("div", "io-rules", host);

  RULES.forEach((r, i) => {
    const card = el("div", "io-rule" + (r.enabled ? "" : " io-rule--off") + (r.conflict ? " io-rule--clash" : ""), list);

    el("span", "io-rule__n", head, String(i + 1));

    name.placeholder = "Name this rule (optional)";

    const rm = iconBtn(tools, "✕", "Remove rule " + (i + 1), "Remove this rule");
    rm.addEventListener("click", () => { RULES.splice(i, 1); renderContent(); });

    const conds = el("div", "io-rule__conds", main);
    KINDS.forEach(k => {
      const mine = r.conditions.filter(c => c.kind === k.id);
      const grp = el("div", "io-kind" + (mine.length ? "" : " io-kind--empty"), conds);
      el("div", "io-kind__label", grp, k.label);
      const chips = el("div", "io-kind__chips", grp);
      if (!mine.length) el("span", "io-kind__none", chips, "any");
      mine.forEach((c, ci) => {
        if (ci) el("span", "io-op" + (c.op === "and" ? " io-op--and" : ""), chips, c.op || "or");
        const chip = el("span", "io-vchip", chips, c.value || "(empty)");

        x.disabled = r.conditions.length < 2;
        x.addEventListener("click", () => {
          r.conditions.splice(r.conditions.indexOf(c), 1);

          if (rest.length) rest[0].op = "or";
          renderContent();
        });
      });
      const plus = iconBtn(grp, "+", "Add a " + k.label.toLowerCase() + " to rule " + (i + 1),
        "Add a " + k.label.toLowerCase());

    RULES.push({ id:"r" + (RULES.length + 1), name:"", enabled:true, template:"None", conflict:"", conditions:[] });
    renderContent();
  });

}

function renderDialog() {
  const kind = kindOf(dialog.kind);
  const rule = RULES.find(r => r.id === dialog.ruleId);
  if (!rule) { dialog = null; return; }
  const existing = rule.conditions.filter(c => c.kind === dialog.kind);
  const groups = pickValues(dialog.kind);
  const picked = groups.find(g => g.name === dialog.fieldName) || groups[0];

  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) { dialog = null; renderContent(); } });

  const dlg = el("div", "io-dlg", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Add a " + kind.label.toLowerCase() + " condition");

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Add a " + kind.label.toLowerCase());
  const close = iconBtn(head, "✕", "Cancel");
  close.style.setProperty("margin-left", "auto");
  close.addEventListener("click", () => { dialog = null; renderContent(); });

  const body = el("div", "io-dlg__body", dlg);

  if (existing.length) {
    const row = el("div", "io-item", body);
    const info = el("div", "io-item__info", row);
    el("div", "io-item__name", info, "Combine with");
    el("div", "io-item__desc", info, "or: the line needs any one of them. and: the line needs all of them");
    const s = selectEl(el("div", "io-item__control", row),
      [{ value:"or", label:"or" }, { value:"and", label:"and" }], dialog.op, "Operator");
    s.addEventListener("change", () => { dialog.op = s.value; });
  }

  const fRow = el("div", "io-item", body);
  const fi = el("div", "io-item__info", fRow);
  el("div", "io-item__name", fi, "Field");
  el("div", "io-item__desc", fi, "Pick a Field to list its Values");
  const fs = selectEl(el("div", "io-item__control", fRow), groups.map(g => g.name), picked.name, "Field to pick from");
  fs.addEventListener("change", () => { dialog.fieldName = fs.value; dialog.value = ""; renderContent(); });

  const vRow = el("div", "io-item", body);
  const vi = el("div", "io-item__info", vRow);
  el("div", "io-item__name", vi, "Value");
  el("div", "io-item__desc", vi, "Type it, or choose below");
  const input = textEl(el("div", "io-item__control", vRow), dialog.value, kind.ph, "Value", "io-text io-text--mono");

  const picks = el("div", "io-picks", body);
  const buttons = [];
  picked.values.forEach(v => {
    const b = el("button", "io-pick", picks, v);
    b.type = "button";
    b.addEventListener("click", () => { dialog.value = v; input.value = v; sync(); });
    buttons.push([b, v]);
  });

  el("p", "io-note", body, dialog.kind === "tag"
    ? "A Value is stored without its Field name, and with or without the hash — both work"
    : "Anything the line actually contains can be used, not only configured Fields");

  const foot = el("div", "io-dlg__foot", dlg);
  const cancel = el("button", "io-btn", foot, "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => { dialog = null; renderContent(); });
  const save = el("button", "io-btn io-btn--cta", foot, "Add");
  save.type = "button";
  save.addEventListener("click", () => {
    rule.conditions.push({ kind:dialog.kind, value:dialog.value.trim(), op:existing.length ? dialog.op : "or" });
    dialog = null;
    renderContent();
  });

  function sync() {
    buttons.forEach(([b, v]) => b.setAttribute("aria-pressed", dialog.value === v ? "true" : "false"));
    save.disabled = !String(dialog.value || "").trim();
  }
  input.addEventListener("input", () => { dialog.value = input.value; sync(); });
  sync();

  const esc = e => {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    dialog = null; renderContent();
  };
  document.addEventListener("keydown", esc);
  input.focus();
}

/* ============================================================ Command reference */

/* ============================================================ Comment mode
   Notes are keyed by the schema id, kept in localStorage so a reload does not
   lose them, and exported as Markdown you can paste straight back into chat.
   ============================================================ */

const NOTES_KEY = "inline-overhaul-prototype-notes-v1";
let NOTES = {};
let commentMode = false;

try {
  const raw = window.localStorage.getItem(NOTES_KEY);
  if (raw) NOTES = JSON.parse(raw) || {};
} catch (_) { NOTES = {}; }

function saveNotes() {
  try { window.localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (_) {}
  const n = Object.keys(NOTES).filter(k => String(NOTES[k] || "").trim()).length;
  const badge = document.getElementById("opt-count");
  if (badge) badge.textContent = String(n);
}

/* Where a note belongs, in words, so the export reads without the prototype. */
function noteContext(key) {
  const id = key.replace(/^(item|group):/, "");
  for (const g of SCHEMA) {
    if (key === "group:" + g.id) {
      const tab = TABS.find(t => t.id === g.tab);
      return (tab ? tab.label : g.tab) + " / " + g.heading + "  (whole group)";
    }
    for (const it of g.items) {
      if (it.id !== id) continue;
      const tab = TABS.find(t => t.id === g.tab);
      const what = it.kind === "custom" ? "custom block" : (it.name || it.id);
      return (tab ? tab.label : g.tab) + " / " + g.heading + " / " + what;
    }
  }
  /* a sub-key such as values/header or value/todo */
  if (id.includes("/")) {
    const [base, part] = [id.split("/")[0], id.split("/").slice(1).join("/")];
    const pretty = { values:"Values table", value:"Value", placement:"Placement",
                     element:"Element", "field-editor":"Fields editor" }[base] || base;
    return pretty + " \u2192 " + part;
  }
  return id;
}

/* A comment anchored to part of a custom block: one table row, one column
   header, one control. Silent unless comment mode is on. */
function subComment(nameRow, holder, suffix) {
  if (!commentMode && !String(NOTES["item:" + suffix] || "").trim()) return;
  commentAffordance(nameRow, holder, "item:" + suffix);
}

/* One comment affordance: a button that opens an editor under the row. */
function commentAffordance(nameRow, holder, key) {
  if (!commentMode) {
    const saved = String(NOTES[key] || "").trim();
    if (saved) el("div", "io-csaved", holder, saved);
    return;
  }

  const has = !!String(NOTES[key] || "").trim();
  const btn = el("button", "io-cbtn" + (has ? " io-cbtn--has" : ""), nameRow, has ? "*" : "+");
  btn.type = "button";
  btn.title = has ? "Edit your comment" : "Add a comment";
  btn.setAttribute("aria-label", (has ? "Edit" : "Add") + " a comment on " + noteContext(key));
  btn.setAttribute("aria-expanded", "false");

  let wrap = null;
  const close = () => {
    if (wrap) { wrap.remove(); wrap = null; }
    btn.setAttribute("aria-expanded", "false");
  };
  const open = () => {
    btn.setAttribute("aria-expanded", "true");
    wrap = el("div", "io-cwrap", holder);
    const area = el("textarea", "io-carea", wrap);
    area.value = NOTES[key] || "";
    area.placeholder = "What is wrong here, or what it should say instead";
    area.setAttribute("aria-label", "Comment on " + noteContext(key));
    const meta = el("div", "io-cmeta", wrap);
    el("code", null, meta, key);
    const done = el("button", "io-btn io-btn--sm", meta, "Save");
    done.type = "button";
    const drop = el("button", "io-reset", meta, "Delete");
    drop.type = "button";
    const commit = () => {
      const v = area.value.trim();
      if (v) NOTES[key] = v; else delete NOTES[key];
      saveNotes();
    };
    area.addEventListener("blur", commit);
    done.addEventListener("click", () => { commit(); close(); renderContent(); });
    drop.addEventListener("click", () => { delete NOTES[key]; saveNotes(); close(); renderContent(); });
    area.focus();
  };
  btn.addEventListener("click", () => { if (wrap) { close(); } else { open(); } });

  const saved = String(NOTES[key] || "").trim();
  if (saved) el("div", "io-csaved", holder, saved);
}

function renderExport() {
  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) scrim.remove(); });

  const dlg = el("div", "io-dlg io-export", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Your comments");

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Your comments");
  const close = iconBtn(head, "✕", "Close");
  close.style.setProperty("margin-left", "auto");
  close.addEventListener("click", () => scrim.remove());

  const body = el("div", "io-dlg__body", dlg);
  const keys = Object.keys(NOTES).filter(k => String(NOTES[k] || "").trim());

  if (!keys.length) {
    el("p", "io-note", body,
      "No comments yet. Switch Comment mode on, then use the + beside any setting, group heading or preview");
  } else {
    const order = [];
    for (const g of SCHEMA) {
      if (NOTES["group:" + g.id]) order.push("group:" + g.id);
      for (const it of g.items) if (NOTES["item:" + it.id]) order.push("item:" + it.id);
    }
    for (const k of keys) if (!order.includes(k)) order.push(k);

    const lines = ["# Prototype comments", ""];
    for (const k of order) {
      lines.push("## " + noteContext(k));
      lines.push("`" + k + "`");
      lines.push("");
      lines.push(String(NOTES[k]).trim());
      lines.push("");
    }
    const area = el("textarea", null, body);
    area.readOnly = true;
    area.value = lines.join("\n");
    area.setAttribute("aria-label", "Your comments as Markdown");
    el("p", "io-note", body,
      "Copy and clear is the one you usually want: it hands the comments over and empties the list, so the next round " +
      "does not arrive mixed in with this one");
    setTimeout(() => { area.focus(); area.select(); }, 0);
  }

  const foot = el("div", "io-dlg__foot", dlg);
  if (keys.length) {
    const grab = () => {
      const area = body.querySelector("textarea");
      area.focus(); area.select();
      try { return document.execCommand("copy"); } catch (_) { return false; }
    };
    const copy = el("button", "io-btn", foot, "Copy");
    copy.type = "button";
    copy.addEventListener("click", () => { copy.textContent = grab() ? "Copied" : "Press Ctrl/Cmd + C"; });

    /* the usual case: hand them over and start clean, so the next round
       does not arrive mixed in with the last one */
    const both = el("button", "io-btn io-btn--cta", foot, "Copy and clear");
    both.type = "button";
    both.addEventListener("click", () => {
      if (!grab()) { both.textContent = "Press Ctrl/Cmd + C first"; return; }
      NOTES = {}; saveNotes(); scrim.remove(); renderContent();
    });
    const wipe = el("button", "io-btn", foot, "Clear without copying");
    wipe.type = "button";
    wipe.addEventListener("click", () => {
      NOTES = {}; saveNotes(); scrim.remove(); renderContent();
    });
  }
  const done = el("button", "io-btn", foot, "Close");
  done.type = "button";
  done.addEventListener("click", () => scrim.remove());

  const esc = e => {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    scrim.remove();
  };
  document.addEventListener("keydown", esc);
}

/* ============================================================ Hotkeys
   Obsidian exposes assigned hotkeys only through app.hotkeyManager, which is
   not part of the documented API. Everything here is feature-detected and
   wrapped, so a shape change degrades to a dash and a plain Hotkeys link
   rather than a broken settings pane.
   ============================================================ */

const MOCK_HOTKEYS = {
  "Smart bracket": "Ctrl + Alt + B",
  "Move line up": "Alt + Up",
  "Move line down": "Alt + Down",
  "Open TagWheel on the left": "Ctrl + Alt + W"
};

function hotkeyFor(commandName) {
  /* In the plugin this reads app.hotkeyManager; here it reads the mock. */
  return MOCK_HOTKEYS[commandName] || "";
}

/* A command, its current key, and a way to set it — the same affordance
   wherever a command is named. */
function commandChip(parent, commandName) {
  const wrap = el("button", "io-cmdchip", parent);
  wrap.type = "button";
  el("span", "io-cmdchip__name", wrap, commandName);
  const current = hotkeyFor(commandName);
  el("span", "io-cmdchip__key" + (current ? "" : " io-cmdchip__key--none"), wrap, current || "not set");
  wrap.title = "Open Obsidian's Hotkeys settings at this command";
  wrap.setAttribute("aria-label", (current ? "Change" : "Assign") + " the hotkey for " + commandName);
  wrap.addEventListener("click", () => openHotkeys(commandName));
  return wrap;
}

function openHotkeys(commandName) {
  document.getElementById("proto-hint").textContent =
    "Would open Obsidian \u2192 Settings \u2192 Hotkeys with \"" + commandName +
    "\" already in the search box. If that is not possible, the name goes to the clipboard instead";
}

function hotkeyCell(parent, commandName) {
  const current = hotkeyFor(commandName);
  const b = el("button", "io-hk" + (current ? "" : " io-hk--none"), parent, current || "not set");
  b.type = "button";
  b.title = "Open Obsidian's Hotkeys settings at this command";
  b.setAttribute("aria-label", (current ? "Change" : "Assign") + " the hotkey for " + commandName);
  b.addEventListener("click", () => openHotkeys(commandName));
  return b;
}

/* ============================================================ Prototype chrome */

document.querySelectorAll("[data-theme-set]").forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.themeSet;
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    document.querySelectorAll("[data-theme-set]").forEach(b =>
      b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  });
});
document.getElementById("opt-review").addEventListener("change", e => {
  document.body.classList.toggle("proto-review", e.target.checked);
});
document.getElementById("opt-comment").addEventListener("change", e => {
  commentMode = e.target.checked;
  document.body.classList.toggle("proto-comment", commentMode);
  document.getElementById("proto-hint").textContent = commentMode
    ? "Comment mode is on. Use the + beside any setting, group heading or preview, then press Comments to copy them all out"
    : "Turn a module off under General to see how its tab collapses. Show everything ignores the visibility rules";
  renderContent();
});
document.getElementById("opt-export").addEventListener("click", renderExport);

document.getElementById("opt-showall").addEventListener("change", e => {
  showAll = e.target.checked;
  document.body.classList.toggle("proto-showall", showAll);
  renderContent();
});

seed();
setIn(state, "ui.showTips", true);
saveNotes();
renderTabs();
renderContent();
</script>
