       последнего, при среднем положении — была до сепаратора (и зеркально с
       другой стороны), а при максимальном — включала separator». Значит
       рост зеркальный, а не односторонний, как был: зеркальность — два края
       ОДНОГО блока. Исключение одно и тоже его: «полоска в left block не
       должна наезжать на префикс (буллит, чекбокс)».

       Высота — в долях свободного места до краёв зрительной строки, и это
       третий заход: «tags-block-fill-height изменяются только при значениях
       ползунка от 0 до 2 px, а при значениях от 3 до 5 высота как при 2px».
       Причина не в счёте — подложка упирается в высоту строки, иначе полосы

       ровно по написанному, сотня — строка заполнена целиком. */

function attachEmojiPicker(input, host, apply) {
  const panel = el("div", "io-pick", host);
  panel.hidden = true;
  panel.tabIndex = -1;
  const search = el("input", "io-pick__search", panel);
  search.type = "search"; search.placeholder = "Search by name";
  search.setAttribute("aria-label", "Search by name");
  const grid = el("div", "io-pick__grid", panel);
  const draw = () => {
    grid.textContent = "";
    const q = search.value.trim().toLowerCase();
    const groups = PICK_EMOJI
      .map(([title, items]) => [title, items.filter(([c, n]) => !q || c === q || n.toLowerCase().includes(q))])
      .filter(([, items]) => items.length);
    if (!groups.length) el("div", "io-pick__empty", grid, "Nothing by that name \u2014 paste your own character into the field");
    for (const [title, items] of groups) {
      el("div", "io-pick__head", grid, title);
      for (const [c, n] of items) {
        const b = el("button", "io-pick__item", grid, c);
        b.type = "button"; b.setAttribute("aria-label", n);
        b.addEventListener("click", () => { input.value = c; panel.hidden = true; apply(c); });
      }
    }
  };
  const open = () => { if (panel.hidden) { panel.hidden = false; draw(); } };
  input.addEventListener("focus", open);
  input.addEventListener("click", open);
  search.addEventListener("input", draw);
  /* `Escape` сворачивает выбиралку (`В-196`). В панели для этого ставится своя
     область клавиш поверх окна (`escapeScope`); здесь окна нет, и хватает поля. */
  const onKey = e => { if (e.key === "Escape" && !panel.hidden) { panel.hidden = true; e.stopPropagation(); } };
  input.addEventListener("keydown", onKey);
  panel.addEventListener("keydown", onKey);
  const leave = e => { const to = e.relatedTarget; if (!to || (to !== input && !panel.contains(to))) panel.hidden = true; };
  input.addEventListener("focusout", leave);
  panel.addEventListener("focusout", leave);
}
function iconBtn(parent, glyph, label, title) {
  const b = el("button", "io-icon", parent, glyph);
  b.type = "button";
  /*
   * Одна подсказка на узел. Obsidian показывает `aria-label` своей всплывающей
   * подсказкой на тёмном фоне, а браузер поверх неё — `title` на светлом:
   * получались две подсказки, разного вида и с разным текстом, перекрывающие
   * друг друга (замечание заказчика 2026-08-27). Если вызов дал и то и другое,
   * они сливаются в одну строку, и она же уходит в оба атрибута.
   */
  const full = title && title !== label ? label + " — " + title : label;
  b.setAttribute("aria-label", full);
  b.title = full;
  return b;
}

function dragHandle(grip, row, onMove, index) {

    row.classList.add("io-dragging");

    try { e.dataTransfer.effectAllowed = "move"; } catch (_) {}
  });
  grip.addEventListener("dragend", () => row.classList.remove("io-dragging"));

  row.addEventListener("dragover", e => {
    e.preventDefault();
    row.classList.add("io-dragover");
  });
  row.addEventListener("dragleave", () => row.classList.remove("io-dragover"));
  row.addEventListener("drop", e => {
    e.preventDefault();
    row.classList.remove("io-dragover");
    let from = NaN;
    try { from = Number(e.dataTransfer.getData("text/plain")); } catch (_) {}
    if (!Number.isNaN(from) && from !== index) onMove(from, index);
  });
  return grip;
}

function groupsFor(t) { return SCHEMA.filter(g => g.tab === t).sort((a, b) => a.order - b.order); }
function countSettings(t) {
  let n = 0;
  for (const g of groupsFor(t)) for (const it of g.items) if (it.kind !== "custom") n++;
  return n;
}
function field(id) { return FIELDS.find(f => f.id === id); }
function fieldsOn(side) { return FIELDS.filter(f => f.position === side); }
/* Which Value a line shows for a Field: the one at its own depth, counting
   only top-level Values. The rule is deliberately not a token: the same tree
   has to read against the prototype's invented Fields and against whatever
   the plugin has, and a token would tie it to one of them. */
function valueAtDepth(fieldId, depth) {
  const f = field(fieldId);
  if (!f) return null;
  const tops = f.values.filter(v => v.depth === 0);
  if (!tops.length) return null;
  return tops[depth % tops.length];
}

/* ============================================================ Tabs */

function renderTabs() {
  const host = document.getElementById("tabs");
  host.textContent = "";
  TABS.forEach(t => {
    const b = el("button", "io-tab", host, t.label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.tab = t.id;
    const c = el("span", "io-tab__count", b, String(countSettings(t.id)));
    c.setAttribute("aria-hidden", "true");
    b.addEventListener("click", () => selectTab(t.id));
    b.addEventListener("keydown", e => {
      const i = TABS.findIndex(x => x.id === t.id);
      if (e.key === "ArrowRight") { e.preventDefault(); selectTab(TABS[(i + 1) % TABS.length].id, true); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); selectTab(TABS[(i - 1 + TABS.length) % TABS.length].id, true); }
    });
  });
  syncTabs();
}
function syncTabs() {
  document.querySelectorAll(".io-tab").forEach(b => {
    const isActive = b.dataset.tab === activeTab;
    b.classList.toggle("io-tab--active", isActive);
    b.setAttribute("aria-selected", isActive ? "true" : "false");
    b.tabIndex = isActive ? 0 : -1;
    const gate = TAB_MODULE[b.dataset.tab];
    const off = gate && !ctx.get(gate);
    b.querySelector(".io-tab__count").textContent = off ? "off" : String(countSettings(b.dataset.tab));
  });
}
function selectTab(id, focus) {
  activeTab = id; dialog = null;
  renderContent(true); syncTabs();
  if (focus) document.querySelector('.io-tab[data-tab="' + id + '"]').focus();
}
function jumpTo(id) {
  const owner = SCHEMA.find(g => g.items.some(it => it.id === id));
  if (!owner) return;
  activeTab = owner.tab;
  renderContent(true); syncTabs();
  requestAnimationFrame(() => {
    const node = document.querySelector('[data-item="' + id + '"]');
    if (!node) return;
    node.scrollIntoView({ block: "center", behavior: "smooth" });
    node.classList.remove("io-item--flash");
    void node.offsetWidth;
    node.classList.add("io-item--flash");
  });
}

/* ============================================================ Content */

function renderContent(resetScroll) {
  const host = document.getElementById("content");
  const keepScroll = resetScroll ? 0 : host.scrollTop;
  host.textContent = "";
  bindings.clear();
  previewRefreshers = [];
  headPaints = [];
  document.querySelectorAll(".io-scrim").forEach(n => n.remove());
  queueMicrotask(() => { host.scrollTop = keepScroll; });

  bind("general.help.showTips", renderContent);
  bind("general.help.showCallouts", renderContent);

  const gate = TAB_MODULE[activeTab];
  if (gate && !ctx.get(gate)) {
    const master = SCHEMA.find(g => g.id === "modules").items.find(i => i.path === gate);
    const g = el("div", "io-group", host);
    el("div", "io-group__heading", g, TABS.find(t => t.id === activeTab).label);
    renderItem(g, Object.assign({}, master, { id: master.id + "-tab" }));
    el("p", "io-empty", g, MODULE_OFF_NOTE);
    return;
  }

  for (const group of groupsFor(activeTab)) {
    if (group.visible) for (const d of group.visible.deps) bind(d, renderContent);
    const forced = group.visible && !group.visible.test(ctx);
    if (forced && !showAll) continue;

    const g = el("div", "io-group" + (forced ? " io-group--forced" : ""), host);
    if (!/-intro$/.test(group.id)) {
      const h = el("div", "io-group__heading io-item__namerow", g);
      /* Кнопка сворачивания — ДО названия (просьба заказчика 2026-09-04), и
         свёрнутое положение отличается от развёрнутого и знаком, и классом. */
      const shut = FOLDED.has(group.id);
      const fold = el("button", "io-fold" + (shut ? " io-fold--shut" : ""), h,
        shut ? "\u25B8" : "\u25BE");
      fold.type = "button";
      fold.setAttribute("aria-expanded", shut ? "false" : "true");
      fold.setAttribute("aria-label", (shut ? "Expand " : "Collapse ") + group.heading);
      fold.addEventListener("click", () => {
        if (FOLDED.has(group.id)) FOLDED.delete(group.id); else FOLDED.add(group.id);
        renderContent();
      });
      el("span", "io-group__title", h, group.heading);
      attachTip(h, group.tip, group.heading, g);
      commentAffordance(h, g, "group:" + group.id);
      if (group.items.some(it => it.kind !== "custom" && it.path)) resetAffordance(h, group, g);
      /* Свёрнутая группа показывает один заголовок: ни вводной фразы, ни
         строк настроек под ним нет. */
      if (shut) { g.classList.add("io-group--shut"); continue; }
    }
    /* Вводная фраза группы — коллаутом под заголовком и до самих настроек
       (замечание заказчика 2026-09-04, скриншот 6.png: «это сделано не
       красиво, как plain text сверху над настройками»). Тумблер
       `Show callouts` убирает её вместе с вводными коллаутами вкладок. */
    if (group.intro && ctx.get("general.help.showCallouts")) {
      rich(el("div", "io-callout io-callout--group", g), group.intro);
    }
    if (group.commands) {
      const row = el("div", "io-group__cmds", g);
      el("span", "io-group__cmdlabel", row, group.commands.length > 1 ? "Commands" : "Command");
      group.commands.forEach(cmd => commandChip(row, cmd));
    }
    for (const item of group.items) renderItem(g, item);
  }
  /* Субхедеры красятся после того, как вкладка дорисована: свой раздел каждый
     из них ищет соседями, а соседей в миг отрисовки подписи ещё нет. */
  for (const paint of headPaints) paint();
  headPaints = [];
  if (dialog) renderDialog();
}

/* A tip belongs directly under the thing it explains. Anchoring it to the
   row that carries the ? is the only way that stays true when the block
   below grows a table.

   insertAfter is for a block that lives in a box: the ? belongs in the
   box's header, but the tip has to open below the whole box. Opening it
   inside pushes the box own text down, and the panel reads as jumping
   about. */
function attachTip(anchorRow, text, label, fallbackHost, insertAfter) {
  if (!text || !ctx.get("general.help.showTips")) return;
  let tipEl = null;
  const help = el("button", "io-help", anchorRow, "?");
  help.type = "button";
  help.setAttribute("aria-expanded", "false");
  help.setAttribute("aria-label", "More about " + label);
  help.addEventListener("click", () => {
    const shown = help.getAttribute("aria-expanded") === "true";
    help.setAttribute("aria-expanded", shown ? "false" : "true");
    if (shown) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
    tipEl = rich(el("div", "io-tip"), text);
    const anchor = insertAfter || anchorRow;
    /*
     * **Подсказка строки настройки принадлежит самой строке.** Колонка
     * описания кончается там, где начинается контрол, и вставка «сразу за
     * подписью» оставляла подсказку внутри колонки — в редакторе Field она
     * раскрывалась в 181 точку при строке в 373. В панели то же самое устроено
     * правильно с 2026-09-07 (`tipBelow` берёт хостом строку), и две отрисовки
     * разошлись молча (У-116).
     *
     * Отбор по классу, а не по имени вызывающего: хост бывает и блоком — у
     * шапок разделов, — и там вставка за подписью верна.
     */
    if (fallbackHost && fallbackHost.classList && fallbackHost.classList.contains("io-item")) {
      fallbackHost.appendChild(tipEl);
    } else if (typeof anchor.insertAdjacentElement === "function") {
      anchor.insertAdjacentElement("afterend", tipEl);
    } else if (fallbackHost) {
      fallbackHost.appendChild(tipEl);
    }
  });
}

/* the same thing, taking an item so existing call sites read unchanged */
function attachTipItem(anchorRow, host, item) {
  attachTip(anchorRow, item.tip, item.name, host);
}

/*
 * Подпись id в конце подсказки. Тумблер `Show option IDs in tips` на вкладке
 * Advanced: заказчик называет настройки id, а не описанием места на экране,
 * и без этой подписи id негде увидеть. Отладочный показ id и путей рядом с
 * каждой строкой — это другое: он остаётся только в прототипе.
 */
function withId(text, id) {
  const on = ctx.get("advanced.showSettingIds") === true;
  const key = String(id || "").trim();
  if (!on || !key) return text;
  return String(text || "") + (text ? "<br><br>" : "") + "<code>" + key + "</code>";
}

function helpButton(nameRow, info, item, row) {
  const tipText = withId(item.tip, item.id);
  if (!tipText || !ctx.get("general.help.showTips")) return;
  /* the tip belongs to the whole row, so it spans past the control column */
  let tipEl = null;
  const help = el("button", "io-help", nameRow, "?");
  help.type = "button";
  help.setAttribute("aria-expanded", "false");
  help.setAttribute("aria-label", "More about " + item.name);
  help.addEventListener("click", () => {
    const shown = help.getAttribute("aria-expanded") === "true";
    help.setAttribute("aria-expanded", shown ? "false" : "true");
    if (shown) { if (tipEl) { tipEl.remove(); tipEl = null; } return; }
    tipEl = rich(el("div", "io-tip"), tipText);
    const host = row || info;
    host.appendChild(tipEl);
  });
}

function renderItem(parent, item) {
  if (item.kind === "custom") {
    if (item.visible) for (const d of item.visible.deps) bind(d, renderContent);
    const hidden = item.visible && !item.visible.test(ctx);
    if (hidden && !showAll) return;
    const holder = el("div", "io-custom" + (hidden ? " io-item--forced" : ""), parent);
    holder.dataset.item = item.id;
    if (commentMode || String(NOTES["item:" + item.id] || "").trim()) {
      const bar = el("div", "io-item__namerow", holder);
      el("div", "io-cell", bar, item.id);
      commentAffordance(bar, holder, "item:" + item.id);
    }
    item.render(holder, ctx);
    return;
  }

  if (item.visible) for (const d of item.visible.deps) bind(d, renderContent);
  const forced = item.visible && !item.visible.test(ctx);
  if (forced && !showAll) return;

  const row = el("div", "io-item" + (forced ? " io-item--forced" : ""), parent);
  row.dataset.item = item.id;
  const info = el("div", "io-item__info", row);
  const nameRow = el("div", "io-item__namerow", info);
  el("div", "io-item__name", nameRow, item.name);
  helpButton(nameRow, info, item, row);
  if (item.desc) rich(el("div", "io-item__desc", info), item.desc);

  const meta = el("div", "io-meta", info);
  el("code", "is-id", meta, item.id);
  if (item.path) el("code", null, meta, item.path);
  if (item.searchTerms) el("code", null, meta, "was: " + item.searchTerms.join(", "));

  commentAffordance(nameRow, info, "item:" + item.id);

  if (item.seeAlso) {
    const link = el("button", "io-see", info, "→ " + item.seeAlso.label);
    link.type = "button";
    link.addEventListener("click", () => ctx.goTo(item.seeAlso.id));
  }

  const control = el("div", "io-item__control", row);
  CONTROLS[item.kind](control, item);

  if (item.disabled) {
    const apply = () => row.classList.toggle("io-item--disabled", item.disabled.test(ctx));
    apply();
    for (const d of item.disabled.deps) bind(d, apply);
  }
}

/* ============================================================ Group reset */

/* Что в группе отличается от значения по умолчанию. Свои блоки не входят:
   Fields, Values и правила — это данные человека, а не настройки. */
function groupDrift(group) {
  const out = [];
  group.items.forEach(it => {
    if (it.kind === "custom" || !it.path) return;
    const now = val(it.path);
    if (JSON.stringify(now) === JSON.stringify(it.default)) return;
    out.push({ item: it, now: now, was: it.default });
  });
  return out;
}

function shownValue(it, v) {
  if (typeof v === "boolean") return v ? "on" : "off";
  if (v === "") return "empty";
  if (it.options) {
    const o = it.options.find(x => x.value === v);
    if (o) return o.label;
  }
  return String(v) + (it.unit ? " " + it.unit : "");
}

/* Сброс — один шаг назад, а не двадцать два. */
function resetGroup(group) {
  groupDrift(group).forEach(d => { setIn(state, d.item.path, d.item.default); delete LIVE[d.item.path]; });
  refreshPreviews();
  renderContent();
}

function resetAffordance(headingEl, group, host) {
  const drift = groupDrift(group);
  const btn = el("button", "io-group__reset", headingEl, "Reset group");
  btn.type = "button";
  if (!drift.length) {
    btn.disabled = true;
    btn.title = "Everything here is already at its default";
    btn.setAttribute("aria-label", btn.title);
    return;
  }
  btn.title = drift.length + " of these differ from the default";
  btn.setAttribute("aria-label", "Reset " + group.heading + " to default values");

  btn.addEventListener("click", () => {
    if (headingEl.nextSibling && String(headingEl.nextSibling.className || "").indexOf("io-resetbox") >= 0) {
      headingEl.nextSibling.remove();
      return;
    }
    const box = el("div", "io-resetbox");
    el("p", "io-note", box, "Back to default, " + drift.length +
      (drift.length === 1 ? " setting" : " settings") + ":");
    const list = el("ul", "io-resetbox__list", box);
    drift.slice(0, 10).forEach(d => {
      el("li", null, list, d.item.name + ": " + shownValue(d.item, d.now) +
        " \u2192 " + shownValue(d.item, d.was));
    });
    if (drift.length > 10) el("li", null, list, "and " + (drift.length - 10) + " more");
    el("p", "io-note", box, "Your Fields, Values and rules are not touched");
    const row = el("div", "io-resetbox__row", box);
    const go = el("button", "io-btn io-btn--sm io-btn--warn", row, "Reset them");
    go.type = "button";
    go.addEventListener("click", () => resetGroup(group));
    const no = el("button", "io-btn io-btn--sm", row, "Keep as is");
    no.type = "button";
    no.addEventListener("click", () => box.remove());
    headingEl.insertAdjacentElement("afterend", box);
  });
}

/* ============================================================ Controls */

/*
 * Список значений, который считается, а не выписан. Нужен там, где выбирать
 * приходится из данных человека: Fields, папки, шаблоны. В прототипе
 * источник читает мокданные, в панели — конфиг; имя источника одно и то же
 * и переносится генератором как обычная строка.
 */
const OPTION_SOURCES = {
  /* Полосы берут цвет у Value, а Value с цветом есть только у тега:
     Field другого типа в этот список попадать не должен (З8). */
  "tag-fields": () => FIELDS.filter(f => f.type === "tag").map(f => ({ value:f.id, label:f.name })),
  /* Шаблоны — только из назначенной папки (1.6.2.4). Папки нет — списка
     тоже нет, и вместо него сказано, чего не хватает. */
  "templates": () => templateOptions(String(val("transform.inline2note.templatesFolder") || "").trim(),
    VAULT_NOTES),
  /* Языки (10.13.38). В панели список собирается из файлов папки плагина, а
     здесь это мокданные: в панель они не попадают (Р8, У-23). */
  "languages": () => [{ value:"en", label:"English" }, { value:"ru", label:"\u0420\u0443\u0441\u0441\u043a\u0438\u0439" }],
  /* Поля своего Block: ведущее поле выбирается только среди тех, что в этом
     Block и стоят (10.13.76). Сторона у Field своя, и спрашивается она у него,
     а не у списка правил — те разложены по типу, а не по Block. */
  "left-block-fields": () => FIELDS.filter(f => String(f.position || "").toLowerCase() === "left")
    .map(f => ({ value:f.id, label:f.name })),
  "right-block-fields": () => FIELDS.filter(f => String(f.position || "").toLowerCase() === "right")
    .map(f => ({ value:f.id, label:f.name }))
};

/* Один список шаблонов на прототип и на панель: правило «только из папки»
   живёт в одном месте, и разойтись двум спискам не на чем. */
function templateOptions(folder, notes) {
  if (!folder) return [{ value:"", label:"Set a Templates folder first" }];
  const prefix = folder.replace(/\/+$/, "") + "/";
  const inside = notes.filter(p => p.startsWith(prefix));
  if (!inside.length) return [{ value:"", label:"No templates in " + folder }];
  return [{ value:"", label:"None" }].concat(
    inside.map(p => ({ value:p, label:templateLabel(folder, p) })));
}

/* Имя шаблона на экране: путь внутри назначенной папки, а не путь целиком.
   Одно правило на все три места, где шаблон назван: `Default template`,
   `Use template` и сводка свёрнутого правила — первое считало имя так, два
   других писали путь, и заказчик увидел расхождение (замечание по S6,
   2026-09-09). */
function templateLabel(folder, path) {
  const root = String(folder || "").trim().replace(/\/+$/, "");
  const p = String(path || "").trim();
  if (!root || !p) return p;
  const prefix = root + "/";
  return p.startsWith(prefix) ? p.slice(prefix.length) : p;
}

/*
 * Приписка у стандартного значения списка — его заказ 2026-09-20, пункт 13:
 * «чтобы пользователь понимал, какой вариант контрола является стандартным».
 * Ставится после обоих источников: умолчание бывает и у списка, который
 * приезжает из данных (язык, шаблон). Значения это не касается — меняется
 * только подпись (З1).
 */
const DEFAULT_OPTION_MARK = "(default)";
function dropdownOptions(item) {
  const fixed = item.options || [];
  const src = item.optionsFrom ? OPTION_SOURCES[item.optionsFrom] : null;
  const all = src ? fixed.concat(src()) : fixed;
  /* Список из одной строки не помечается: вариантов нет, а этой строкой
     бывает сообщение о пустоте, а не выбор. */
  if (!("default" in item) || all.length < 2) return all;
  const standard = String(item.default);
  return all.map(o => {
    const isObj = typeof o === "object";
    const value = isObj ? o.value : o;
    if (String(value) !== standard) return o;
    const label = (isObj ? o.label : o) + " " + DEFAULT_OPTION_MARK;
    return { value, label };
  });
}

/*
 * Крестик «стереть написанное» — у полей, где пусто есть законное значение
 * (замечание заказчика 2026-09-16: «добавь в контрол выбора папки крестик
 * для удаления текущей выбранной папки… также добавь такой крестик во все
 * остальные подобные контролы, где пользователь вводит текст руками»).
 *
 * Его решение В-131: ставить там, где пустое значение законно. У
 * разделителей и скобок имени пустоты быть не может — там кнопка портила бы,
 * а не помогала, и её нет.
 *
 * Кнопки нет и тогда, когда стирать нечего: кнопка, которая ничего не
 * делает, хуже её отсутствия (З8). Прячется она атрибутом `hidden`, а
 * правило для него стоит рядом с `.io-clear` — у самого класса `display:
 * grid`, и он сильнее умолчания браузера.
 */
function clearButton(host, item, input) {
  if (!item.clearable) return;
  const btn = el("button", "io-clear", host, "✕");
  btn.type = "button";
  btn.setAttribute("aria-label", "Clear " + item.name);
  const sync = () => { btn.hidden = !String(input.value || "").trim(); };
  btn.addEventListener("click", () => {
    input.value = "";
    ctx.set(item.path, "");
    sync();
  });
  input.addEventListener("input", sync);
  bind(item.path, sync);
  sync();
}

const CONTROLS = {
  /*
     Строка-подпись: имя, описание и подсказка, а контрола нет.

     Нужна там, где следующий блок сам по себе не объясняет, к чему он
     относится: список флажков `Fields to keep` начинался сразу под предыдущей
     строкой (замечание заказчика B13, B18, 2026-09-02).
  */
  note() {},
  toggle(host, item) {
    const input = el("input", "io-toggle", host);
    input.type = "checkbox";
    input.checked = !!ctx.get(item.path);
    input.setAttribute("aria-label", item.name);
    input.addEventListener("change", () => ctx.set(item.path, input.checked));
    bind(item.path, () => { input.checked = !!ctx.get(item.path); });
  },
  /* Контрол папки Obsidian 1.13: поле ввода с подсказчиком папок vault.
     Прототип рисует то же самое списком `datalist` — свободный ввод и
     подсказки, как просил заказчик (1.6.2.3). */
  folder(host, item) {
    const input = el("input", "io-text" + (item.wide ? " io-text--wide" : ""), host);
    input.type = "text";
    input.value = String(ctx.get(item.path) || "");
    if (item.placeholder) input.placeholder = item.placeholder;
    input.setAttribute("aria-label", item.name);
    const listId = "io-folders-" + item.id;
    input.setAttribute("list", listId);
    const list = el("datalist", null, host);
    list.id = listId;
    VAULT_FOLDERS.filter(Boolean).forEach(f => { el("option", null, list).value = f; });
    input.addEventListener("change", () => ctx.set(item.path, input.value));
    bind(item.path, () => { input.value = String(ctx.get(item.path) || ""); });
    clearButton(host, item, input);
  },
  dropdown(host, item) {
    const s = selectEl(host, dropdownOptions(item), String(ctx.get(item.path)), item.name);
    s.addEventListener("change", () => ctx.set(item.path, s.value));
    bind(item.path, () => { s.value = String(ctx.get(item.path)); });
  },
  /* PRD Р-6: the unit is on the control, and the value is written on
     release rather than on every pixel of the drag. */
  slider(host, item) {
    const range = el("input", "io-range", host);
    range.type = "range";
    range.min = item.min; range.max = item.max; range.step = item.step;
    /* Перевёрнутый слайдер: в конфиге лежит одно, а человек видит другое.
       `invert: 100` значит «показать 100 минус записанное». Нужен там, где
       записанное значение читается наоборот тому, о чём человек думает:
       `Opacity of transformed line` растёт вправо, а в конфиге лежит доля
       оставшейся яркости. Менять смысл записанного нельзя — это З1. */
    const inv = Number(item.invert) || 0;
    const shown = v => (inv ? inv - Number(v) : Number(v));
    const stored = v => (inv ? inv - Number(v) : Number(v));
    range.value = shown(ctx.get(item.path));
    range.setAttribute("aria-label", item.name);
    const out = el("span", "io-value", host);
    const fmt = v => v + (item.unit ? " " + item.unit : "");
    out.textContent = fmt(range.value);
    range.addEventListener("input", () => {
      out.textContent = fmt(range.value);
      out.classList.add("io-value--pending");
      out.classList.remove("io-value--saved");
      LIVE[item.path] = stored(range.value);
      refreshPreviews();
    });
    range.addEventListener("change", () => {
      ctx.set(item.path, stored(range.value));
      out.classList.remove("io-value--pending");
      out.classList.add("io-value--saved");
      setTimeout(() => out.classList.remove("io-value--saved"), 900);
    });
    bind(item.path, () => {
      range.value = shown(ctx.get(item.path));
      out.textContent = fmt(range.value);
    });
  },
  number(host, item) {
    const input = el("input", "io-number", host);
    input.type = "number";
    if (item.min != null) input.min = item.min;
    if (item.max != null) input.max = item.max;
    input.value = ctx.get(item.path);
    input.setAttribute("aria-label", item.name);
    input.addEventListener("change", () => ctx.set(item.path, Number(input.value)));
    bind(item.path, () => { input.value = ctx.get(item.path); });
  },
  /* PRD Р-7: written on blur and Enter, not on every keystroke. */
  text(host, item) {
    const cls = "io-text" + (item.wide ? " io-text--wide" : "") + (item.mono ? " io-text--mono" : "");
    const input = el("input", cls, host);
    input.type = "text";
    input.value = ctx.get(item.path) ?? "";
    input.setAttribute("aria-label", item.name);
    input.addEventListener("input", () => { LIVE[item.path] = input.value; refreshPreviews(); });
    input.addEventListener("blur", () => ctx.set(item.path, input.value));
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    bind(item.path, () => { if (document.activeElement !== input) input.value = ctx.get(item.path) ?? ""; });
    clearButton(host, item, input);
  },
  textarea(host, item) {
    const ta = el("textarea", "io-textarea", host);
    ta.rows = item.rows || 4;
    ta.value = ctx.get(item.path) ?? "";
    ta.setAttribute("aria-label", item.name);
    ta.addEventListener("blur", () => ctx.set(item.path, ta.value));
    bind(item.path, () => { if (document.activeElement !== ta) ta.value = ctx.get(item.path) ?? ""; });
  },
  color(host, item) {
    const input = el("input", "io-color", host);
    input.type = "color";
    input.value = ctx.get(item.path) || item.default;
    input.setAttribute("aria-label", item.name);
    input.addEventListener("input", () => { LIVE[item.path] = input.value; refreshPreviews(); });
    input.addEventListener("change", () => ctx.set(item.path, input.value));
    if (item.allowReset) {
      const reset = el("button", "io-reset", host, "Reset");
      reset.type = "button";
      reset.addEventListener("click", () => ctx.set(item.path, item.default));
    }
    bind(item.path, () => { input.value = ctx.get(item.path) || item.default; });
  },
  buttons(host, item) {
    for (const b of item.buttons) {
      const btn = el("button", "io-btn" + (b.cta ? " io-btn--cta" : "") + (b.warning ? " io-btn--warn" : ""), host, b.label);
      btn.type = "button";
      btn.addEventListener("click", () => ctx.run(b.action));
    }
  }
};

/* ============================================================ Preview parts */

/* One color per field type, so the same type always looks the same. */
/* Тег и ссылка — палитра бренд-бука (`В-198`): янтарь и сталь; у тега свой
   тёмный текст, белый на янтаре не читается. Те же значения — в `styles.css`. */
const TYPE_COLOR = { tag: "#ffb547", link: "#4a7b9b", element: "#7a9e3b" };
const TYPE_INK = { tag: "#3a2400" };
const typeInk = t => TYPE_INK[t] || "var(--text-on-accent)";

/* A field has no color of its own: a tag field borrows its first value's
   fill, everything else takes the color of its type. */
function fieldColor(f) {
  if (f.type === "tag") {
    const v = f.values.find(x => x.depth === 0);
    return v ? v.color : TYPE_COLOR.tag;
  }
  return TYPE_COLOR[f.type];
}

function previewShell(host, caption, tip) {
  const box = el("div", "io-preview", host);
  const cap = el("div", "io-preview__cap", box);
  el("span", null, cap, caption);
  attachTip(cap, tip, caption, box);
  return box;
}
/*
 * Переменные вида строки. Второй аргумент — то, чего у строки быть не должно:
 * `{ blockFill: false }` оставляет переменные и снимает саму подложку Block.
 *
 * Нужен он одному предпросмотру — панели: «в io-tip-wheel-preview сейчас видна
 * фиолетовая полоска tags-block-fill-color — это не правильно, поскольку в
 * этом preview мы смотрим на tagwheel panel» (его слово 2026-09-22). Полоса
 * Block и обособление панели ложились на **один и тот же узел**, и подложка
 * выигрывала каскад тремя классами против одного: цвет панели до экрана не
 * доезжал (У-67).
 */
function applyTagVars(node, opts) {
  cssVar(node, "--io-opacity-left",  String(val("visual.tags.opacityLeft") / 100));
  cssVar(node, "--io-opacity-right", String(val("visual.tags.opacityRight") / 100));
  cssVar(node, "--io-text-scale-left",  String(val("visual.tags.textSizePctLeft") / 100));
  cssVar(node, "--io-text-scale-right", String(val("visual.tags.textSizePctRight") / 100));
  cssVar(node, "--io-bubble-x",      String(val("visual.tags.bubbleWidthPct") / 100));
  cssVar(node, "--io-bubble-y",      String(val("visual.tags.bubbleHeightPct") / 100));
  cssVar(node, "--io-empty-x",       String(val("visual.tags.emptyBubblePct") / 100));
  cssVar(node, "--io-corners",       String((100 - val("visual.tags.cornersPct")) / 100));
  /* Заливка блоков (З-7): цвет и густота приходят переменными, а сама
     подложка — классом. Пусто в цвете значит «взять у темы». */
  cssVar(node, "--io-blockfill-color",
    String(val("visual.tags.blockFill.color") || "").trim() || "var(--text-accent)");
  cssVar(node, "--io-blockfill-opacity", String(val("visual.tags.blockFill.opacity") / 100));
  /* Два цвета ссылки, показанной как написано (`З-37`): цель и скобки.
     Пусто значит «взять у темы» — то же, чем ссылка красилась до этой пары. */
  cssVar(node, "--io-link-target",
    String(val("visual.tags.linkAsWritten.targetColor") || "").trim() || "var(--text-accent)");
  cssVar(node, "--io-link-brackets",
    String(val("visual.tags.linkAsWritten.bracketsColor") || "").trim() || "var(--text-accent)");
  /*
   * Насколько подложка выходит за написанное (замечания по S7, 2026-09-09).
   *
   * Высота — доля свободного места. У строки предпросмотра это её
   * собственное поле сверху и снизу, у строки заметки — остаток зрительной
   * строки за написанным; сотня заполняет и то и другое.
   *
   * Ширина — шкала с переломом на середине, и три её
   * ориентира назвал он сам: ноль — по написанному, пятьдесят — до
   * разделителя, сотня — включая разделитель. Первая половина шкалы тратится
   * на промежуток — здесь это промежуток флекса, `--io-line-gap`, — вторая на
   * сам разделитель.
   *
   * Ширина разделителя взята его длиной в знаках (`ch`), а не измерена:
   * предпросмотр собирается до того, как попадёт в документ, и мерить в нём
   * нечего. В заметке та же величина именно измеряется; здесь она показывает
   * поведение шкалы, а не точные точки.
   */
  const bandRoomPx = 3;
  cssVar(node, "--io-blockfill-pady",
    String(Math.round(bandRoomPx * (Number(val("visual.tags.blockFill.heightPct")) || 0)) / 100) + "px");
  const bandPct = Math.max(0, Math.min(100, Number(val("visual.tags.blockFill.widthPct")) || 0));
  const bandNear = Math.min(1, bandPct / 50);
  const bandFar = Math.max(0, (bandPct - 50) / 50);
  const bandSepCh = String(val("pkm.lineFormat.separator1") || "||").length;
  cssVar(node, "--io-blockfill-padx",
    "calc(var(--io-line-gap) * " + bandNear + " + " + bandSepCh + "ch * " + bandFar + ")");
  if (!(opts && opts.blockFill === false) && val("visual.tags.blockFill.enabled") === true) {
    node.classList.add("io-line--blockfill");
    /* Направление (З-12): `both` даёт оба класса, `left` и `right` — по
       одному. Незнакомое значение читается как `both`: полоса — украшение,
       и пропасть ей от испорченного значения не за что. */
    const dir = String(val("visual.tags.blockFill.direction") || "both");
    if (dir !== "right") node.classList.add("io-line--blockfill-left");
    if (dir !== "left") node.classList.add("io-line--blockfill-right");
  }
}
/* A bubble with no text keeps a normal bubble's height: the non-breaking
   space holds the line box open while the color hides it. */
function bubble(parent, v, textOverride) {
  const empty = v.shown === "nothing";
  const label = empty ? " " : (textOverride != null ? textOverride
    : (v.shown === "custom" ? (v.custom || " ") : "#" + v.token));
  const b = el("span", "io-bubble" + (empty ? " io-bubble--empty" : ""), parent, label);
  cssVar(b, "--io-bubble-bg", v.color);
  if (v.textColor) cssVar(b, "--io-bubble-fg", v.textColor);
  return b;
}
function pickPair(f) {
  for (let i = 0; i < f.values.length; i++) {
    if (f.values[i].depth === 0 && f.values[i + 1] && f.values[i + 1].depth === 1) {
      return [f.values[i], f.values[i + 1]];
    }
  }
  return [f.values.find(v => v.depth === 0) || null, null];
}
function renderTagField(parent, f) {
  const [p, c] = pickPair(f);
  if (!p) { el("span", "io-bubble io-bubble--empty", parent, " "); return; }
  if (!c) { bubble(parent, p); return; }
  if (val("pkm.behavior.childTagFormat") === "combined") bubble(parent, c, "#" + p.token + "/" + c.token);
  else { bubble(parent, p); bubble(parent, c); }
}
function renderFieldToken(parent, f) {
  if (f.type === "tag") return renderTagField(parent, f);
  if (f.type === "link") {
    const v = f.values[0];
    el("span", "io-link", parent, v ? v.token : "[[ ]]");
    return;
  }
  el("span", "io-elem", parent, f.marker + " " + f.format);
}

function fieldChip(parent, f) {
  const b = el("span", "io-bubble", parent, f.short || f.name);
  cssVar(b, "--io-bubble-bg", fieldColor(f));
  if (fieldColor(f) === TYPE_COLOR[f.type]) cssVar(b, "--io-bubble-fg", typeInk(f.type));
  return b;
}
/* The shape of a line: one chip per field, in writing order. Третьим
   аргументом идёт то, чего у строки быть не должно, — см. `applyTagVars`. */
function structuralLine(parent, chipFor, opts) {
  const line = el("div", "io-line", parent);
  applyTagVars(line, opts);
  el("span", "io-line__prefix", line, "- ");
  const put = (side, list) => list.forEach(f => (chipFor ? chipFor(side, f) : fieldChip(side, f)));
  const left = fieldsOn("Left");
  if (left.length) put(el("span", "io-line__side io-line__side--left", line), left);
  el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator1") || "||"));
  el("span", "io-line__text", line, PREVIEW_LINE_TEXT);
  el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator2") || "||"));
  const right = fieldsOn("Right");
  if (right.length) put(el("span", "io-line__side io-line__side--right", line), right);
  else el("span", "io-line__hint", line, PREVIEW_EMPTY_RIGHT);
  return line;
}

/* Every live preview says the same two things: what it is, and how far it
   can be trusted. The copy lives in one table so the panel, the document
   and the plugin all read the same words.

   PRD 10.3 P9 and P10: a preview is drawn by the settings pane with its own
   markup, not by the editor, so each one has to say so. It says it in its
   own "?", where a long explanation belongs, and no longer as a grey line
   above the picture — the owner's remark 1.4.1.1.1. */
const PREVIEW_TEXTS = {

/* PZ2: a preview without a Field of your own still has to show something.
   It says so, so nobody mistakes the example for their own setup. */
const PREVIEW_EXAMPLE = "Example Fields, until you set up your own under Fields on the Tags & PKM tab";

/* The two visible words of the line's shape. They are copy, so they live with
   the rest of the copy rather than inside a renderer. */
const PREVIEW_LINE_TEXT = "your text";
const PREVIEW_EMPTY_RIGHT = "nothing on the right yet";

/* What a tab says when its module is off. It is copy, so it lives here and
   travels to the panel with the rest of it. */
const MODULE_OFF_NOTE = "This module is off, so its settings are hidden. Turn it on to configure it";

function renderLinePreview(host) {
  const pt = PREVIEW_TEXTS["line-preview"];
  const box = previewShell(host, pt.cap, pt.tip);
  const holder = el("div", "io-struct", box);

  /* Three rows on one grid: the line, then the block brackets, then the
     separator captions. The captions are taken out of the flow so a long
     word cannot widen the narrow separator column. */
  const draw = () => {
    holder.textContent = "";
    applyTagVars(holder);

    const cell = (cls, fill) => {
      const c = el("div", "io-struct__cell " + cls, holder);
      if (fill) fill(c);
      return c;
    };
    cell("io-struct__prefix", c => el("span", "io-line__prefix", c, "- "));
    cell("io-struct__side io-line__side--left", c => fieldsOn("Left").forEach(f => fieldChip(c, f)));
    cell("io-struct__sep", c => el("span", "io-line__sep", c, String(val("pkm.lineFormat.separator1") || "||")));
    cell("io-struct__text", c => el("span", "io-line__text", c, "your text"));
    cell("io-struct__sep", c => el("span", "io-line__sep", c, String(val("pkm.lineFormat.separator2") || "||")));
    cell("io-struct__side io-line__side--right", c => {
      const right = fieldsOn("Right");
      if (right.length) right.forEach(f => fieldChip(c, f));
      else el("span", "io-line__hint", c, "empty");
    });

    /* row two: brackets under the two blocks, a tick under each separator */
    el("div", null, holder);
    const block = text => {
      const w = el("div", "io-struct__block", holder);
      el("div", "io-struct__bracket", w);
      el("div", "io-struct__name", w, text);
    };
    block("Left Block");
    el("div", "io-struct__tick", holder);
    el("div", null, holder);
    el("div", "io-struct__tick", holder);
    block("Right Block");

    /* row three: the separator captions, centred on their own column */
    el("div", null, holder);
    el("div", null, holder);
    el("span", null, el("div", "io-struct__sepname", holder), "separator 1");
    el("div", null, holder);
    el("span", null, el("div", "io-struct__sepname", holder), "separator 2");
    el("div", null, holder);
  };

  draw();
  previewRefreshers.push(draw);
  ["pkm.lineFormat.separator1", "pkm.lineFormat.separator2"].forEach(p => bind(p, draw));
}

/*
 * Ссылка, показанная **как написано**, — три куска, а не один (`З-37`, его
 * ответ `В-174`): скобка, цель, скобка. Иначе второй цвет красить нечего.
 * Не разобралась на три — рисуется одним куском: своего разбора ссылки тут
 * нет, образец спрашивает ровно то, что видно.
 */
function renderWrittenLink(host, text) {
  const src = String(text || "");
  const box = el("span", "io-link", host);
  const m = /^(\[\[)([\s\S]*)(\]\])$/.exec(src);
  if (!m) { box.textContent = src; return box; }
  el("span", "io-link__mark", box, m[1]);
  el("span", "io-link__target", box, m[2]);
  el("span", "io-link__mark", box, m[3]);
  return box;
}

function renderTagPreview(host) {
  const pt = PREVIEW_TEXTS["tag-preview"];

    holder.textContent = "";

/* --- level bars ---------------------------------------------------- */



/* Почему полос нет, когда они включены. Две причины, и обе про настройку
   выше, а не про поломку (замечание заказчика 1.5.3.2). */
const BARS_FIELD_NONE =
  "Bars need a Field: pick one in <code>Which Field draws Bars</code> above";
const BARS_FIELD_GONE =
  "The Field these Bars were drawn for is gone: pick another one above";

function renderBarsPreview(host) {
  const pt = PREVIEW_TEXTS["bars-preview"];
  const box = previewShell(host, pt.cap, pt.tip);
  const tree = el("div", "io-tree", box);

  const drawLine = (parent, node, depth) => {
    const line = el("div", "io-line", parent);
    applyTagVars(line);
    cssVar(line, "--io-depth", String(depth));
    el("span", "io-line__prefix", line, "- ");
    /* the line always carries whatever it carries: switching the field
       changes the bars, never the text.

       Места этого дерева — Fields ТИПА TAG, и только они: цвет полосы это
       цвет Value, а он есть у тега и ни у ссылки, ни у элемента. В панели то
       же самое делает фильтр по `kind` (замечание заказчика 1.5.3.2, п. 2). */
    const active = ctx.get("visual.tagBars.active");
    /* Выбранный Field — только тот, что и правда выбран: подстановка
       `status` искала Field, которого у человека нет (замечание 1.5.3.2). */
    const chosen = val("visual.tagBars.fieldId");
    const hideChosen = active && !ctx.get("visual.tagBars.tagVisibility");
    const carried = Array.isArray(node.fields) ? node.fields : [];
    const shown = [];
    carried.forEach(id => {
      if (id === chosen && hideChosen) return;
      const value = valueAtDepth(id, depth);
      if (value) shown.push(value);
    });
    if (shown.length) {
      const sideEl = el("span", "io-line__side io-line__side--left", line);
      shown.forEach(value => bubble(sideEl, value));
    }
    /* the Separator only goes when nothing is left in front of the text.
       If the one tag there was is the one the Bar replaced, whether the
       Separator goes with it is what the setting below decides. */
    const replaced = hideChosen && carried.indexOf(chosen) >= 0;
    const sepHidden = !shown.length &&
      (!replaced || ctx.get("visual.tagBars.hideSeparatorWhenOnlyStripToken"));
    if (!sepHidden) el("span", "io-line__sep", line, String(val("pkm.lineFormat.separator1") || "||"));
    el("span", "io-line__text", line, node.text);
  };

  const drawNode = (parent, node, depth, lane) => {
    const active = ctx.get("visual.tagBars.active");
    const cap = val("visual.tagBars.stripesToShow");
    const chosen = val("visual.tagBars.fieldId");
    /* Полоса по всему поддереву или только по своей строке (10.13.21 Б5). */
    const whole = ctx.get("visual.tagBars.drawWholeTree") !== false;
    const carried = Array.isArray(node.fields) ? node.fields : [];
    const v = carried.indexOf(chosen) >= 0 ? valueAtDepth(chosen, depth) : null;
    const bar = active && v && (whole ? lane < cap : true);

    const nodeBox = el("div", "io-node" + (bar ? " io-node--bar" : ""), parent);
    if (bar) {
      cssVar(nodeBox, "--io-bar-color", v.color);
      /* Выключенный тумблер: дорожка одна на всех — наследования нет. */
      cssVar(nodeBox, "--io-lane", String(whole ? lane : 0));
    }
    drawLine(nodeBox, node, depth);
    /*
     * Дочерние строки лежат **внутри** узла с полосой, и потому полоса идёт по
     * всему поддереву. Выключенный тумблер выносит их наружу: тогда узел
     * высотой в одну строку, и полоса не длиннее её.
     */
    (node.children || []).forEach(c => drawNode(
      whole ? nodeBox : parent, c, depth + 1, whole ? (bar ? lane + 1 : lane) : 0));
  };

  const draw = () => {
    tree.textContent = "";
    cssVar(tree, "--io-bar-thickness", val("visual.tagBars.thickness") + "px");
    cssVar(tree, "--io-bar-gap",       val("visual.tagBars.childOffset") + "px");
    cssVar(tree, "--io-bar-distance",  val("visual.tagBars.spacing") + "px");
    /* Зазор между полосами соседних строк (`Gap between Bars`, 10.13.16).
       Панель его показывала, а прототип — нет: правило вида было объявлено
       дважды и разошлось молча (У-32). Найдено сверкой переменных двух
       предпросмотров 2026-09-09. */
    cssVar(tree, "--io-bar-inset",     val("visual.tagBars.lineGap") + "px");
    (pt.tree || []).forEach(n => drawNode(tree, n, 0, 0));
    /* Полосы включены, а Field не выбран: на экране пустое дерево, и
       человек не знает, что настройка ждёт ещё один выбор (1.5.3.2). */
    const chosen = val("visual.tagBars.fieldId");
    if (ctx.get("visual.tagBars.active") && !FIELDS.some(f => f.id === chosen)) {
      rich(el("p", "io-preview__note", tree), chosen ? BARS_FIELD_GONE : BARS_FIELD_NONE);
    }
  };
  draw();
  previewRefreshers.push(draw);
  ["visual.tagBars.active", "visual.tagBars.tagVisibility", "visual.tagBars.fieldId",
   "visual.tagBars.hideSeparatorWhenOnlyStripToken", "visual.tagBars.stripesToShow",
   "visual.tagBars.drawWholeTree",
   "visual.tagBars.thickness", "visual.tagBars.childOffset", "visual.tagBars.spacing"]
    .forEach(p => bind(p, draw));
}

function renderWheelPreview(host) {
  const pt = PREVIEW_TEXTS["wheel-preview"];
  const box = previewShell(host, pt.cap, pt.tip);
  const stage = el("div", "io-wheelstage", box);

  const draw = () => {
    stage.textContent = "";
    const scroller  = ctx.get("visual.tagWheel.scroller.enabled");
    const perSide   = scroller ? val("visual.tagWheel.scroller.size") : 0;
    const direction = ctx.get("visual.tagWheel.scroller.direction");
    const markers   = ctx.get("visual.tagWheel.showMarkers");

    const left = fieldsOn("Left");
    const shown = left[1] || left[0] || FIELDS[0];
    /* Что показывает ячейка этого Field — одно объявление на обе ячейки:
       активную и ту, у которой значение уже выбрано (У-32). */
    const cellValues = (f) => (f.type === "element"
      ? [f.marker + " " + f.format]
      : (Array.isArray(f.values) ? f.values : []).map(v => (markers ? "#" : "") + v.token));
    const values = cellValues(shown);
    const n = values.length;
    const at = n > 2 ? Math.floor(n / 2) : 0;   /* the middle, so both sides read clearly */

    /* upwards you keep meeting the next value, downwards the previous one,
       both wrapping round the loop, so the panel is always full */
    const rows = perSide && n ? perSide : 0;
    const upIdx = [], downIdx = [];
    for (let k = rows; k >= 1; k--) upIdx.push((at + k) % n);
    for (let k = 1; k <= rows; k++) downIdx.push(((at - k) % n + n) % n);
    const up   = direction === "down" ? [] : upIdx;
    const down = direction === "up"   ? [] : downIdx;

    const ROW = 21;
    /* row height plus the panel's own padding, border and the gap to the line */
    cssVar(box, "--io-wheel-up",   (up.length   ? up.length   * ROW + 18 : 0) + "px");
    cssVar(box, "--io-wheel-down", (down.length ? down.length * ROW + 18 : 0) + "px");

    /* Цвета панели: два цвета текста и заливка (PRD 10.13.22 Пр2). До
       2026-09-04 они применялись только к коробке скроллера, а Fields
       рисовались чипами Value — то есть настройками панели не управлялись. */
    const fill = val("visual.tagWheel.fillColor");
    const text = val("visual.tagWheel.textColor");
    const activeText = val("visual.tagWheel.activeTextColor") || text;
    /* Пусто — ячейка с выбранным значением красится как остальные неактивные:
       «Empty means it takes Non-active Field text color, as before». */
    const chosenText = val("visual.tagWheel.chosenValueColor") || text;
    const lit = ctx.get("visual.tagWheel.highlightLine");
    /* Коробка скроллера — не панель, и цвета у неё свои: `Scroller background
       color` и `Scroller text color`. Здесь стояли цвета панели, и заказчик
       увидел ровно это: «panel-background меняет цвет и заливки tagwheel и
       заливки scroller» (замечание к H2). Пусто — цвета темы, их подставляет
       запасное значение переменной в стилях. */
    const scrollFill = val("visual.tagWheel.scroller.fillColor");
    const scrollText = val("visual.tagWheel.scroller.textColor");

    const panel = (idx, where) => {
      if (!idx.length) return null;
      const p = el("span", "io-wheelpanel io-wheelpanel--" + where, null);
      if (scrollFill) cssVar(p, "--io-wheel-bg", scrollFill);
      if (scrollText) cssVar(p, "--io-wheel-fg", scrollText);
      idx.forEach(i => el("span", "io-wheelval", p, values[i]));
      return p;
    };

    /* Обособление строки — на контейнере стороны: в заметке `==…==` обнимает
       панель целиком, и заливка у неё одна (Пр4). */
    const dressed = [];
    const dressSide = (side) => {
      if (dressed.indexOf(side) >= 0) return;
      dressed.push(side);
      side.classList.add("io-wheelline");
      if (!lit) return;
      side.classList.add("io-wheelline--lit");
      if (fill) cssVar(side, "--io-wheel-lit", fill);
    };

    let plainCells = 0;
    structuralLine(stage, (side, f) => {
      dressSide(side);
      const isShown = f === shown;
      const col = el("span", "io-wheelcol", side);
      /* Ячейка панели — текст, как в заметке: активная в квадратных скобках и
         полужирная, остальные обычным словом. Активная ровно одна (Пр1, Пр5). */
      const label = f.short || f.name;
      /*
       * **У одной неактивной ячейки значение уже выбрано** — его заказ
       * 2026-09-17: «в io-tip-wheel-preview сделай одно из значений
       * non-active field с выбранным value, чтобы было видно как работает
       * этот контрол». Без такой ячейки новый цвет проверять не на чем:
       * все неактивные показывали бы имя поля (У-113).
       *
       * Ровно одна, и **вторая** по ходу, а не первая: полоса из одних
       * значений перестала бы показывать разницу между именем поля и
       * выбранным значением — ради неё контрол и заведён, — а первая
       * ячейка обязана остаться именем поля: по ней видно, что
       * переименование Field доезжает до предпросмотра.
       */
      if (!isShown) plainCells += 1;
      const own = !isShown && plainCells === 2 ? cellValues(f) : [];
      const filled = own.length ? String(own[0] || "") : "";
      const cell = el("span", "io-wheelcell" + (isShown ? " io-wheelcell--active" : ""), col,
        isShown ? "[" + String(values[at] || label) + "]" : (filled || label));
      if (isShown) {
        if (activeText) cssVar(cell, "--io-wheel-cell-active", activeText);
      } else if (filled) {
        if (chosenText) cssVar(cell, "--io-wheel-cell", chosenText);
      } else if (text) {
        cssVar(cell, "--io-wheel-cell", text);
      }
      if (!isShown) return;
      const u = panel(up, "up");
      if (u) col.appendChild(u);
      const d = panel(down, "down");
      if (d) col.appendChild(d);
    /* Заливки Block здесь нет нарочно: этот предпросмотр показывает панель, и
       полоса у строки одна — её обособление. Его слово 2026-09-22. */
    }, { blockFill: false });
  };
  draw();
  previewRefreshers.push(draw);
  ["visual.tagWheel.scroller.size", "visual.tagWheel.scroller.direction",
   "visual.tagWheel.scroller.enabled", "visual.tagWheel.showMarkers",
   "visual.tagWheel.fillColor", "visual.tagWheel.textColor",
   /* Этих двух тут не было, и предпросмотр на них не перерисовывался (Пр3). */
   "visual.tagWheel.activeTextColor", "visual.tagWheel.chosenValueColor",
   "visual.tagWheel.highlightLine",
   "pkm.lineFormat.separator1", "pkm.lineFormat.separator2"].forEach(p => bind(p, draw));
}

/* Субхедер внутри группы: подпись, делящая длинную группу на части.
   Ни настройки, ни пути за ним нет — только вёрстка, поэтому это свой блок,
   а не вид контрола. Замечание заказчика 2026-09-04 про группу
   `Move lines (left\\right)`: в ней два разных дела, и на глаз они слитые.

   Подсказка — второй аргумент, и «?» стоит рядом с подписью, как у заголовка
   группы (замечание того же дня, вторая половина G3). Открывается она **под
   подписью**, а не внутри неё: строка подписи узкая, и раскрытие внутри
   растолкало бы её пополам. */
/*
 * Ключ субхедера. Один на три дела: идентификатор подсказки, который человек
 * видит в `Advanced → Diagnostics`, ключ свёрнутого состояния и то, чем его
 * спрашивает проверка. Второе объявление разошлось бы молча (У-32).
 */
function subheaderId(label) {
  return "io-tip-sub-" + String(label).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/*
 * Свёрнутые субхедеры групп. Состояние взгляда, а не настройка: в конфиг не
 * пишется и в отмену не попадает — как `FOLDED` у заголовков.
 */
const FOLDED_HEADS = new Set();
/* Красильщики субхедеров: раздела в миг отрисовки подписи ещё нет. */
let headPaints = [];

function renderSubheader(label, tip) {
  return function (host) {
    /* Субхедер прижимается к тому, что под ним: своя пометка на вместилище,
       а не общий отступ всех своих блоков — предпросмотры от неё не худеют.
       Замечание заказчика 2026-09-17: «мне не нравится что эти два субхедера
       висят в воздухе — у них слишком большое расстояние строки настроек». */
    if (host.classList) host.classList.add("io-custom--sub");
    const row = el("div", "io-sub io-sub--group", host);
    const id = subheaderId(label);
    /*
     * Знак сворачивания — его пункт 1 от 2026-09-22: «хочу, чтобы все
     * субхедеры были сворачиваемыми». Прячется не обёртка, а соседи: подпись
     * и строки под ней лежат в группе братьями, и конец раздела спрашивается
     * у разметки — следующий субхедер, — а не задаётся списком.
     */
    const mark = el("button", "io-fold", row);
    mark.type = "button";
    const paint = () => {
      const shut = FOLDED_HEADS.has(id);
      mark.textContent = shut ? "\u25B8" : "\u25BE";
      mark.classList.toggle("io-fold--shut", shut);
      mark.setAttribute("aria-expanded", shut ? "false" : "true");
      mark.setAttribute("aria-label", (shut ? "Expand " : "Collapse ") + label);
      let n = host.nextElementSibling;
      while (n && !n.classList.contains("io-custom--sub")) {
        n.classList.toggle("io-subshut", shut);
        n = n.nextElementSibling;
      }
    };
    mark.addEventListener("click", () => {
      if (FOLDED_HEADS.has(id)) FOLDED_HEADS.delete(id); else FOLDED_HEADS.add(id);
      paint();
    });
    el("span", "io-sub__text", row, label);
    /* Красится не здесь: раздела ещё нет. Зовёт `renderContent`, дорисовав
       вкладку, — и это не `setTimeout`: такта дымовой рендер не ждёт (У-212). */
    headPaints.push(paint);
    attachTip(row, tip, label, host, row);
  };
}

/* Знак плагина (`В-198`): картинка из стилей, декоративная — вкладку называет Obsidian. */
function renderBrandMark(host) {
  el("div", "io-brand", host).setAttribute("aria-hidden", "true");
}

function renderTabCallout(host) {
  const c = TAB_CALLOUTS[activeTab];
