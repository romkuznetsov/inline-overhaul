        el("span", null, foldedWarn, "\u26a0");
        el("span", null, foldedWarn, r.conflict);
      }
      return;
    }

    const conds = el("div", "io-rule__conds", main);
    KINDS.forEach(k => {
      const mine = r.conditions.filter(c => c.kind === k.id);
      const grp = el("div", "io-kind" + (mine.length ? "" : " io-kind--empty"), conds);
      el("div", "io-kind__label", grp, k.label);
      const chips = el("div", "io-kind__chips", grp);
      if (!mine.length) el("span", "io-kind__none", chips, "any");
      mine.forEach((c, ci) => {
        if (ci) el("span", "io-op" + (c.op === "and" ? " io-op--and" : ""), chips, c.op || "or");
        const shown = c.field
          ? c.field + " \u2014 any Value"
          : (c.value || "(empty)");
        const chip = el("span", "io-vchip", chips, shown);
        const x = iconBtn(chip, "✕", "Remove " + c.value + " from rule " + (i + 1));
        x.disabled = r.conditions.length < 2;
        x.addEventListener("click", () => {
          r.conditions.splice(r.conditions.indexOf(c), 1);
          const rest = r.conditions.filter(o => o.kind === k.id);
          if (rest.length) rest[0].op = "or";
          renderContent();
        });
      });
      const plus = iconBtn(grp, "+", "Add a " + k.label.toLowerCase() + " to rule " + (i + 1),
        "Add a " + k.label.toLowerCase());
      plus.addEventListener("click", () => {
        const groups = pickValues(k.id);
        dialog = { ruleId:r.id, kind:k.id, op:"or", fieldName:groups.length ? groups[0].name : "", value:"" };
        renderContent();
      });
    });

    const out = el("div", "io-rule__out", main);
    el("span", "io-rule__arrow", out, "→");
    el("span", null, out, "Use template");
    /* Тот же список, что у `Default template`: только из назначенной папки,
       и пустота объясняется теми же словами (замечание 1.6.6.2). */
    selectEl(out, OPTION_SOURCES["templates"](), r.template, "Template for rule " + (i + 1));

    /* Папка новой заметки у правила (10.13.8). `Default` — как
       `New notes folder`, `Near current note` — рядом с текущей заметкой,
       своя папка открывает поле рядом. */
    const where = el("div", "io-rule__out io-rule__where", main);
    el("span", "io-rule__arrow", where, "→");
    el("span", null, where, "Move to folder");
    const mode = selectEl(where, [
      { value:"default", label:"Default" },
      { value:"near",    label:"Near current note" },
      { value:"folder",  label:"Another folder\u2026" }
    ], r.folderMode || "default", "Move to folder for rule " + (i + 1));
    mode.addEventListener("change", () => {
      r.folderMode = mode.value;
      if (r.folderMode !== "folder") r.folder = "";
      renderContent();
    });
    if ((r.folderMode || "default") === "folder") {
      const path = el("input", "io-text io-text--mono", where);
      path.type = "text";
      path.value = r.folder || "";
      path.placeholder = "type or pick a folder";
      path.setAttribute("aria-label", "Move to folder path for rule " + (i + 1));
      path.addEventListener("change", () => { r.folder = path.value; renderContent(); });
    }

    /* `Advanced settings` у правила (З-5, заказчик 2026-09-08): своя ветка
       `Note content`. Открывает опции сам выбор, а не отдельная кнопка:
       второе состояние (открыто/закрыто) пришлось бы где-то хранить, а
       панель перерисовывает блок от любого изменения хранилища. */
    const adv = el("div", "io-rule__out io-rule__advanced", main);
    el("span", "io-rule__arrow", adv, "→");
    el("span", null, adv, "Advanced settings");
    const advMode = selectEl(adv, [
      { value:"default", label:"Default" },
      { value:"custom",  label:"Set for this rule" }
    ], r.placementMode || "default", "Advanced settings for rule " + (i + 1));
    advMode.addEventListener("change", () => {
      r.placementMode = advMode.value;
      renderContent();
    });

    if ((r.placementMode || "default") === "custom") {
      const p = r.placement || (r.placement = {
        position:"end", targetHeader:"", fallback:"end",
        headerMode:"datetime", headerLevel:"3", customHeader:"Captured",
        datetimeFormat:"YYYY-MM-DD HH:mm"
      });
      const plBox = el("div", "io-rule__placement", main);
      const plLine = (label) => {
        const wrap = el("div", "io-rule__plrow", plBox);
        el("span", "io-rule__pllabel", wrap, label);
        return wrap;
      };
      const plPick = (label, key, options) => {
        const wrap = plLine(label);
        const sel = selectEl(wrap, options, p[key], label + " for rule " + (i + 1));
        sel.addEventListener("change", () => { p[key] = sel.value; renderContent(); });
      };
      const plType = (label, key, hint) => {
        const wrap = plLine(label);
        const input = el("input", "io-text io-text--mono", wrap);
        input.type = "text";
        input.value = p[key] || "";
        if (hint) input.placeholder = hint;
        input.setAttribute("aria-label", label + " for rule " + (i + 1));
        input.addEventListener("change", () => { p[key] = input.value; renderContent(); });
      };

      plPick("Where to put the text", "position", [
        { value:"beginning",     label:"At the beginning" },
        { value:"end",           label:"At the end" },
        { value:"custom-header", label:"At custom header" }
      ]);
      if (p.position === "custom-header") {
        plType("Type name of header", "targetHeader", "# Header name");
        plPick("If header not found", "fallback", [
          { value:"beginning", label:"At the beginning" },
          { value:"end",       label:"At the end" }
        ]);
      }
      plPick("Line above the text", "headerMode", [
        { value:"custom",   label:"Fixed text" },
        { value:"datetime", label:"Date and time" },
        { value:"none",     label:"Nothing" }
      ]);
      if (p.headerMode !== "none") {
        plPick("Line above is header", "headerLevel", [{ value:"0", label:"No (plain text)" }]
          .concat(["1","2","3","4","5","6"].map(n => ({ value:n, label:n }))));
      }
      if (p.headerMode === "custom") plType("Text of the line above", "customHeader", "");
      if (p.headerMode === "datetime") plType("Date format", "datetimeFormat", "");
    }

    if (r.conflict) {
      const warn = el("div", "io-rule__warn", main);
      el("span", null, warn, "⚠");
      el("span", null, warn, r.conflict);
    }
  });

  const actions = el("div", "io-rowactions", host);
  const add = el("button", "io-btn io-btn--sm io-btn--cta", actions, "Add rule");
  add.type = "button";
  add.addEventListener("click", () => {
    const fresh = { id:"r" + (RULES.length + 1), name:"", enabled:true, template:"None", conflict:"",
      folderMode:"default", folder:"", placementMode:"default", conditions:[] };
    RULES.push(fresh);
    /* Новое правило рождается развёрнутым: его надо настроить (З-6). */
    SMART_RULES_OPEN.add(fresh.id);
    renderContent();
  });

}

/*
 * `Source line`: что станет со строкой после `Inline to note` (замечание
 * заказчика 1.4.3.1.2). Раньше под настройками стояла одна фраза «nothing is
 * kept…», и она пропадала, стоило отметить хоть один Field: человек видел
 * подпись пустого случая и не видел остальных.
 *
 * В прототипе строка выдуманная, в панели её считает движок тем же путём,
 * которым переносит по-настоящему.
 */
function renderSourcePreview(host) {
  const pt = PREVIEW_TEXTS["source-preview"];
  const box = previewShell(host, pt.cap, pt.tip);
  const body = el("div", "io-srcprev", box);

  const sep = String(val("pkm.lineFormat.separator1") || "||");
  const chips = FIELDS.filter(f => f.values && f.values.length)
    .map(f => f.type === "link" ? "[[" + f.values[0].token + "]]" : "#" + f.values[0].token);
  const line = (text) => chips.join(" ") + " " + sep + " " + text;
  const before = [line("Text"), line("Sub-line 1"), line("Sub-line 2")];

  const kept = FIELDS.filter(f => SOURCE_KEEP.indexOf(f.id) >= 0 && f.values && f.values.length)
    .map(f => f.type === "link" ? "[[" + f.values[0].token + "]]" : "#" + f.values[0].token);
  const fate = String(val("transform.inline2note.sourceProcessing.text") || "remove");
  /* Текст выдуманной строки здесь — одно слово `Text`, и при
     `leave_named` оно целиком уходит в название: остатка не остаётся, и
     показывать тут нечего. Разницу между положениями видно на живом
     предпросмотре в панели — там строка из одиннадцати слов. */
  const body_text = fate === "leave" ? "Text" : (fate === "words" ? "Text\u2026" : "");
  const link = val("transform.inline2note.sourceProcessing.replaceWithLink") === false ? "" : "[[Preview]]";
  const token = String(val("transform.inline2note.sourceProcessing.token") || "").trim();
  const onRight = String(val("transform.inline2note.sourceProcessing.panel") || "right") === "right";
  const head = kept.concat(onRight ? [] : (token ? [token] : [])).join(" ");
  const tail = onRight && token ? [token] : [];
  const parts = [head, [link, body_text].filter(Boolean).join(" ")].filter(Boolean);
  const parentAfter = "- " + parts.join(" " + sep + " ") + (tail.length ? " " + sep + " " + tail.join(" ") : "");
  const takeAlong = String(val("transform.inline2note.sublines") || "stay") === "remove";
  const after = takeAlong ? [parentAfter] : [parentAfter, before[1], before[2]];

  /* Подсказка у обеих половин (заказ заказчика 2026-09-08). Подпись здесь —
     строка во всю ширину предпросмотра, поэтому «?» стоит в ней самой. */
  const CAPTIP = {
    Before: "The line as you wrote it, with the Fields you have set up, and two lines indented under it. This half never changes with the settings: it is the starting point the half below is measured against",
    After: "The same line once <code>Inline to note</code> has run, with every choice in this block applied: what happens to your text, which Values stay behind, whether a link takes their place, and whether the indented lines travel with it"
  };
  const half = (label, lines) => {
    const cap = el("div", "io-srcprev__cap", body, label);
    attachTip(cap, CAPTIP[label], label, body, cap);
    const holder = el("div", "io-srcprev__lines", body);
    lines.forEach((text, i) => {
      const row = el("div", "io-srcprev__line" + (i && lines.length === 3 ? " io-srcprev__line--sub" : ""), holder);
      row.textContent = text;
    });
  };
  half("Before", before);
  half("After", after);
}

/* A Field is created with a name and a type, and the type is not editable
   afterwards: it decides what the Field writes into the line. */
function renderAddFieldDialog() {
  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) { dialog = null; renderContent(); } });

  const dlg = el("div", "io-dlg", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Add a Field");

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Add a Field");
  const close = iconBtn(head, "✕", "Cancel");
  close.style.setProperty("margin-left", "auto");
  close.addEventListener("click", () => { dialog = null; renderContent(); });

  const body = el("div", "io-dlg__body", dlg);

  const nRow = el("div", "io-item", body);
  const ni = el("div", "io-item__info", nRow);
  el("div", "io-item__name", ni, "Name");
  el("div", "io-item__desc", ni, "What this Field is called here and in the names of its commands");
  const input = textEl(el("div", "io-item__control", nRow), dialog.name, "Priority", "Name of the new Field");

  const tRow = el("div", "io-item", body);
  const ti = el("div", "io-item__info", tRow);
  el("div", "io-item__name", ti, "Type");
  el("div", "io-item__desc", ti, "What the Field writes into the line");
  attachTipItem(ti, body, { name:"Type",
    tip:"<b>Tag</b> writes a tag and can hold a list of Values. <b>Link</b> writes a wikilink to a note. " +
        "<b>Element</b> writes a marker and one value it knows how to step, such as a date. " +
        "The type is chosen once: it decides what the Field writes, and changing it later would rewrite every line that already has it" });
  const type = selectEl(el("div", "io-item__control", tRow),
    Object.keys(TYPE_LABEL).map(k => ({ value:k, label:TYPE_LABEL[k] })), dialog.type, "Type of the new Field");
  type.addEventListener("change", () => { dialog.type = type.value; });

  const foot = el("div", "io-dlg__foot", dlg);
  const cancel = el("button", "io-btn", foot, "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => { dialog = null; renderContent(); });
  const save = el("button", "io-btn io-btn--cta", foot, "Add");
  save.type = "button";
  save.addEventListener("click", () => {
    const name = String(dialog.name || "").trim();
    if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9_-]+/g, "_");
    FIELDS.push({ id, name, short:"", type:dialog.type, position:"Right", behavior:"Strict",
      color:TYPE_COLOR[dialog.type], property:"", cardinality:"auto", valueRule:"raw",
      marker:"", format:"", step:"increment", values:[] });
    selectedFieldId = id;
    dialog = null;
    renderContent();
  });

  const sync = () => { save.disabled = !String(dialog.name || "").trim(); };
  input.addEventListener("input", () => { dialog.name = input.value; sync(); });
  sync();

  const esc = e => {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    dialog = null; renderContent();
  };
  document.addEventListener("keydown", esc);
  input.focus();
}

/*
 * Переименование системного имени Field (замечание заказчика 1.4.1.2.2,
 * решение 2026-08-31). Имя стоит в заметках человека и в идентификаторах
 * команд Field, поэтому окно не спрашивает «уверены?», а перечисляет, что за
 * новым именем НЕ последует.
 */
function renderRenameFieldDialog() {
  const f = FIELDS.find(x => x.strict === dialog.rename);
  if (!f) { dialog = null; return; }

  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) { dialog = null; renderContent(); } });

  const dlg = el("div", "io-dlg", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Rename the Field " + f.name);

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Rename Field");

  const row = el("div", "io-item", dlg);
  const info = el("div", "io-item__info", row);
  el("div", "io-item__name", info, "New name");
  el("div", "io-item__desc", info, "Lowercase letters, digits, spaces, hyphens and underscores");
  const input = textEl(el("div", "io-item__control", row), f.strict, "",
    "New name for the Field " + f.name, "io-text io-text--mono");

  const warn = el("div", "io-dlg__warn", dlg);
  el("p", "io-item__desc", warn, "Two things will not follow the new name:");
  const list = el("ul", "io-dlg__list", warn);
  el("li", "io-item__desc", list,
    "lines you have already written keep the old tag \u2014 the plugin does not edit your notes");
  el("li", "io-item__desc", list,
    "a hotkey given to this Field\u2019s commands comes loose: Obsidian keeps hotkeys by "
    + "command id, and the id is built from the name");

  const foot = el("div", "io-dlg__foot", dlg);
  const cancel = el("button", "io-btn", foot, "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => { dialog = null; renderContent(); });
  const go = el("button", "io-btn io-btn--cta", foot, "Rename");
  go.type = "button";
  go.addEventListener("click", () => {
    const next = String(input.value || "").trim();
    if (!next || next === f.strict) { dialog = null; renderContent(); return; }
    f.strict = next;
    f.name = next;
    dialog = null;
    renderContent();
  });
}

function renderDialog() {
  if (dialog.addField) { renderAddFieldDialog(); return; }
  if (dialog.rename) { renderRenameFieldDialog(); return; }
  const kind = kindOf(dialog.kind);
  const rule = RULES.find(r => r.id === dialog.ruleId);
  if (!rule) { dialog = null; return; }
  const existing = rule.conditions.filter(c => c.kind === dialog.kind);
  const groups = pickValues(dialog.kind);
  const picked = groups.find(g => g.name === dialog.fieldName) || groups[0];

  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) { dialog = null; renderContent(); } });

  const dlg = el("div", "io-dlg", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Add a " + kind.label.toLowerCase() + " condition");

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Add a " + kind.label.toLowerCase());
  const close = iconBtn(head, "✕", "Cancel");
  close.style.setProperty("margin-left", "auto");
  close.addEventListener("click", () => { dialog = null; renderContent(); });

  const body = el("div", "io-dlg__body", dlg);

  if (existing.length) {
    const row = el("div", "io-item", body);
    const info = el("div", "io-item__info", row);
    el("div", "io-item__name", info, "Combine with");
    el("div", "io-item__desc", info, "or: the line needs any one of them. and: the line needs all of them");
    const s = selectEl(el("div", "io-item__control", row),
      [{ value:"or", label:"or" }, { value:"and", label:"and" }], dialog.op, "Operator");
    s.addEventListener("change", () => { dialog.op = s.value; });
  }

  const fRow = el("div", "io-item", body);
  const fi = el("div", "io-item__info", fRow);
  el("div", "io-item__name", fi, "Field");
  el("div", "io-item__desc", fi, "Pick a Field to list its Values");
  const fCtl = el("div", "io-item__control", fRow);
  const fs = selectEl(fCtl, groups.map(g => g.name), picked.name, "Field to pick from");
  fs.addEventListener("change", () => { dialog.fieldName = fs.value; dialog.value = ""; renderContent(); });
  /* Take the whole Field, not one of its Values (PRD 10.13.14, remark B14 of
     2026-09-02). The panel puts this on the Field name itself, which is what
     the owner asked for; here the Field is a select, so the affordance is a
     button beside it. Same capability, different shape — recorded as X-7. */
  const anyBtn = el("button", "io-btn io-btn--sm", fCtl, "Any Value");
  anyBtn.type = "button";
  anyBtn.setAttribute("aria-label", "Use any Value of " + picked.name);
  anyBtn.addEventListener("click", () => {
    const r = RULES.find(x => x.id === dialog.ruleId);
    if (r) r.conditions.push({ kind:dialog.kind, op:dialog.op, value:"", field:picked.name });
    dialog = null;
    renderContent();
  });

  const vRow = el("div", "io-item", body);
  const vi = el("div", "io-item__info", vRow);
  el("div", "io-item__name", vi, "Value");
  el("div", "io-item__desc", vi, "Type it, or choose below");
  const input = textEl(el("div", "io-item__control", vRow), dialog.value, kind.ph, "Value", "io-text io-text--mono");

  const picks = el("div", "io-picks", body);
  const buttons = [];
  picked.values.forEach(v => {
    const b = el("button", "io-pick", picks, v);
    b.type = "button";
    b.addEventListener("click", () => { dialog.value = v; input.value = v; sync(); });
    buttons.push([b, v]);
  });

  el("p", "io-note", body, dialog.kind === "tag"
    ? "A Value is stored without its Field name, and with or without the hash — both work"
    : "Anything the line actually contains can be used, not only configured Fields");

  const foot = el("div", "io-dlg__foot", dlg);
  const cancel = el("button", "io-btn", foot, "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => { dialog = null; renderContent(); });
  const save = el("button", "io-btn io-btn--cta", foot, "Add");
  save.type = "button";
  save.addEventListener("click", () => {
    rule.conditions.push({ kind:dialog.kind, value:dialog.value.trim(), op:existing.length ? dialog.op : "or" });
    dialog = null;
    renderContent();
  });

  function sync() {
    buttons.forEach(([b, v]) => b.setAttribute("aria-pressed", dialog.value === v ? "true" : "false"));
    save.disabled = !String(dialog.value || "").trim();
  }
  input.addEventListener("input", () => { dialog.value = input.value; sync(); });
  sync();

  const esc = e => {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    dialog = null; renderContent();
  };
  document.addEventListener("keydown", esc);
  input.focus();
}

/* ============================================================ Command reference */

/* ============================================================ Comment mode
   Notes are keyed by the schema id, kept in localStorage so a reload does not
   lose them, and exported as Markdown you can paste straight back into chat.
   ============================================================ */

const NOTES_KEY = "inline-overhaul-prototype-notes-v1";
let NOTES = {};
let commentMode = false;

try {
  const raw = window.localStorage.getItem(NOTES_KEY);
  if (raw) NOTES = JSON.parse(raw) || {};
} catch (_) { NOTES = {}; }

function saveNotes() {
  try { window.localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (_) {}
  const n = Object.keys(NOTES).filter(k => String(NOTES[k] || "").trim()).length;
  const badge = document.getElementById("opt-count");
  if (badge) badge.textContent = String(n);
}

/* Where a note belongs, in words, so the export reads without the prototype. */
function noteContext(key) {
  const id = key.replace(/^(item|group):/, "");
  for (const g of SCHEMA) {
    if (key === "group:" + g.id) {
      const tab = TABS.find(t => t.id === g.tab);
      return (tab ? tab.label : g.tab) + " / " + g.heading + "  (whole group)";
    }
    for (const it of g.items) {
      if (it.id !== id) continue;
      const tab = TABS.find(t => t.id === g.tab);
      const what = it.kind === "custom" ? "custom block" : (it.name || it.id);
      return (tab ? tab.label : g.tab) + " / " + g.heading + " / " + what;
    }
  }
  /* a sub-key such as values/header or value/todo */
  if (id.includes("/")) {
    const [base, part] = [id.split("/")[0], id.split("/").slice(1).join("/")];
    const pretty = { values:"Values table", value:"Value", placement:"Placement",
                     element:"Element", "field-editor":"Fields editor" }[base] || base;
    return pretty + " \u2192 " + part;
  }
  return id;
}

/* A comment anchored to part of a custom block: one table row, one column
   header, one control. Silent unless comment mode is on. */
function subComment(nameRow, holder, suffix) {
  if (!commentMode && !String(NOTES["item:" + suffix] || "").trim()) return;
  commentAffordance(nameRow, holder, "item:" + suffix);
}

/* One comment affordance: a button that opens an editor under the row. */
function commentAffordance(nameRow, holder, key) {
  if (!commentMode) {
    const saved = String(NOTES[key] || "").trim();
    if (saved) el("div", "io-csaved", holder, saved);
    return;
  }

  const has = !!String(NOTES[key] || "").trim();
  const btn = el("button", "io-cbtn" + (has ? " io-cbtn--has" : ""), nameRow, has ? "*" : "+");
  btn.type = "button";
  btn.title = has ? "Edit your comment" : "Add a comment";
  btn.setAttribute("aria-label", (has ? "Edit" : "Add") + " a comment on " + noteContext(key));
  btn.setAttribute("aria-expanded", "false");

  let wrap = null;
  const close = () => {
    if (wrap) { wrap.remove(); wrap = null; }
    btn.setAttribute("aria-expanded", "false");
  };
  const open = () => {
    btn.setAttribute("aria-expanded", "true");
    wrap = el("div", "io-cwrap", holder);
    const area = el("textarea", "io-carea", wrap);
    area.value = NOTES[key] || "";
    area.placeholder = "What is wrong here, or what it should say instead";
    area.setAttribute("aria-label", "Comment on " + noteContext(key));
    const meta = el("div", "io-cmeta", wrap);
    el("code", null, meta, key);
    const done = el("button", "io-btn io-btn--sm", meta, "Save");
    done.type = "button";
    const drop = el("button", "io-reset", meta, "Delete");
    drop.type = "button";
    const commit = () => {
      const v = area.value.trim();
      if (v) NOTES[key] = v; else delete NOTES[key];
      saveNotes();
    };
    area.addEventListener("blur", commit);
    done.addEventListener("click", () => { commit(); close(); renderContent(); });
    drop.addEventListener("click", () => { delete NOTES[key]; saveNotes(); close(); renderContent(); });
    area.focus();
  };
  btn.addEventListener("click", () => { if (wrap) { close(); } else { open(); } });

  const saved = String(NOTES[key] || "").trim();
  if (saved) el("div", "io-csaved", holder, saved);
}

function renderExport() {
  const scrim = el("div", "io-scrim", document.body);
  scrim.addEventListener("click", e => { if (e.target === scrim) scrim.remove(); });

  const dlg = el("div", "io-dlg io-export", scrim);
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-label", "Your comments");

  const head = el("div", "io-dlg__head", dlg);
  el("h4", null, head, "Your comments");
  const close = iconBtn(head, "✕", "Close");
  close.style.setProperty("margin-left", "auto");
  close.addEventListener("click", () => scrim.remove());

  const body = el("div", "io-dlg__body", dlg);
  const keys = Object.keys(NOTES).filter(k => String(NOTES[k] || "").trim());

  if (!keys.length) {
    el("p", "io-note", body,
      "No comments yet. Switch Comment mode on, then use the + beside any setting, group heading or preview");
  } else {
    const order = [];
    for (const g of SCHEMA) {
      if (NOTES["group:" + g.id]) order.push("group:" + g.id);
      for (const it of g.items) if (NOTES["item:" + it.id]) order.push("item:" + it.id);
    }
    for (const k of keys) if (!order.includes(k)) order.push(k);

    const lines = ["# Prototype comments", ""];
    for (const k of order) {
      lines.push("## " + noteContext(k));
      lines.push("`" + k + "`");
      lines.push("");
      lines.push(String(NOTES[k]).trim());
      lines.push("");
    }
    const area = el("textarea", null, body);
    area.readOnly = true;
    area.value = lines.join("\n");
    area.setAttribute("aria-label", "Your comments as Markdown");
    el("p", "io-note", body,
      "Copy and clear is the one you usually want: it hands the comments over and empties the list, so the next round " +
      "does not arrive mixed in with this one");
    setTimeout(() => { area.focus(); area.select(); }, 0);
  }

  const foot = el("div", "io-dlg__foot", dlg);
  if (keys.length) {
    const grab = () => {
      const area = body.querySelector("textarea");
      area.focus(); area.select();
      try { return document.execCommand("copy"); } catch (_) { return false; }
    };
    const copy = el("button", "io-btn", foot, "Copy");
    copy.type = "button";
    copy.addEventListener("click", () => { copy.textContent = grab() ? "Copied" : "Press Ctrl/Cmd + C"; });

    /* the usual case: hand them over and start clean, so the next round
       does not arrive mixed in with the last one */
    const both = el("button", "io-btn io-btn--cta", foot, "Copy and clear");
    both.type = "button";
    both.addEventListener("click", () => {
      if (!grab()) { both.textContent = "Press Ctrl/Cmd + C first"; return; }
      NOTES = {}; saveNotes(); scrim.remove(); renderContent();
    });
    const wipe = el("button", "io-btn", foot, "Clear without copying");
    wipe.type = "button";
    wipe.addEventListener("click", () => {
      NOTES = {}; saveNotes(); scrim.remove(); renderContent();
    });
  }
  const done = el("button", "io-btn", foot, "Close");
  done.type = "button";
  done.addEventListener("click", () => scrim.remove());

  const esc = e => {
    if (e.key !== "Escape") return;
    document.removeEventListener("keydown", esc);
    scrim.remove();
  };
  document.addEventListener("keydown", esc);
}

/* ============================================================ Hotkeys
   Obsidian exposes assigned hotkeys only through app.hotkeyManager, which is
   not part of the documented API. Everything here is feature-detected and
   wrapped, so a shape change degrades to a dash and a plain Hotkeys link
   rather than a broken settings pane.
   ============================================================ */

const MOCK_HOTKEYS = {
  "Smart bracket": "Ctrl + Alt + B",
  "Move line up": "Alt + Up",
  "Move line down": "Alt + Down",
  "Open TagWheel on the left": "Ctrl + Alt + W"
};

function hotkeyFor(commandName) {
  /* In the plugin this reads app.hotkeyManager; here it reads the mock. */
  return MOCK_HOTKEYS[commandName] || "";
}

/* A command, its current key, and a way to set it — the same affordance
   wherever a command is named. */
function commandChip(parent, commandName) {
  const wrap = el("button", "io-cmdchip", parent);
  wrap.type = "button";
  el("span", "io-cmdchip__name", wrap, commandName);
  const current = hotkeyFor(commandName);
  el("span", "io-cmdchip__key" + (current ? "" : " io-cmdchip__key--none"), wrap, current || "not set");
  wrap.title = "Open Obsidian's Hotkeys settings at this command";
  wrap.setAttribute("aria-label", (current ? "Change" : "Assign") + " the hotkey for " + commandName);
  wrap.addEventListener("click", () => openHotkeys(commandName));
  return wrap;
}

function openHotkeys(commandName) {
  document.getElementById("proto-hint").textContent =
    "Would open Obsidian \u2192 Settings \u2192 Hotkeys with \"" + commandName +
    "\" already in the search box. If that is not possible, the name goes to the clipboard instead";
}

function hotkeyCell(parent, commandName) {
  const current = hotkeyFor(commandName);
  const b = el("button", "io-hk" + (current ? "" : " io-hk--none"), parent, current || "not set");
  b.type = "button";
  b.title = "Open Obsidian's Hotkeys settings at this command";
  b.setAttribute("aria-label", (current ? "Change" : "Assign") + " the hotkey for " + commandName);
  b.addEventListener("click", () => openHotkeys(commandName));
  return b;
}

/* ============================================================ Prototype chrome */

document.querySelectorAll("[data-theme-set]").forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.themeSet;
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    document.querySelectorAll("[data-theme-set]").forEach(b =>
      b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  });
});
document.getElementById("opt-review").addEventListener("change", e => {
  document.body.classList.toggle("proto-review", e.target.checked);
});
document.getElementById("opt-comment").addEventListener("change", e => {
  commentMode = e.target.checked;
  document.body.classList.toggle("proto-comment", commentMode);
  document.getElementById("proto-hint").textContent = commentMode
    ? "Comment mode is on. Use the + beside any setting, group heading or preview, then press Comments to copy them all out"
    : "Turn a module off under General to see how its tab collapses. Show everything ignores the visibility rules";
  renderContent();
});
document.getElementById("opt-export").addEventListener("click", renderExport);

document.getElementById("opt-showall").addEventListener("change", e => {
  showAll = e.target.checked;
  document.body.classList.toggle("proto-showall", showAll);
  renderContent();
});

seed();
setIn(state, "general.help.showTips", true);
saveNotes();
renderTabs();
renderContent();
</script>
