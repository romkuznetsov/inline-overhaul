<title>Inline Overhaul Settings</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   Tokens — named exactly as Obsidian names them, so this file
   doubles as the variable map required by PRD 5.7.
   Light on bare :root; dark redefined for prefers-color-scheme
   (guarded) and again for the [data-theme="dark"] stamp.
   ============================================================ */
:root {
  --background-primary:        #ffffff;
  --background-primary-alt:    #f8f8f9;
  --background-secondary:      #f2f3f5;
  --background-secondary-alt:  #e7e8ea;
  --background-modifier-border:#e2e2e5;
  --background-modifier-hover: rgba(28, 24, 44, 0.055);
  --background-modifier-form-field: #ffffff;
  --background-modifier-error: #e5484d;
  --background-modifier-success:#2f9e63;

  --text-normal:   #23222b;
  --text-muted:    #5d5b6b;
  --text-faint:    #94939f;
  --text-on-accent:#ffffff;
  --text-accent:   #6c5cd0;

  --interactive-accent:       #6c5cd0;
  --interactive-accent-hover: #7d6ddb;
  --interactive-normal:       #eeeef1;
  --interactive-hover:        #e3e3e8;

  --shadow-modal: 0 18px 48px rgba(24, 20, 40, 0.18), 0 2px 6px rgba(24, 20, 40, 0.08);

  --proto-bg:     #edecf2;
  --proto-surface:#ffffff;
  --proto-border: #dbd9e4;
  --proto-text:   #43414f;
  --proto-faint:  #8b8899;

  --font-ui:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-ui-small:   13px;
  --font-ui-smaller: 12px;

  --radius-s: 4px;
  --radius-m: 6px;
  --radius-l: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background-primary:        #1d1c22;
    --background-primary-alt:    #232228;
    --background-secondary:      #17161b;
    --background-secondary-alt:  #26252c;
    --background-modifier-border:#31303a;
    --background-modifier-hover: rgba(255, 255, 255, 0.065);
    --background-modifier-form-field: #24232a;
    --background-modifier-error: #e5484d;
    --background-modifier-success:#3ba76a;

    --text-normal:   #dddce4;
    --text-muted:    #a3a1b0;
    --text-faint:    #6d6b7a;
    --text-on-accent:#ffffff;
    --text-accent:   #9c8ef0;

    --interactive-accent:       #7a69dd;
    --interactive-accent-hover: #8b7ae8;
    --interactive-normal:       #2a2930;
    --interactive-hover:        #34333c;

    --shadow-modal: 0 20px 52px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);

    --proto-bg:     #121116;
    --proto-surface:#1b1a20;
    --proto-border: #2c2b34;
    --proto-text:   #c9c7d3;
    --proto-faint:  #7b7989;
  }
}

:root[data-theme="dark"] {
  --background-primary:        #1d1c22;
  --background-primary-alt:    #232228;
  --background-secondary:      #17161b;
  --background-secondary-alt:  #26252c;
  --background-modifier-border:#31303a;
  --background-modifier-hover: rgba(255, 255, 255, 0.065);
  --background-modifier-form-field: #24232a;
  --background-modifier-error: #e5484d;
  --background-modifier-success:#3ba76a;

  --text-normal:   #dddce4;
  --text-muted:    #a3a1b0;
  --text-faint:    #6d6b7a;
  --text-on-accent:#ffffff;
  --text-accent:   #9c8ef0;

  --interactive-accent:       #7a69dd;
  --interactive-accent-hover: #8b7ae8;
  --interactive-normal:       #2a2930;
  --interactive-hover:        #34333c;

  --shadow-modal: 0 20px 52px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);

  --proto-bg:     #121116;
  --proto-surface:#1b1a20;
  --proto-border: #2c2b34;
  --proto-text:   #c9c7d3;
  --proto-faint:  #7b7989;
}

/* ============================================================ Base */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--proto-bg);
  color: var(--proto-text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--interactive-accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ============================================================ Prototype chrome */
.proto { max-width: 1180px; margin: 0 auto; padding: 22px 20px 56px; display: flex; flex-direction: column; gap: 16px; }

.proto-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 12px 16px;
  background: var(--proto-surface); border: 1px solid var(--proto-border); border-radius: var(--radius-l);
}
.proto-bar__label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--proto-faint); margin-right: 2px;
}
.proto-switch {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--font-ui-smaller); color: var(--proto-text); cursor: pointer; user-select: none;
}
.proto-switch input { accent-color: var(--interactive-accent); margin: 0; }
.proto-seg { display: inline-flex; border: 1px solid var(--proto-border); border-radius: var(--radius-m); overflow: hidden; }
.proto-seg button {
  appearance: none; border: 0; background: transparent; color: var(--proto-faint);
  font-family: inherit; font-size: var(--font-ui-smaller); padding: 4px 11px; cursor: pointer;
}
.proto-seg button[aria-pressed="true"] { background: var(--interactive-accent); color: #fff; }
.proto-hint { flex: 1 1 260px; min-width: 0; font-size: var(--font-ui-smaller); color: var(--proto-faint); }

.proto-btn {
  appearance: none; font-family: inherit; font-size: var(--font-ui-smaller);
  color: var(--proto-text); background: transparent;
  border: 1px solid var(--proto-border); border-radius: var(--radius-m);
  padding: 4px 10px; cursor: pointer;
}
.proto-btn:hover { border-color: var(--interactive-accent); color: var(--text-accent); }
.proto-btn span { font-variant-numeric: tabular-nums; }

/* ============================================================ Comment mode */
.io-cbtn {
  appearance: none; flex: 0 0 auto; width: 17px; height: 17px; padding: 0;
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  background: transparent; color: var(--text-faint);
  font-family: inherit; font-size: 9px; line-height: 1; cursor: pointer;
}
.io-cbtn:hover { color: var(--text-accent); border-color: var(--interactive-accent); }
.io-cbtn--has { background: var(--interactive-accent); border-color: transparent; color: var(--text-on-accent); }
.io-cwrap { margin: 7px 0 2px; max-width: 70ch; }
.io-carea {
  width: 100%; min-height: 62px; resize: vertical;
  font-family: inherit; font-size: var(--font-ui-smaller); line-height: 1.5;
  color: var(--text-normal); background: var(--background-modifier-form-field);
  border: 1px solid var(--interactive-accent); border-radius: var(--radius-s); padding: 7px 9px;
}
.io-cmeta {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
  font-size: 10.5px; color: var(--text-faint);
}
.io-cmeta code {
  font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 3px;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border);
}
.io-csaved {
  margin: 7px 0 2px; padding: 7px 10px; max-width: 70ch;
  border-left: 2px solid var(--interactive-accent); border-radius: 0 var(--radius-s) var(--radius-s) 0;
  background: var(--background-secondary);
  font-size: var(--font-ui-smaller); color: var(--text-normal); white-space: pre-wrap;
}
body.proto-comment .io-item { outline: 1px dashed transparent; }
body.proto-comment .io-item:hover { outline-color: var(--background-modifier-border); outline-offset: 3px; }

.io-export { width: min(760px, 100%); }
.io-export textarea {
  width: 100%; height: 46vh; resize: vertical;
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
  color: var(--text-normal); background: var(--background-modifier-form-field);
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s); padding: 9px 11px;
}

/* ============================================================ Obsidian window mock */
.obsidian {
  display: grid; grid-template-columns: 214px minmax(0, 1fr);
  min-height: 680px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-modal);
  overflow: hidden;
}
.rail {
  background: var(--background-secondary);
  border-right: 1px solid var(--background-modifier-border);
  padding: 14px 8px; overflow-y: auto;
}
.rail__group {
  font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-faint); padding: 12px 10px 5px;
}
.rail__group:first-child { padding-top: 2px; }
.rail__item { padding: 5px 10px; border-radius: var(--radius-s); font-size: var(--font-ui-small); color: var(--text-muted); cursor: default; }
.rail__item--active { background: var(--background-secondary-alt); color: var(--text-normal); font-weight: 500; }

.pane { min-width: 0; display: flex; flex-direction: column; }

/* Tab row — PRD 5.4. No mod-cta; active state is background + color
   + an accent underline, never opacity. */
.io-tabs {
  display: flex; gap: 2px; padding: 12px 24px 0;
  border-bottom: 1px solid var(--background-modifier-border);
  overflow-x: auto; scrollbar-width: thin;
}
.io-tab {
  appearance: none; border: 0; background: transparent; font-family: inherit;
  font-size: var(--font-ui-small); color: var(--text-muted);
  padding: 7px 12px 9px; border-radius: var(--radius-s) var(--radius-s) 0 0;
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
  transition: color 120ms ease, background-color 120ms ease;
}
.io-tab:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
.io-tab--active { color: var(--text-normal); font-weight: 500; border-bottom-color: var(--interactive-accent); }
.io-tab__count { display: inline-block; margin-left: 6px; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--text-faint); }

.io-content { flex: 1; overflow-y: auto; padding: 8px 24px 40px; }

/* ============================================================ Groups and rows */
.io-group { padding-top: 18px; }
.io-group + .io-group { padding-top: 4px; }
.io-group__heading { padding: 14px 0 0; font-size: 16px; font-weight: 600; color: var(--text-normal); text-wrap: balance; }
.io-group__intro { margin: 4px 0 2px; max-width: 64ch; font-size: var(--font-ui-smaller); color: var(--text-muted); }
.io-group__cmds { margin: 3px 0 2px; font-size: var(--font-ui-smaller); color: var(--text-faint); }
.io-group__cmds code {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 3px;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border); color: var(--text-muted);
}

.io-item {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
  padding: 13px 0; border-top: 1px solid var(--background-modifier-border);
}
.io-group__heading + .io-item,
.io-group__intro + .io-item,
.io-group__cmds + .io-item { border-top: 0; }

.io-item__info { min-width: 0; flex: 1 1 auto; }
.io-item__namerow { display: flex; align-items: center; gap: 6px; }
.io-item__name { color: var(--text-normal); }
.io-item__desc { margin-top: 2px; max-width: 60ch; font-size: var(--font-ui-smaller); color: var(--text-muted); }
.io-item__control { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding-top: 1px; }

.io-item--disabled { opacity: 0.55; }
.io-item--disabled .io-item__control { pointer-events: none; }

.io-item--flash { animation: io-flash 1.4s ease-out; }
@keyframes io-flash {
  0%, 32% { background: var(--background-modifier-hover); box-shadow: inset 2px 0 0 var(--interactive-accent); }
  100%    { background: transparent; box-shadow: none; }
}

/* the ? affordance — PRD: adds detail, never replaces the description */
.io-help {
  appearance: none; flex: 0 0 auto;
  width: 16px; height: 16px; padding: 0;
  border: 1px solid var(--background-modifier-border); border-radius: 50%;
  background: transparent; color: var(--text-faint);
  font-family: inherit; font-size: 10px; line-height: 1; cursor: pointer;
}
.io-help:hover { color: var(--text-normal); border-color: var(--text-muted); }
.io-help[aria-expanded="true"] { background: var(--interactive-accent); border-color: transparent; color: var(--text-on-accent); }

.io-tip {
  margin: 7px 0 1px; padding: 8px 11px; max-width: 64ch;
  border-left: 2px solid var(--interactive-accent);
  border-radius: 0 var(--radius-s) var(--radius-s) 0;
  background: var(--background-secondary);
  font-size: var(--font-ui-smaller); color: var(--text-muted);
}
.io-tip code {
  font-family: var(--font-mono); font-size: 11px; padding: 1px 4px; border-radius: 3px;
  background: var(--background-primary); border: 1px solid var(--background-modifier-border); color: var(--text-normal);
}
.io-tip b { color: var(--text-normal); font-weight: 500; }

.io-see {
  appearance: none; border: 0; background: transparent; padding: 4px 0 0;
  font-family: inherit; font-size: var(--font-ui-smaller); color: var(--text-accent);
  cursor: pointer; display: block; text-align: left;
}
.io-see:hover { text-decoration: underline; }

/* callout at the top of a tab */
.io-callout {
  margin: 14px 0 2px; padding: 11px 13px; max-width: 66ch;
  border: 1px solid var(--background-modifier-border); border-left: 2px solid var(--interactive-accent);
  border-radius: 0 var(--radius-m) var(--radius-m) 0;
  background: var(--background-secondary);
  font-size: var(--font-ui-smaller); color: var(--text-muted);
}
.io-callout b { color: var(--text-normal); font-weight: 500; }

/* review annotations */
.io-meta { display: none; margin-top: 5px; gap: 6px; flex-wrap: wrap; }
.proto-review .io-meta { display: flex; }
.io-meta code {
  font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border); color: var(--text-muted);
}
.io-meta code.is-id { color: var(--text-accent); }

.proto-showall .io-item--forced,
.proto-showall .io-group--forced { position: relative; }
.proto-showall .io-item--forced::before,
.proto-showall .io-group--forced::before {
  content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 2px; background: var(--interactive-accent); opacity: 0.5;
}

/* ============================================================ Controls */
.io-toggle {
  appearance: none; position: relative; flex: 0 0 auto;
  width: 34px; height: 19px; margin: 0; border-radius: 19px;
  background: var(--background-modifier-border); cursor: pointer;
  transition: background-color 140ms ease;
}
.io-toggle::after {
  content: ""; position: absolute; top: 2.5px; left: 2.5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--background-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  transition: transform 140ms ease;
}
.io-toggle:checked { background: var(--interactive-accent); }
.io-toggle:checked::after { transform: translateX(15px); }

.io-select, .io-text, .io-number {
  font-family: inherit; font-size: var(--font-ui-small); color: var(--text-normal);
  background: var(--background-modifier-form-field);
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  padding: 5px 8px;
}
.io-select { min-width: 172px; }
.io-text   { width: 200px; }
.io-number { width: 72px; font-variant-numeric: tabular-nums; }
.io-text--wide { width: 258px; }
.io-text--mono { font-family: var(--font-mono); font-size: 11.5px; }

.io-textarea {
  font-family: var(--font-mono); font-size: var(--font-ui-smaller); line-height: 1.6;
  color: var(--text-normal); background: var(--background-modifier-form-field);
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  padding: 7px 9px; width: 236px; resize: vertical;
}

.io-range {
  appearance: none; width: 148px; height: 4px; margin: 0; border-radius: 3px;
  background: var(--background-modifier-border); cursor: pointer;
}
.io-range::-webkit-slider-thumb {
  appearance: none; width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--interactive-accent);
}
.io-range::-moz-range-thumb {
  width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--interactive-accent);
}
.io-value {
  min-width: 56px; text-align: right;
  font-size: var(--font-ui-smaller); font-variant-numeric: tabular-nums; color: var(--text-muted);
}
.io-value--pending { color: var(--text-accent); }
.io-value--saved   { color: var(--background-modifier-success); }

.io-btn {
  appearance: none; font-family: inherit; font-size: var(--font-ui-small); color: var(--text-normal);
  background: var(--interactive-normal); border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s); padding: 5px 12px; cursor: pointer;
}
.io-btn:hover { background: var(--interactive-hover); }
.io-btn--cta { background: var(--interactive-accent); border-color: transparent; color: var(--text-on-accent); }
.io-btn--cta:hover { background: var(--interactive-accent-hover); }
.io-btn--sm { padding: 2px 9px; font-size: var(--font-ui-smaller); }

.io-icon {
  appearance: none; border: 0; background: transparent; color: var(--text-faint);
  font-family: inherit; font-size: 13px; padding: 2px 6px; border-radius: 3px; cursor: pointer;
}
.io-icon:hover { color: var(--text-normal); background: var(--background-modifier-hover); }

.io-color {
  width: 30px; height: 24px; padding: 0;
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  background: var(--background-modifier-form-field); cursor: pointer;
}
.io-reset {
  appearance: none; border: 0; background: transparent; color: var(--text-faint);
  font-family: inherit; font-size: var(--font-ui-smaller); padding: 2px 4px; cursor: pointer;
}
.io-reset:hover { color: var(--text-normal); }

/* ============================================================ Previews */
.io-preview {
  --io-opacity-left: 1; --io-opacity-right: 1; --io-text-scale: 1;
  --io-bubble-x: 1; --io-bubble-y: 1; --io-empty-x: 1; --io-corners: 1;
  --io-bar-thickness: 3px; --io-bar-gap: 6px; --io-bar-distance: 14px;

  margin: 8px 0 2px; padding: 14px 16px 11px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
}
.io-preview__cap {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 9px;
}
.io-preview__cap::after { content: ""; flex: 1; height: 1px; background: var(--background-modifier-border); }
.io-preview__note { margin: 9px 0 0; font-size: var(--font-ui-smaller); color: var(--text-faint); max-width: 66ch; }

.io-line {
  display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
  font-size: var(--font-ui-small); color: var(--text-normal); padding: 3px 0;
}
.io-line__prefix { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); }
.io-line__text   { color: var(--text-muted); }
.io-line__sep    { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.io-line__side   { display: inline-flex; align-items: center; gap: 5px; }
.io-line__side--left  { opacity: var(--io-opacity-left); }
.io-line__side--right { opacity: var(--io-opacity-right); }
.io-line__hint { font-size: 11px; color: var(--text-faint); font-style: italic; }

/* Only tags get bubbles. Links and elements stay plain text. */
.io-bubble {
  display: inline-block; white-space: nowrap;
  font-size: calc(11.5px * var(--io-text-scale)); line-height: 1.35;
  padding: calc(2.5px * var(--io-bubble-y)) calc(9px * var(--io-bubble-x));
  border-radius: calc(11px * var(--io-corners) + 2px);
  background: var(--io-bubble-bg, var(--interactive-accent));
  color: var(--text-on-accent);
}
/* A bubble with no text is still a bubble: same height, filled, just narrow. */
.io-bubble--empty {
  width: calc(30px * var(--io-empty-x));
  padding-left: 0; padding-right: 0; color: transparent;
}
.io-elem { font-family: var(--font-mono); font-size: calc(11.5px * var(--io-text-scale)); color: var(--text-muted); }
.io-link { color: var(--text-accent); }

/* Level bars. One bar per nesting level of the chosen field, and a bar runs
   the whole height of the subtree it belongs to — so nesting the markup is
   what draws it, with no measuring. */
.io-tree { display: flex; flex-direction: column; }
.io-branch { display: flex; flex-direction: column; }
.io-branch--bar {
  border-left: var(--io-bar-thickness) solid var(--io-bar-color, var(--text-faint));
  padding-left: var(--io-bar-gap);
}
.io-branch--root { padding-left: 0; }
.io-tline { display: flex; align-items: center; padding: 2px 0; }
.io-tline__pad { flex: 0 0 var(--io-bar-distance); }

/* TagWheel. Fields run across, the values of the active field run down. */
.io-wheelwrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.io-wheel {
  display: flex; align-items: flex-start; gap: 4px;
  padding: 6px 8px; border-radius: var(--radius-m);
  background: var(--io-wheel-bg, var(--background-primary));
  border: 1px solid var(--background-modifier-border);
  box-shadow: 0 4px 14px rgba(20, 17, 32, 0.14);
}
.io-wheelval {
  font-size: 11.5px; text-align: center; padding: 2px 8px; border-radius: 20px;
  color: var(--io-wheel-fg, var(--text-muted)); white-space: nowrap;
}
.io-wheelval--current { background: var(--interactive-accent); color: var(--text-on-accent); font-weight: 500; }
.io-wheelval--dim { opacity: 0.5; }
.io-key {
  font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
  background: var(--background-primary); border: 1px solid var(--background-modifier-border);
  color: var(--text-muted);
}

/* A real sequence, so the numbering is information. */
.io-order { margin: 8px 0 2px; padding: 0; list-style: none; counter-reset: io-step; max-width: 64ch; }
.io-order li {
  counter-increment: io-step; position: relative;
  padding: 5px 0 5px 30px; font-size: var(--font-ui-smaller); color: var(--text-muted);
}
.io-order li + li { border-top: 1px dashed var(--background-modifier-border); }
.io-order li::before {
  content: counter(io-step);
  position: absolute; left: 0; top: 5px; width: 19px; height: 19px; border-radius: 50%;
  background: var(--background-secondary-alt); color: var(--text-muted);
  font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums;
  display: grid; place-items: center;
}
.io-order b { color: var(--text-normal); font-weight: 500; }
.io-order .io-order__then { color: var(--text-accent); }
.io-orderpair { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }
.io-ordercol__cap {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-normal);
  padding: 2px 6px; border-radius: 3px; display: inline-block;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border);
}

/* ============================================================ Custom editors */
.io-custom { padding: 4px 0 14px; border-top: 1px solid var(--background-modifier-border); margin-top: 13px; }
.io-group__heading + .io-custom,
.io-group__intro + .io-custom,
.io-group__cmds + .io-custom { border-top: 0; margin-top: 0; }

.io-card {
  background: var(--background-primary-alt);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m); overflow: hidden;
}
.io-card + .io-card { margin-top: 8px; }
.io-scroll { overflow-x: auto; }

.io-tablehead, .io-tablerow { display: grid; gap: 10px; align-items: center; padding: 8px 12px; }
.io-tablehead {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-tablerow + .io-tablerow { border-top: 1px solid var(--background-modifier-border); }
.io-tablefoot { padding: 8px 12px; border-top: 1px solid var(--background-modifier-border); }

.io-grip { color: var(--text-faint); cursor: grab; font-size: 12px; user-select: none; }
.io-chip {
  display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 20px;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border);
  color: var(--text-muted); white-space: nowrap;
}
.io-chip--typed {
  background: var(--io-chip-bg, var(--background-secondary));
  border-color: transparent; color: var(--text-on-accent); font-weight: 500;
}
.io-cellname { font-size: var(--font-ui-small); color: var(--text-normal); }
.io-cell { font-size: var(--font-ui-smaller); color: var(--text-muted); }
.io-mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); }

/* fields: list and detail */
.io-fields {
  display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: stretch;
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m);
  overflow: hidden; background: var(--background-primary);
}
.io-fields__list { background: var(--background-secondary); padding: 6px; flex: 1 1 auto; }
.io-fields__item {
  display: flex; align-items: center; gap: 7px; width: 100%;
  font-size: var(--font-ui-small); color: var(--text-muted);
  padding: 4px 4px 4px 8px; border-radius: var(--radius-s);
}
/* Выбор Field — кнопка внутри ряда: рядом с ней стоят стрелки, а кнопку
   внутрь кнопки вложить нельзя. */
.io-fields__pick {
  display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0;
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font-family: inherit; font: inherit; color: inherit; text-align: left;
  padding: 2px 0; border-radius: var(--radius-s);
}
.io-fields__item:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
.io-fields__item[aria-current="true"] {
  background: var(--background-primary); color: var(--text-normal); font-weight: 500;
  box-shadow: inset 2px 0 0 var(--interactive-accent);
}
.io-fields__item .io-chip { margin-left: auto; }
.io-fields__add { margin-top: 4px; border-top: 1px solid var(--background-modifier-border); padding-top: 6px; }
.io-fields__detail { padding: 14px 16px 16px; min-width: 0; }
.io-fields__title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.io-fields__title h4 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-normal); }
.io-fields__hint { margin: 0 0 10px; font-size: var(--font-ui-smaller); color: var(--text-muted); }

.io-vals { border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); overflow: hidden; }
.io-vals__inner { min-width: 620px; }
.io-vals__head {
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-vals__row + .io-vals__row { border-top: 1px solid var(--background-modifier-border); }
/* every control fills its own cell and may shrink, so nothing overlaps */
.io-vals__row .io-text, .io-vals__row .io-select { width: 100%; min-width: 0; }
.io-valcell { min-width: 0; }
.io-vals__row--child .io-valcell { padding-left: 22px; }
.io-showncell { min-width: 0; display: grid; gap: 4px; }
.io-vals__foot {
  padding: 7px 10px; border-top: 1px solid var(--background-modifier-border);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.io-vals__foot .io-note { margin: 0; }
.io-colin {
  width: 28px; height: 22px; padding: 0; border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s); background: var(--background-modifier-form-field); cursor: pointer;
}
.io-sub { margin: 16px 0 7px; font-size: 13px; font-weight: 600; color: var(--text-normal); }

/* drag-and-drop order lists */
.io-sortable { border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); overflow: hidden; }
.io-sortrow {
  display: flex; align-items: center; gap: 9px; padding: 6px 10px;
  font-size: var(--font-ui-small); color: var(--text-normal); background: var(--background-primary);
}
.io-sortrow + .io-sortrow { border-top: 1px solid var(--background-modifier-border); }
.io-sortrow__n {
  width: 17px; height: 17px; border-radius: 4px; flex: 0 0 auto;
  background: var(--background-secondary-alt); color: var(--text-muted);
  font-size: 10px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.io-sortrow__move { margin-left: auto; display: flex; gap: 2px; }

.io-hk {
  appearance: none; font-family: var(--font-mono); font-size: 11px;
  padding: 2px 8px; border-radius: var(--radius-s); cursor: pointer;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border);
  color: var(--text-normal); white-space: nowrap;
}
.io-hk:hover { border-color: var(--interactive-accent); color: var(--text-accent); }
.io-hk--none { color: var(--text-faint); font-family: var(--font-ui); }

/* command reference */
.io-cmd { border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); overflow: hidden; }
.io-cmd__area {
  padding: 7px 12px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-cmd__area:not(:first-child) { border-top: 1px solid var(--background-modifier-border); }
.io-cmd__row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  padding: 6px 12px; font-size: var(--font-ui-small); color: var(--text-normal);
}
.io-cmd__row + .io-cmd__row { border-top: 1px solid var(--background-modifier-border); }
.io-cmd__does { font-size: var(--font-ui-smaller); color: var(--text-muted); text-align: right; max-width: 44ch; }

/* smart rules */
.io-rules { display: flex; flex-direction: column; gap: 12px; }
.io-rule {
  display: grid; grid-template-columns: 3px minmax(0, 1fr);
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m);
  background: var(--background-primary); overflow: hidden;
}
.io-rule__rail { background: var(--interactive-accent); }
.io-rule--off .io-rule__rail { background: var(--background-modifier-border); }
.io-rule--clash .io-rule__rail { background: var(--background-modifier-error); }
.io-rule--off .io-rule__main { opacity: 0.6; }
.io-rule__main { min-width: 0; }
.io-rule__head { display: flex; align-items: center; gap: 9px; padding: 9px 12px 7px; }
.io-rule__n {
  width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto;
  background: var(--interactive-accent); color: var(--text-on-accent);
  font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.io-rule--off .io-rule__n { background: var(--background-modifier-border); color: var(--text-faint); }
.io-rule--clash .io-rule__n { background: var(--background-modifier-error); }
.io-rule__name {
  flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: var(--font-ui-small);
  color: var(--text-normal); background: transparent;
  border: 1px solid transparent; border-radius: var(--radius-s); padding: 3px 7px;
}
.io-rule__name:hover { border-color: var(--background-modifier-border); }
.io-rule__name:focus { background: var(--background-modifier-form-field); border-color: var(--background-modifier-border); }
.io-rule__name::placeholder { color: var(--text-faint); font-style: italic; }
.io-rule__tools { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.io-rule__conds { padding: 0 12px 4px; }
.io-rule__out {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-top: 1px solid var(--background-modifier-border);
  background: var(--background-primary-alt);
  font-size: var(--font-ui-smaller); color: var(--text-muted);
}
.io-rule__arrow { color: var(--text-accent); font-size: 13px; }
.io-rule__warn {
  display: flex; align-items: flex-start; gap: 7px; padding: 7px 12px;
  border-top: 1px solid var(--background-modifier-border);
  font-size: var(--font-ui-smaller); color: var(--background-modifier-error);
}
.io-kind { display: grid; grid-template-columns: 76px minmax(0, 1fr) 24px; gap: 9px; align-items: center; padding: 5px 0; }
.io-kind + .io-kind { border-top: 1px dashed var(--background-modifier-border); }
.io-kind__label { font-size: var(--font-ui-smaller); color: var(--text-muted); }
.io-kind--empty .io-kind__label { color: var(--text-faint); }
.io-kind__chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; }
.io-kind__none { font-size: var(--font-ui-smaller); color: var(--text-faint); }
.io-vchip {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: 11px; padding: 2px 3px 2px 8px; border-radius: 20px;
  background: var(--background-secondary); border: 1px solid var(--background-modifier-border);
  color: var(--text-normal);
}
.io-op {
  font-family: var(--font-ui); font-size: 10px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); padding: 0 1px;
}
.io-op--and { color: var(--text-accent); }

/* dialog */
.io-scrim { position: fixed; inset: 0; background: rgba(20, 17, 32, 0.42); display: grid; place-items: center; padding: 20px; z-index: 20; }
.io-dlg {
  width: min(430px, 100%); background: var(--background-primary);
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-l);
  box-shadow: var(--shadow-modal); overflow: hidden;
}
.io-dlg__head { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border-bottom: 1px solid var(--background-modifier-border); }
.io-dlg__head h4 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-normal); }
.io-dlg__body { padding: 2px 15px 10px; }
.io-dlg__foot {
  display: flex; justify-content: flex-end; gap: 8px; padding: 11px 15px;
  border-top: 1px solid var(--background-modifier-border); background: var(--background-primary-alt);
}
.io-dlg .io-item { padding: 9px 0; }
.io-dlg .io-select, .io-dlg .io-text { width: 186px; min-width: 0; }
.io-picks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; max-height: 130px; overflow-y: auto; padding: 2px 0; }
.io-pick {
  appearance: none; cursor: pointer; font-family: var(--font-mono); font-size: 11px;
  padding: 3px 9px; border-radius: 20px; background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border); color: var(--text-normal);
}
.io-pick:hover { border-color: var(--interactive-accent); color: var(--text-accent); }
.io-pick[aria-pressed="true"] { background: var(--interactive-accent); border-color: transparent; color: var(--text-on-accent); }

.io-empty {
  margin-top: 14px; padding: 14px 16px; max-width: 64ch;
  border: 1px dashed var(--background-modifier-border); border-radius: var(--radius-m);
  font-size: var(--font-ui-smaller); color: var(--text-muted);
}
.io-note { font-size: var(--font-ui-smaller); color: var(--text-muted); margin: 8px 0 0; max-width: 66ch; }
.io-rowactions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }

@media (max-width: 860px) {
  .io-fields { grid-template-columns: minmax(0, 1fr); }
  .io-fields__list {
    border-right: 0; border-bottom: 1px solid var(--background-modifier-border);
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .io-fields__item { width: auto; }
  .io-fields__item .io-chip { margin-left: 4px; }
  .io-kind { grid-template-columns: 60px minmax(0, 1fr) 24px; gap: 7px; }
}
@media (max-width: 780px) {
  .obsidian { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .io-tabs, .io-content { padding-left: 16px; padding-right: 16px; }
  .io-item { flex-wrap: wrap; }
  .io-item__control { width: 100%; justify-content: flex-start; }
  .io-dlg .io-select, .io-dlg .io-text { width: 100%; }
}
/* new in round three */
.io-bubble { color: var(--io-bubble-fg, var(--text-on-accent)); }

.io-tline { display: flex; align-items: center; padding: 2px 0; }
.io-branch--bar { border-left-color: var(--io-bar-color, var(--text-faint)); }

/* TagWheel: a panel only as wide as the field it belongs to */
.io-wheelrow { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }

/* the two auto-created commands, on a line of their own */
.io-cmdstrip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 2px 0 10px; padding: 7px 10px;
  background: var(--background-secondary); border-radius: var(--radius-m);
}
.io-cmdstrip__label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint);
}
.io-cmdstrip__key {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 3px;
  background: var(--background-primary); border: 1px solid var(--background-modifier-border); color: var(--text-normal);
}
.io-cmdstrip__note { font-size: var(--font-ui-smaller); color: var(--text-faint); }
.io-cmdstrip .io-see { padding: 0; margin-left: auto; }

/* values table: two color columns, and a tinted child row */
.io-vals__row--child { background: var(--background-primary-alt); }
.io-depthcell { display: flex; }

/* command reference as a real table */
.io-cmd__head {
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-cmd__name { font-size: var(--font-ui-small); color: var(--text-normal); }
.io-cmd__does { font-size: var(--font-ui-smaller); color: var(--text-muted); text-align: left; max-width: none; }

.io-sortable--off { opacity: 0.55; }
.io-sortrow .io-text { min-width: 0; }

/* round four */
.io-preview__cap { gap: 7px; }
.io-preview__rule { flex: 1; height: 1px; background: var(--background-modifier-border); }
.io-preview__cap::after { content: none; }

.io-lead {
  margin: 14px 0 2px; max-width: 66ch;
  font-size: var(--font-ui-small); color: var(--text-normal);
}

/* a destructive action should look destructive */
.io-danger {
  appearance: none; font-family: inherit; font-size: var(--font-ui-smaller);
  color: var(--background-modifier-error); background: transparent;
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  padding: 3px 9px; cursor: pointer;
}
.io-danger:hover { background: var(--background-modifier-error); border-color: transparent; color: #fff; }

.io-valtools { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
.io-depthcell { display: flex; justify-content: center; }

/* the values table, and its narrower shape for a link field */
.io-vals__inner { min-width: 600px; }
.io-vals--link .io-vals__head, .io-vals--link .io-vals__row {
  grid-template-columns: 14px minmax(0, 1fr) 62px minmax(0, 1fr) 44px;
}
.io-vals__inner--link { min-width: 380px; }

/* level bars: the text always clears the bars */
.io-branch--pad { padding-left: calc(var(--io-bar-thickness) + var(--io-bar-gap)); }

/* TagWheel: the panel sits with the field, inside the line */
.io-wheelchip { display: flex; justify-content: center; }
.io-bubble--current { box-shadow: 0 0 0 2px var(--interactive-accent); }
.io-line { align-items: center; }

/* commands table inside the fields editor */
.io-fields__detail .io-cmd { margin-bottom: 4px; }

/* round five */

/* a command, its key, and a way to set it */
.io-group__cmds { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 5px 0 2px; }
.io-group__cmdlabel {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint);
}
.io-cmdchip {
  appearance: none; display: inline-flex; align-items: stretch; gap: 0; padding: 0;
  border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s);
  background: var(--background-secondary); cursor: pointer; overflow: hidden;
  font-family: inherit;
}
.io-cmdchip:hover { border-color: var(--interactive-accent); }
.io-cmdchip__name {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; color: var(--text-normal);
}
.io-cmdchip__key {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px;
  background: var(--background-primary); color: var(--text-accent);
  border-left: 1px solid var(--background-modifier-border);
}
.io-cmdchip__key--none { color: var(--text-faint); font-family: var(--font-ui); }
.io-cmdchip:hover .io-cmdchip__key { color: var(--text-accent); }


/* the short name, folded into the title row */
.io-fields__shortlabel {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint); margin-left: 4px;
}
.io-text--short { width: 96px; }

/* command reference as one grid */
.io-cmd__inner { min-width: 560px; }
.io-cmd__head, .io-cmd__row {
  display: grid; grid-template-columns: minmax(150px, 0.9fr) minmax(180px, 1.3fr) 112px;
  gap: 12px; align-items: center; padding: 7px 12px;
}
.io-cmd__area { grid-column: 1 / -1; }

/* link fields keep only what a link can have */
.io-vals--link .io-vals__head, .io-vals--link .io-vals__row {
  grid-template-columns: 14px minmax(0, 1fr) 62px 44px;
}
.io-vals__inner--link { min-width: 320px; }

/* round six: one rule so an inline reference always reads as a reference,
   wherever it appears in the pane. Without this the markup was there and
   the chip was not. */
.io-content code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  color: var(--text-normal);
  white-space: nowrap;
}
.io-content b { font-weight: 600; color: var(--text-normal); }
.io-tip code { background: var(--background-primary); }
.io-callout code, .io-lead code { background: var(--background-primary); }

/* round seven */

/* the callout, now the lead for the tab */
.io-callout__head { display: flex; align-items: center; gap: 7px; color: var(--text-normal); font-weight: 500; }
.io-callout__body { margin: 6px 0 0; }
.io-callout .io-see { margin-top: 6px; }
.io-callout .io-tip { margin-left: 0; margin-right: 0; }

/* the structure diagram: line and labels share one grid, so they cannot drift */
.io-struct {
  display: inline-grid;
  grid-template-columns: repeat(6, auto);
  grid-template-rows: auto auto;
  align-items: center;
  column-gap: 5px;
  row-gap: 3px;
}
.io-struct__cell { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.io-struct__label { display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 0; }
.io-struct__bracket {
  height: 5px;
  border: 1px solid var(--background-modifier-border);
  border-top: 0;
  border-radius: 0 0 3px 3px;
}
.io-struct__name {
  font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); text-align: center; white-space: nowrap;
}


/* round eight */

/* the structure diagram: three rows, and separator captions taken out of
   the flow so a long word cannot widen a narrow column */
.io-struct { grid-template-rows: auto auto auto; row-gap: 2px; }
.io-struct__block { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.io-struct__tick {
  width: 1px; height: 9px; margin: 0 auto;
  background: var(--background-modifier-border);
}
/* the caption is centred on its column and taken out of the flow, so its
   width never pushes the separator column wider */
.io-struct__sepname { position: relative; height: 11px; }
.io-struct__sepname > span {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); white-space: nowrap;
}

/* level bars: one border plus one gap per level, always, so the text never
   moves when Number of bars changes */

/* TagWheel: neutralise the stale absolute rules, then place the panel
   over a zero-width slot so it is centred and cannot widen the line */

/* the only .io-wheelval rule */
.io-wheelval {
  font-size: 11px; text-align: center; padding: 2px 8px; border-radius: 20px;
  color: var(--io-wheel-fg, var(--text-muted)); white-space: nowrap;
}

/* the one grid definition for the values table */
.io-vals__head, .io-vals__row {
  display: grid; gap: 8px; align-items: center; padding: 6px 10px;
  grid-template-columns: 14px 26px minmax(0, 1fr) 62px 104px 30px 30px 78px 44px;
}

/* round nine */

/* a bar takes no space at all, so the text cannot move when bars change */
.io-kids {
  display: flex; flex-direction: column;
  padding-left: calc(var(--io-bar-thickness) + var(--io-bar-gap));
}

/* the scroller hangs off the chip; the room it needs is reserved on the box */
.io-wheelcol { position: relative; display: inline-flex; align-items: center; }
.io-wheelpanel {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 3;
  width: max-content;
  display: flex; flex-direction: column; gap: 2px;
  padding: 4px 6px; border-radius: var(--radius-m);
  background: var(--io-wheel-bg, var(--background-primary));
  border: 1px solid var(--background-modifier-border);
  box-shadow: 0 4px 14px rgba(20, 17, 32, 0.16);
}
.io-wheelpanel--up { bottom: calc(100% + 5px); }
.io-wheelpanel--down { top: calc(100% + 5px); }
/* the room the panels need belongs to the stage, not to the box: a tip
   opening under the caption then has nothing to collide with */
.io-wheelstage {
  padding-top: var(--io-wheel-up, 0px);
  padding-bottom: var(--io-wheel-down, 0px);
}
.io-wheelctl { margin-top: 14px; }

/* the field-to-property table */
.io-map__inner { min-width: 520px; }
.io-map__head {
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-map__row + .io-map__row { border-top: 1px solid var(--background-modifier-border); }
.io-map__field { display: flex; align-items: center; gap: 7px; font-size: var(--font-ui-small); color: var(--text-normal); }
.io-map__example { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.io-map__row .io-select { min-width: 0; width: 100%; }
.io-map__foot { padding: 8px 12px; border-top: 1px solid var(--background-modifier-border); }
.io-map__foot .io-note { margin: 0; }

/* what the transform would write */
.io-yaml {
  margin-top: 10px; border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m); overflow: hidden; background: var(--background-secondary);
}
.io-yaml__cap {
  padding: 6px 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint); border-bottom: 1px solid var(--background-modifier-border);
}
.io-yaml__body { padding: 8px 12px; }
.io-yaml__line { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65; color: var(--text-normal); }
.io-yaml__fence { color: var(--text-faint); }
.io-yaml__empty { color: var(--text-faint); font-style: italic; font-family: var(--font-ui); }

/* the only .io-wheelctl rule */
.io-wheelctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }

/* round ten */

/* Bars live in a gutter to the left of every line. Three lanes are always
   reserved, so Number of bars changes what is drawn and never the layout.
   Lane 0 is nearest the text, lane 2 furthest left. */
.io-tree { --io-lane-count: 3; padding-left: 3px; }
.io-node { position: relative; display: flex; flex-direction: column; border-left: 0; }
.io-node--bar::before {
  content: ""; position: absolute; top: 0; bottom: 0;
  left: calc(var(--io-lane, 0) * var(--io-bar-gap));
  width: var(--io-bar-thickness); border-radius: 2px;
  background: var(--io-bar-color, var(--text-faint));
}
.io-tree .io-line {
  padding-left: calc(
    (var(--io-lane-count) - 1) * var(--io-bar-gap)
    + var(--io-bar-thickness)
    + var(--io-bar-distance)
    + var(--io-depth, 0) * 20px);
}

/* the property picker */
.io-pick2 { position: relative; min-width: 0; }
.io-pick2__list {
  display: none; position: absolute; left: 0; top: calc(100% + 3px); z-index: 6;
  min-width: 168px; max-height: 176px; overflow-y: auto;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: 0 8px 22px rgba(20, 17, 32, 0.2);
  padding: 3px;
}
.io-pick2__list--open { display: block; }
.io-pick2__opt {
  appearance: none; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 0; background: transparent; cursor: pointer; text-align: left;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-normal);
  padding: 4px 7px; border-radius: var(--radius-s);
}
.io-pick2__opt:hover { background: var(--background-modifier-hover); color: var(--text-accent); }
.io-pick2__type {
  font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint);
}

/* the mapping table grew a column */
.io-map__head, .io-map__row {
  display: grid; gap: 10px; align-items: center; padding: 7px 12px;
  grid-template-columns: minmax(110px, 0.9fr) minmax(104px, 0.9fr) 96px 132px minmax(120px, 1fr);
}

/* the floating button */
.io-floatrow {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 7px; border-radius: var(--radius-s);
  background: var(--background-modifier-hover);
}
.io-float {
  appearance: none; flex: 0 0 auto; cursor: pointer;
  font-family: inherit; font-size: 11px;
  padding: 3px 9px; border-radius: 20px;
  background: var(--interactive-accent); border: 1px solid transparent; color: var(--text-on-accent);
  box-shadow: 0 2px 8px rgba(20, 17, 32, 0.2);
}
.io-float:hover { background: var(--interactive-accent-hover); }

/* a column header that can explain itself */
.io-map__th { display: flex; align-items: center; gap: 5px; min-width: 0; }
.io-map__th .io-help { flex: 0 0 auto; }
.io-map__head .io-tip { grid-column: 1 / -1; text-transform: none; letter-spacing: 0; font-weight: 400; }

/* the drag handle, and what a row looks like while it moves */
.io-grip { cursor: grab; }
.io-grip:active { cursor: grabbing; }
.io-dragging { opacity: 0.45; }
.io-dragover { box-shadow: inset 0 2px 0 var(--interactive-accent); }

/* the fields list, split at the line your text sits on */
.io-side { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px; border-radius: var(--radius-s); }
.io-side--over { background: var(--background-modifier-hover); box-shadow: inset 0 0 0 1px var(--interactive-accent); }
.io-side__cap { display: flex; flex-direction: column; padding: 2px 8px 4px; }
.io-side__label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
}
.io-side__hint { font-size: 10.5px; color: var(--text-faint); }
.io-side__empty { font-size: 11px; color: var(--text-faint); font-style: italic; padding: 3px 8px 5px; }
.io-side__rule {
  height: 0; margin: 5px 6px;
  border-top: 2px dashed var(--interactive-accent);
  opacity: 0.65;
}
.io-fields__name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.io-fields__tools {
  display: inline-flex; gap: 0; flex: 0 0 auto;
  width: 46px; justify-content: flex-end;
  opacity: 0; transition: opacity 90ms ease-out;
}
.io-fields__item:hover .io-fields__tools,
.io-fields__item:focus-within .io-fields__tools,
.io-fields__item[aria-current="true"] .io-fields__tools { opacity: 1; }
.io-fields__tools .io-icon { width: 21px; height: 21px; font-size: 11px; }
.io-fields__item .io-chip { margin-left: 4px; }
.io-fields__item[aria-current="true"] .io-chip { margin-left: 4px; }

/* two columns, each with its own head, so the panes read as a pair */
.io-fields__col { min-width: 0; display: flex; flex-direction: column; }
.io-fields__col + .io-fields__col { border-left: 1px solid var(--background-modifier-border); }
.io-fields__colhead {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-faint); background: var(--background-primary-alt);
  border-bottom: 1px solid var(--background-modifier-border);
}
.io-fields__colhead .io-tip { text-transform: none; letter-spacing: 0; font-weight: 400; }
.io-fields__col:first-child .io-fields__colhead { background: var(--background-secondary); }
</style>

/* ============================================================ TAGS & PKM */
{
  id: "fields", tab: "pkm", order: 100, heading: "Fields",
  intro: "A Field is one slot a line can hold: a tag, a link to another note, or an element such as a date. Set out the slots you want, the Values each one offers, and where on the line they go",
  tip: "A <b>Field</b> is one slot on a line. There are three kinds of Field: <b>tag</b>, <b>link</b> (wikilink), and <b>emoji-element</b> — such as a date or a time. Each Field automatically gets two <b>cycle commands</b>, <code>next</code> and <code>previous</code>, which insert the Value and cycle it back or forth — it is worth a hotkey for the ones you use often, so a <code>#todo</code> tag is one keypress away. <b>TagWheel</b> opens all of your Fields over the line at once, so you can pick with the arrow keys instead of remembering which key does what",
  items: [
    { kind:"custom", id:"line-preview", render: renderLinePreview },
    { kind:"custom", id:"field-editor", render: renderFieldEditor }
  ]
},
{
  id: "line-format", tab: "pkm", order: 200, heading: "Separators",
  intro: "Two markers of your choosing carve out the middle of a line. Whatever you write goes between them; the Fields sit outside. Which Fields land on which side is set under <code>Fields</code>, by dragging one across the line",
  tip: "Choose these carefully and then leave them alone. Lines you have already written keep their old Separator, so changing it later means the plugin no longer recognises them. Use two or more characters that Markdown does not already claim: <code>||</code> and <code>::</code> are good, <code>==</code> is not, because Obsidian reads it as a highlight",
  items: [
    { kind:"text", id:"separator-1", path:"pkm.lineFormat.separator1", default:"||", mono:true,
      name:"First Separator", desc:"Goes between the tags at the front and the start of your sentence",
      tip:"Pick something you would never type on purpose in a sentence. Two pipe characters are the default for exactly that reason \u2014 nobody writes them by accident" },
    { kind:"text", id:"separator-2", path:"pkm.lineFormat.separator2", default:"||", mono:true,
      name:"Second Separator", desc:"Goes at the end of your sentence, before the dates and links",
      tip:"It can be exactly the same as the first one. Which is which is decided by where it sits on the line, not by what it looks like" }
  ]
},
{
  id: "writing-rules", tab: "pkm", order: 300, heading: "Writing rules",
  intro: "The small habits: how a tag is written when it has a Value underneath it, what is left when you clear a line, and where the cursor waits for you afterwards",

      options:[ {value:"separate",label:"Separate tags (#doing #review)"},
                {value:"combined",label:"One tag (#doing/review)"} ],
      tip:"Say <code>doing</code> has <code>review</code> under it. Two separate tags give you <code>#doing #review</code>, and searching for <code>#doing</code> finds the line. One combined tag gives <code>#doing/review</code>, which keeps the pair together in Obsidian\u2019s tag list but means a search for the parent needs a slash. Every preview on the Visual tab follows whichever you pick",
      seeAlso:{ id:"tag-preview", label:"See it in the tag appearance preview" } },
    { kind:"dropdown", id:"cycle-end-behavior", path:"pkm.behavior.cycleEndBehavior", default:"keep-bullet",
      name:"When a line empties out", desc:"What is left behind when cycling removes the last Value",
      searchTerms:["Line Prefix after end of cycle"],
      options:[ {value:"keep-bullet",label:"Keep the list bullet"}, {value:"clear-prefix",label:"Clear the line"} ],

    { kind:"dropdown", id:"cursor-policy", path:"pkm.behavior.cursorPolicy", default:"text_end",
