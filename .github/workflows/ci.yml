name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Settings layer gates
        run: npm run gate

      # Прототип нормативен (PRD Р8), поэтому расхождение с ним ловится
      # здесь же: гейты схемы, дымовой рендер, проверки по выводу и
      # перегенерация раздела 9 с Приложением B без diff (Г24).
      - name: Prototype gates
        run: npm run gate:prototype

      # **Седьмой шаг — браузер, и он снова здесь.**
      #
      # История короткая. 2026-09-11 шаг был поставлен и уронил CI, оставаясь
      # зелёным у меня (У-78). Причина, записанная тогда, — «гейт меряет
      # вертикаль, а она зависит от шрифтов» — оказалась неверной, и два дня
      # ушло на перебор окружения: восемь семейств шрифтов, семнадцать ширин
      # ящика, везде зелено.
      #
      # Назвал причину журнал того самого прогона, а не перебор (У-176):
      # признак дефекта был написан через величину, принадлежащую машине —
      # «подложка дошла до правого края содержимого». Законная подложка растёт
      # наружу за конец написанного на 8.8 точки, и на строке, где написанное
      # кончается ближе девяти точек к краю, она края достигает. На Linux
      # моноширинный шрифт шире, написанное кончалось в десяти точках от края —
      # шаг падал на здоровой странице. У себя это воспроизводится при
      # IO_GATE_WIDTH=472: окно шириной семь точек, в которое перебор не попал.
      #
      # Признак переписан: подложка перенесённой строки выходит за написанное
      # не дальше, чем подложки строк без переноса — эталон с той же страницы,
      # снятый там, где дефекта быть не может. Величины машины в вопросе
      # больше нет.
      #
      # `continue-on-error` не ставится нарочно: тихо жёлтый шаг — это шаг,
      # которого нет (A15).
      - name: Browser gate
        run: |
          npx playwright install --with-deps chromium
          npm run gate:browser

      - name: Build
        run: npm run build

      - name: Bundle sanity
        run: node --check dist/main.js
