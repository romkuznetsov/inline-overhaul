name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Settings layer gates
        run: npm run gate

      # Прототип нормативен (PRD Р8), поэтому расхождение с ним ловится
      # здесь же: гейты схемы, дымовой рендер, проверки по выводу и
      # перегенерация раздела 9 с Приложением B без diff (Г24).
      - name: Prototype gates
        run: npm run gate:prototype

      # Седьмой шаг — браузер — здесь **пока не стоит**, и это не отказ от
      # решения заказчика 2026-09-11, а его цена, найденная первым же прогоном.
      #
      # Шаг был добавлен в тот же день и уронил CI, оставаясь зелёным у меня.
      # Это ровно У-78: «зелёный у меня» и «зелёный у всех» — разные
      # утверждения, и здесь их развёл сервер, а не рассуждение.
      #
      # Причина, записанная тогда здесь же («гейт меряет вертикаль, а она
      # зависит от шрифтов: 24 против 19»), НЕВЕРНА и снята 2026-09-11 вечером:
      # по журналу того самого прогона эти числа совпадают с моими до точки.
      # Упало одно утверждение — про подложку у правого края содержимого, — и
      # оно очищено от машины: нарушением считается только подложка там, где
      # написанное на её зрительной строке до края не дошло.
      #
      # Воспроизвести падение у себя не вышло (восемь семейств шрифтов,
      # семнадцать ширин ящика — везде зелено, и на старой проверке тоже),
      # поэтому шаг сюда не возвращается: вернуть его на неподтверждённой
      # причине значило бы повторить ту же ошибку. К падению приложены числа,
      # чтобы следующий прогон назвал предмет. Строка Т5 в
      # docs/REMAINING_WORK.md; до неё шаг гоняется руками.
      - name: Build
        run: npm run build

      - name: Bundle sanity
        run: node --check dist/main.js
