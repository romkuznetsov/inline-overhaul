function renderLeftRightOrder(host) {
  const pair = el("div", "io-orderpair", host);
  /*
   * Подсказка у обеих подписей (заказ заказчика 2026-09-08). Тело
   * раскрывается ПОД парой, а не внутри колонки: колонка тут от 268 точек, и
   * прозе в ней тесно — та же беда, что была у подсказок шириной с имя
   * настройки (У-105).
   */
  const CAPTIP = {
    "Move left": "What the key does depends on the line, and the list is read top down: the first line that matches wins. This is a description of the command, not a setting — each of the three jobs is switched on and off by its own row further down",
    "Move right": "The mirror of <code>Move left</code>, read the same way. Whether the last line applies at all is decided by <code>Cycle in both directions</code> below: switch it off and <code>Move right</code> only ever changes the indent"
  };
  const capTips = el("div", "io-tabletipslot", host);
  [
    ["Move left", [
      ["part of a line is selected", "move that text"],
      ["the line is indented", "remove one indent level"],
      ["no indent", "cycle the prefix backwards"]
    ]],
    ["Move right", [
      ["part of a line is selected", "move that text"],
      ["the line is indented", "add one indent level"],
      ["anything else", "cycle the prefix forwards"]
    ]]
  ].forEach(([cmd, steps]) => {
    const col = el("div", null, pair);
    const cap = el("div", "io-ordercol__caprow", col);
    el("code", "io-ordercol__cap", cap, cmd);
    attachTip(cap, CAPTIP[cmd], cmd, capTips, capTips);
    const list = el("ol", "io-order", col);
    steps.forEach(([when, then]) => {
      const li = el("li", null, list);
      el("b", null, li, when);
      li.appendChild(document.createTextNode(" → "));
      el("span", "io-order__then", li, then);
    });
  });
}

/* ============================================================ Fields editor */

/* Контраст пары «фон значения — цвет текста» по WCAG 2.1. Своя функция,
   потому что зависимостей у слоя настроек нет. */
function relLum(hex) {
  const v = String(hex || "").replace("#", "");
  const p = v.length === 3 ? v.split("").map(c => c + c) : [v.slice(0, 2), v.slice(2, 4), v.slice(4, 6)];
  const lin = p.map(h => {
    const c = parseInt(h, 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
}
function contrastRatio(bg, fg) {
  const a = relLum(bg), b = relLum(fg);
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return (hi + 0.05) / (lo + 0.05);
}
/* Предупреждение, не запрет: последнее слово за человеком. */
function contrastNote(row, v) {
  if (v.shown === "nothing") return;
  /* Цвет из темы посчитать нечем, и пугать человека значком из-за этого
     нельзя: у Value без своего цвета претензий нет. */
  if (!v.color || !v.textColor) return;
  const r = contrastRatio(v.color, v.textColor);
  if (r >= 3) return;
  const w = el("span", "io-warn", row, "⚠");
  /* Одна подсказка на узел, один и тот же текст в обоих атрибутах. */
  const note = "This Value may be hard to read: contrast " + r.toFixed(1) +
    ":1, aim for 3:1 or more";
  w.setAttribute("aria-label", note);
  w.title = note;
}

/* A field and the child field that belongs to it move as one block: the
   child takes its side from the parent, so it can never end up on the
   opposite side of the line. */
function fieldBlock(f) {
  const out = [f];
  FIELDS.forEach(x => { if (x.parent === f.id) out.push(x); });
  return out;
}
function blockOwner(f) { return f.parent ? (field(f.parent) || f) : f; }

function setFieldSide(f, side) {
  const owner = blockOwner(f);
  fieldBlock(owner).forEach(x => { x.position = side; });
  refreshPreviews();
  renderContent();
}

/* Put the dragged block immediately before the field it was dropped on,
   and adopt that field's side. */
function moveFieldBefore(dragged, target) {
  const owner = blockOwner(dragged);
  if (!owner || owner === blockOwner(target)) return;
  const block = fieldBlock(owner);
  const side = blockOwner(target).position;
  block.forEach(x => { x.position = side; });
  block.forEach(x => { const i = FIELDS.indexOf(x); if (i >= 0) FIELDS.splice(i, 1); });
  const at = Math.max(0, FIELDS.indexOf(target));
  FIELDS.splice(at, 0, ...block);
  refreshPreviews();
  renderContent();
}
function moveFieldToSideEnd(dragged, side) {
  const owner = blockOwner(dragged);
  if (!owner) return;
  const block = fieldBlock(owner);
  block.forEach(x => { x.position = side; });
  block.forEach(x => { const i = FIELDS.indexOf(x); if (i >= 0) FIELDS.splice(i, 1); });
  FIELDS.push(...block);
  refreshPreviews();
  renderContent();
}

/* Стрелка на краю стороны переносит Field через линию: иначе с клавиатуры
   сторону не сменить, а тянуть мышью — единственный путь, чего быть не должно. */
function stepField(f, dir) {
  const owner = blockOwner(f);
  const side = owner.position;
  const peers = FIELDS.filter(x => !x.parent && x.position === side);
  const i = peers.indexOf(owner);
  const target = peers[i + dir];
  if (target) {
    if (dir < 0) moveFieldBefore(owner, target);
    else if (peers[i + 2]) moveFieldBefore(owner, peers[i + 2]);
    else moveFieldToSideEnd(owner, side);
    return;
  }
  /* Край стороны: уходим через линию. Left Block нарисован выше Right, и
     стрелка обязана этому подчиняться: вниз с низа Left попадаешь в начало
     Right, вверх с верха Right — в конец Left. */
  const other = side === "Left" ? "Right" : "Left";
  const there = FIELDS.filter(x => !x.parent && x.position === other);
  if (dir > 0 && there[0]) moveFieldBefore(owner, there[0]);
  else moveFieldToSideEnd(owner, other);
}

function renderFieldList(list) {
  let dragged = null;

  const side = (value, label, hint, about) => {
    const sec = el("div", "io-side", list);
    const cap = el("div", "io-side__cap", sec);
    const name = el("span", "io-side__label", cap, label);
    /* Одна подсказка на узел, и только `aria-label`: Obsidian рисует его
       своей подсказкой (У-21). Знака «?» тут нет по причине, выписанной у
       подсказки шапки колонки. */
    name.setAttribute("aria-label", about);
    if (hint) el("span", "io-side__hint", cap, hint);

    sec.addEventListener("dragover", e => { e.preventDefault(); sec.classList.add("io-side--over"); });
    sec.addEventListener("dragleave", () => sec.classList.remove("io-side--over"));
    sec.addEventListener("drop", e => {
      e.preventDefault();
      sec.classList.remove("io-side--over");
      if (dragged) moveFieldToSideEnd(dragged, value);
    });

    const rows = FIELDS.filter(f => f.position === value);

    /* Подпись стороны — место «перед первой строкой» (замечание заказчика
       2026-09-12: выше первой строки лежит только подпись, своего броска у
       неё не было, и поле уезжало в конец). Подсветка своя: черта под
       подписью, ровно там, куда поле встанет. */
    cap.addEventListener("dragover", e => {
      e.preventDefault(); e.stopPropagation();
      cap.classList.add("io-side__cap--over");
    });
    cap.addEventListener("dragleave", () => cap.classList.remove("io-side__cap--over"));
    cap.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      cap.classList.remove("io-side__cap--over");
      if (!dragged) return;
      const first = rows[0] ? (rows[0].parent ? field(rows[0].parent) : rows[0]) : null;
      if (first && first.id === dragged.id) return;
      if (first) moveFieldBefore(dragged, first);
      else moveFieldToSideEnd(dragged, value);
    });

    if (!rows.length) el("div", "io-side__empty", sec, "nothing on this side");

    rows.forEach(f => {
      const b = el("div", "io-fields__item" + (f.parent ? " io-fields__item--child" : ""), sec);
      const current = f.id === selectedFieldId;
      b.setAttribute("aria-current", current ? "true" : "false");

      const grip = el("span", "io-grip", b, "⠿");
      grip.draggable = true;
      grip.setAttribute("role", "button");
      /* Одна подсказка на узел, и текст у неё один: Obsidian рисует
         `aria-label` своей подсказкой, а браузер поверх — `title`. */
      const gripLabel = f.parent
        ? "Drag " + f.name + " — it moves with " + field(f.parent).name
        : "Drag " + f.name + " to reorder it, or across the line to change side";
      grip.setAttribute("aria-label", gripLabel);
      grip.title = gripLabel;
      grip.addEventListener("dragstart", e => {
        dragged = f;
        b.classList.add("io-dragging");
        try { e.dataTransfer.setData("text/plain", f.id); } catch (_) {}
      });
      grip.addEventListener("dragend", () => { b.classList.remove("io-dragging"); dragged = null; });

      b.addEventListener("dragover", e => { e.preventDefault(); e.stopPropagation(); b.classList.add("io-dragover"); });
      b.addEventListener("dragleave", () => b.classList.remove("io-dragover"));
      b.addEventListener("drop", e => {
        e.preventDefault(); e.stopPropagation();
        b.classList.remove("io-dragover");
        if (dragged) moveFieldBefore(dragged, f);
      });

      /* выбор — кнопка внутри ряда, а не сам ряд: рядом стоят ещё две кнопки */
      const pick = el("button", "io-fields__pick", b);
      pick.type = "button";
      el("span", "io-fields__name", pick, f.name);
      { const c = el("span", "io-chip io-chip--typed", pick, TYPE_LABEL[f.type]); cssVar(c, "--io-chip-bg", TYPE_COLOR[f.type]); cssVar(c, "--io-chip-fg", typeInk(f.type)); }
      pick.addEventListener("click", () => { selectedFieldId = f.id; renderContent(); });

      /* Дочерний Field ходит за родителем, своих стрелок у него нет */
      const tools = el("span", "io-fields__tools", b);
      if (!f.parent) {
        const up = iconBtn(tools, "↑", "Move " + f.name + " up, and across the line at the top");
        up.addEventListener("click", ev => { ev.stopPropagation(); stepField(f, -1); });
        const down = iconBtn(tools, "↓", "Move " + f.name + " down, and across the line at the bottom");
        down.addEventListener("click", ev => { ev.stopPropagation(); stepField(f, 1); });
      }
    });
    return sec;
  };

  side("Left", "Left Block", "", "Everything in Left Block is written before your text on the line");
  el("div", "io-side__rule", list);
  side("Right", "Right Block", "", "Everything in Right Block is written after your text on the line");

  const addWrap = el("div", "io-fields__add", list);
  /* Акцентная кнопка: заказчик просил, чтобы добавление было видно
     (замечание 2026-08-27, отменяет прежнее «нейтральная» из Ф5). */
  const add = el("button", "io-btn io-btn--sm io-btn--cta", addWrap, "Add Field");
  add.type = "button";
  /* Имя и тип спрашиваются окном: тип после создания не меняется, а угадать
     его за человека нельзя (решение заказчика 2026-08-27). */
  add.addEventListener("click", () => {
    dialog = { addField: true, name: "", type: "tag" };
    renderContent();
  });
}

/*
 * Полоса прокрутки показывается двумя поводами — его слово: «сам скроллер
 * отображается только во время скроллинга либо при наведении мышки на правую
 * часть правого столбца values». Поводы независимы, поэтому их два флага, а
 * не один: уехавшая мышь не имеет права погасить полосу, пока идёт прокрутка.
 */
const SCROLLER_ZONE_PX = 28;
const SCROLLER_FADE_MS = 900;

function revealScrollerOnDemand(wrap) {
  let scrolling = false, near = false, timer = 0;
  const sync = () => { wrap.classList.toggle("io-fields--scrollon", scrolling || near); };
  const onScroll = () => {
    scrolling = true; sync();
    clearTimeout(timer);
    timer = setTimeout(() => { scrolling = false; sync(); }, SCROLLER_FADE_MS);
  };
  const onMove = e => {
    const r = wrap.getBoundingClientRect();
    const next = e.clientX >= r.right - SCROLLER_ZONE_PX;
    if (next === near) return;
    near = next; sync();
  };
  const onLeave = () => { if (near) { near = false; sync(); } };
  wrap.addEventListener("scroll", onScroll);
  wrap.addEventListener("mousemove", onMove);
  wrap.addEventListener("mouseleave", onLeave);
}

function renderFieldEditor(host) {
  const wrap = el("div", "io-fields" + (fieldsTableFixed ? " io-fields--fixed" : ""), host);
  subPaints = [];

  const f = field(selectedFieldId) || FIELDS[0];

  /*
   * Обе шапки — в одной строке сетки, подсказки под ними во всю ширину
   * (решение заказчика по В-92, 2026-09-08). До этого подсказка шапки списка
   * раскрывалась внутри колонки шириной 188 точек, и её тело вставало
   * столбиком по два-три слова — тот самый дефект со скриншота (У-105).
   * Теперь `Left Block` и `Right Block` объясняются в подсказке шириной со
   * весь редактор, а знак «?» остаётся у обеих шапок.
   */
  const listHead = el("div", "io-fields__colhead", wrap);
  el("span", null, listHead, "Fields");
  const detailHead = el("div", "io-fields__colhead io-fields__colhead--detail", wrap);
  /* Шапка правой колонки одна на все типы Field — его слово 2026-09-13:
     «при field=emoji в шапке стоит emoji — сделай, чтобы у всех был хедер
     Values». Шапка называет колонку, а не содержимое, и от смены Field в
     списке её имя прыгать не должно; тип Field стоит чипом рядом с именем. */
  el("span", null, detailHead, "Values");

  attachTip(listHead, "The two halves are the Blocks of a line: everything in <b>Left Block</b> is written before your text, everything in <b>Right Block</b> after it. Drag a Field across the line to change which Block it is written in, or step it with the arrows on the right — at the edge of a Block they cross the line too",
    "the Fields list", null, detailHead);
  /* «?» у шапки правой колонки: у левой он был, у правой нет, и заказчик
     заметил именно эту разницу (замечание 1.4.1.2.1). */
  attachTip(detailHead, "Everything about the Field picked on the left. Its name in tagWheel, the Values it offers, how it behaves on a line, and which note property it goes into. Nothing here touches the other Fields \u2014 pick another one on the left and the whole column changes",
    "this column", null, detailHead);

  /*
   * \u041f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0430\u0442\u0435\u043b\u044c \u0432\u044b\u0441\u043e\u0442\u044b \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u043c \u0432 \u0448\u0430\u043f\u043a\u0435, \u043f\u043e\u0441\u043b\u0435 \u0437\u043d\u0430\u043a\u0430 \u00ab?\u00bb: \u043e\u043d \u043f\u0440\u0438\u0436\u0430\u0442 \u043a
   * \u043f\u0440\u0430\u0432\u043e\u043c\u0443 \u043a\u0440\u0430\u044e `margin-left: auto`, \u0438 \u0441\u0442\u043e\u044f\u0449\u0435\u0435 \u043f\u043e\u0441\u043b\u0435 \u043d\u0435\u0433\u043e \u0443\u0435\u0445\u0430\u043b\u043e \u0431\u044b \u043f\u0440\u0430\u0432\u0435\u0435
   * \u043d\u0435\u0433\u043e \u0441\u0430\u043c\u043e\u0433\u043e.
   */
  const height = iconBtn(detailHead, fieldsTableFixed ? "\u25b8" : "\u25be",
    fieldsTableFixed
      ? "Expand the Fields table to its full height"
      : "Collapse the Fields table to a fixed height");
  height.classList.add("io-fields__height");
  height.setAttribute("aria-pressed", fieldsTableFixed ? "true" : "false");
  height.addEventListener("click", () => {
    fieldsTableFixed = !fieldsTableFixed;
    renderContent();
  });

  if (fieldsTableFixed) revealScrollerOnDemand(wrap);

  const list = el("div", "io-fields__list", wrap);
  renderFieldList(list);

  const detail = el("div", "io-fields__detail", wrap);

  /*
   * The title row carries the identity of the Field and nothing else: name,
   * type and remove. The short name used to sit here too, and the row read as
   * a jumble of unrelated things (customer, round six) — it is a row of its
   * own now, right below.
   */
  const title = el("div", "io-fields__title", detail);
  /* The system name is set once, in the Add Field dialog, and shown here as
     a heading. It sits in the names of the commands and in the file the plugin
     generates for itself, so changing it later would leave both pointing at a
     name that is gone. */
  el("h4", null, title, f.strict || f.name);
  { const c = el("span", "io-chip io-chip--typed", title, TYPE_LABEL[f.type]); cssVar(c, "--io-chip-bg", TYPE_COLOR[f.type]); cssVar(c, "--io-chip-fg", typeInk(f.type)); }
  /*
   * Удаление — белая корзина на красном (замечание заказчика 2026-08-27): оно
   * должно бросаться в глаза, а не притворяться обычной кнопкой. Значок лежит
   * своим узлом и обесцвечивается в белый фильтром: цветной эмодзи на красной
   * заливке читается грязным пятном, а слова `Delete` рядом с ним не нужно —
   * корзина говорит сама.
   */
  /* Карандаш слева от корзины: системное имя можно переименовать, и окно
     называет цену — старый тег остаётся в заметках, хоткей отвязывается
     (замечание заказчика 1.4.1.2.2, решение 2026-08-31). */
  const pencil = iconBtn(title, "✎", "Rename the Field " + f.name);
  pencil.addEventListener("click", () => {
    dialog = { rename: f.strict };
    renderContent();
  });

  const del = el("button", "io-danger", title);
  el("span", "io-danger__icon", del);
  del.type = "button";
  /* Одна подсказка на узел: `aria-label` Obsidian показывает сам. */
  del.setAttribute("aria-label", "Delete the Field " + f.name);
  del.title = "Delete the Field " + f.name;

  /*
   * Имя в tagWheel — своя строка сразу под шапкой (замечание заказчика,
   * шестой круг). Она про то, как Field назван, а не про то, как он себя
   * ведёт, поэтому стоит до заголовка `Behavior`, а не внутри него.
   */
  nameInWheelRow(detail, f);

  /* Что Field пишет в строку — раньше того, как он себя ведёт: заказчик
     просил поднять `Values` под `Name in tagWheel`, над `Behavior`, и для
     всех типов Field сразу (замечание 1.4.1.2.4). У `element` значение
     одно, и на этом месте стоит его блок. */
  if (f.type === "element") {
    elementRows(detail, f);
  } else {
    const vh = el("div", "io-sub io-item__namerow", detail);
    foldableSub(vh, "values", "Values", subPaints);
    el("span", null, vh, "Values");
    attachTipItem(vh, detail, { name:"Values",
      tip:"The <code>next</code> and <code>previous</code> commands walk this list in order. A child Value follows its parent: it sits in the same Block and takes the parent’s <code>Behavior</code>, and what those are allowed to change is set under <code>Placement modes</code> on this tab" });
    subComment(vh, detail, "values/header");
    valuesTable(detail, f);
  }

  /* Заголовок раздела — `Behavior`: под ним `Active`, `Prefix behavior` и
     `Child Field` (замечание заказчика 2026-08-27). «?» у него появился по
     замечанию 1.4.1.2.5: заголовок был единственным без объяснения. */
  const bh = el("div", "io-sub io-item__namerow", detail);
  foldableSub(bh, "behavior", "Behavior", subPaints);
  el("span", null, bh, "Behavior");
  attachTipItem(bh, detail, { name:"Behavior", tip:"Three things about how this Field acts, and none about what it writes. <b>Active</b> turns its commands on and off without deleting the Field. <b>Prefix behavior</b> decides whether a Value may change the marker at the start of the line \u2014 a checkbox, for instance. <b>Child Field</b> ties this Field to another one, so it comes into play only once that one is on the line" });
  placementRows(detail, f);
  propertyRow(detail, f);

  /* Таблица команд Field (Ф11) остаётся целью, но в панель она приезжает
     только в фазе 5: её смысл в колонке `Hotkey`, а та держится на реестре
     действий (5.6) и на именах команд после переименования фазы 2. Решение
     заказчика 2026-08-27, подтверждено им же 2026-08-27 после показа. */
  const ch = el("div", "io-sub io-item__namerow", detail);
  foldableSub(ch, "commands", "Commands", subPaints);
  el("span", null, ch, "Commands");
  const cmdCard = el("div", "io-cmd", detail);
  const cmdCols = "minmax(120px,0.8fr) minmax(140px,1.2fr) 132px";
  const cmdHead = el("div", "io-cmd__head", cmdCard);
  cmdHead.style.setProperty("grid-template-columns", cmdCols);
  ["Command", "Description", "Hotkey"].forEach(t => el("div", null, cmdHead, t));
  subComment(cmdHead, detail, "field-editor/commands");
  [
    [f.name + " next",     "Step to the next Value, or insert the Field if the line has none"],
    [f.name + " previous", "Step back to the previous Value"]
  ].forEach(([name, does]) => {
    const row = el("div", "io-cmd__row", cmdCard);
    row.style.setProperty("grid-template-columns", cmdCols);
    el("div", "io-cmd__name", row, name);
    el("div", "io-cmd__does", row, does);
    hotkeyCell(el("div", null, row), name);
  });

  /* Разделы дорисованы — знаки могут посчитать, что им прятать (`З-34`). */
  for (const paint of subPaints) paint();
  subPaints = [];
}


function valuesTable(host, f) {
  const isLink = f.type === "link";
  const box = el("div", "io-vals" + (isLink ? " io-vals--link" : ""), host);
  const scroll = el("div", "io-scroll", box);
  const inner = el("div", "io-vals__inner" + (isLink ? " io-vals__inner--link" : ""), scroll);

  const head = el("div", "io-vals__head", inner);
  /*
   * Подсказка есть у КАЖДОЙ подписанной колонки — заказ заказчика 2026-09-08:
   * «добавь tip ко всем элементам, у которых еще нет, чтобы было
   * универсально (например, fill, text, preview и т.д.)».
   *
   * До того у `Fill`, `Text` и `Preview` подсказки не было, и объяснялось это
   * тем, что «у них подпись и есть объяснение». Довод оказался неверным ровно
   * там, где подпись короче смысла: `Text` — это цвет надписи, а не текст
   * значения, а `Preview` умеет показать предупреждение о контрасте, о котором
   * по одному слову не догадаться.
   *
   * Знак «?» стоит ПОД текстом заголовка, а не справа: справа он наезжал на
   * соседнюю ячейку — колонки узкие (замечание заказчика 2026-08-27).
   */
  const COLTIP = {
    Level: "change Value to be parent or child by pressing arrows. Child Values are only active when Parent Value is present",
    Value: isLink
      ? "The link this Value writes. It may be written as <code>[[link]]</code> or as <code>link</code> — both are read the same way"
      : "The text of the Value. A tag may be written with <code>#</code> or without it — both are read the same way",
    Prefix: "The checkbox this Value puts in front of the line, such as <code>[ ]</code> or <code>[x]</code>. Empty leaves the usual list marker",
    Show: "How the Value looks in the line: <b>default</b> prints the Value, <b>empty</b> prints its color and nothing else, <b>custom</b> prints the text you give",
    Fill: "The color of the bubble drawn behind this Value in the line. Untouched it comes from your theme, and the round arrow at the end of the row puts it back there",
    Text: "The color of the writing inside that bubble — not the text of the Value, which is the <code>Value</code> column. If the two colors read badly together, <code>Preview</code> says so",
    Preview: "This Value drawn the way the editor will draw it, with both colors and the <code>Show</code> choice already applied. Nothing here is a setting: it is the row showing what the columns to its left have built. A warning sign appears when the two colors are too close to read, with the contrast it measured"
  };
  /* Подсказка раскрывается под шапкой во всю ширину таблицы, а не внутри
     своей ячейки: в ячейку шириной в тридцать точек текст не встанет. */
  const tipSlot = el("div", "io-vals__tipslot", inner);
  /*
   * У ссылки те же колонки, что у тега, за вычетом цвета — `Level` среди них
   * есть. Уровень открывали 2026-08-27, в тот же день убирали (стрелка уносила
   * значение) и в тот же день вернули: починена была запись, а не стрелка.
   * Колонка `Parent` жила здесь один день — движок привязку значения ссылки к
   * значению другого Field не читает вовсе.
   */
  (isLink ? ["", "Level", "Value", "Prefix", "Show", ""]
          : ["", "Level", "Value", "Prefix", "Show", "Fill", "Text", "Preview", ""])
    .forEach(t => {
      const cell = el("div", "io-vals__col", head);
      el("span", "io-vals__coltext", cell, t);
      if (COLTIP[t]) attachTip(cell, COLTIP[t], t, tipSlot, tipSlot);
    });

  f.values.forEach((v, i) => {
    const row = el("div", "io-vals__row" + (v.depth ? " io-vals__row--child" : ""), inner);
    dragHandle(el("div", "io-grip", row, "⠿"), row, (from, to) => moveIn(f.values, from, to), i);

    {
      const depth = el("div", "io-depthcell", row);
      const prev = f.values[i - 1];
      if (v.depth) {
        const out = iconBtn(depth, "←", "Make " + v.token + " a top-level Value");
        out.addEventListener("click", () => { v.depth = 0; renderContent(); });
      } else {
        const inn = iconBtn(depth, "→", "Make " + v.token + " a child Value");
        inn.disabled = !prev || prev.depth === 1;
        inn.addEventListener("click", () => { v.depth = 1; renderContent(); });
      }
    }

    const cell = el("div", "io-valcell", row);
    const tok = textEl(cell, v.token, null, "Value " + (i + 1) + " of " + f.name, "io-text io-text--mono");
    tok.addEventListener("input", () => { v.token = tok.value; renderContent(); });

    textEl(row, v.prefix, "no", "Prefix for " + v.token, "io-text io-text--mono");

    {
      /* Колонка `Show` есть у обоих родов значений; у ссылки положений два, и
         цвета с образцом у неё нет — её красит тема. */
      const shown = el("div", "io-showncell", row);
      const ss = selectEl(shown, isLink ? SHOWN_AS_LINK : SHOWN_AS, v.shown, "Show, for " + v.token);
      ss.addEventListener("change", () => { v.shown = ss.value; renderContent(); });
      if (v.shown === "custom") {
        const ci = textEl(shown, v.custom, "printed instead", "Custom text for " + v.token, "io-text io-text--mono");
        ci.addEventListener("input", () => { v.custom = ci.value; renderContent(); });
      }
      if (!isLink) {
        const mkColor = (key, label) => {
          const w = el("div", null, row);
          const c = el("input", "io-colin", w);
          c.type = "color"; c.value = v[key] || "#ffffff";
          c.setAttribute("aria-label", label + " for " + v.token);
          c.addEventListener("input", () => { v[key] = c.value; renderContent(); });
        };
        mkColor("color", "Fill color");
        mkColor("textColor", "Text color");
        const pv = el("div", "io-vals__prev", row);
        applyTagVars(pv);
        bubble(pv, v);
        contrastNote(pv, v);
      }
    }

    const tools = el("div", "io-valtools", row);
    /*
     * Обратно к цвету темы. Пикер такого сказать не умеет — у него всегда
     * какой-то цвет, — и без этой кнопки выбранный однажды цвет оставался у
     * Value навсегда (решение заказчика 2026-08-27). Одна кнопка на оба
     * цвета, и стоит она перед удалением.
     */
    if (!isLink && (v.color || v.textColor)) {
      const reset = iconBtn(tools, "↺", "Reset the colors of " + v.token + " back to the colors of the theme");
      reset.addEventListener("click", () => { v.color = ""; v.textColor = ""; renderContent(); });
    }
    /* Удаление красное: это единственная кнопка в строке, которая уносит
       данные (замечание заказчика 2026-08-27). */
    const del = iconBtn(tools, "✕", "Remove " + v.token);
    del.classList.add("io-icon--danger");
    subComment(tools, row, "value/" + (v.token || i));
  });

  const foot = el("div", "io-vals__foot", box);
  /* Решётка и двойные скобки не обязательны: значение читается одинаково с
     ними и без них (замечание заказчика 2026-08-27). */
  textEl(foot, "", isLink ? "[[wikilink]] / wikilink" : "#tag / tag",
    "New Value for " + f.name, "io-text io-text--mono");
  /* Добавление — акцентная кнопка: заказчик просил, чтобы её было видно
     (замечание 2026-08-27, отменяет прежнее «нейтральная» из Ф5). */
  const add = el("button", "io-btn io-btn--sm io-btn--cta", foot, "Add Value");
  add.type = "button";
  /* Строка «Use → to make a Value a child…» из подвала убрана: она уехала в
     подсказку колонки `Level`, где её ищут (замечание заказчика 2026-08-27). */
}

function elementRows(host, f) {
  /*
   * У Field типа Emoji своих Values нет: у него одно значение, которое двигают
   * команды. Настройки этого значения стоят под своим заголовком, а не в общей
   * куче под `Behavior`: заказчик читал их как настройки размещения
   * (замечание 2026-08-27).
   */
  /* «?» у заголовка: у Field типа element он был без объяснения, как и
     `Behavior` (замечание заказчика 1.4.1.2.5). */
  const vhe = el("div", "io-sub io-item__namerow", host);
  foldableSub(vhe, "element-value", "Value", subPaints);
  el("span", null, vhe, "Value");
  attachTipItem(vhe, host, { name:"Value", tip:"An element Field holds one Value, not a list: a date, a time, a counter. The rows below say what it prints \u2014 the emoji in front and the format of the value itself \u2014 and how the <code>next</code> and <code>previous</code> commands move it along" });

  const row = (r, value, apply) => {
    const item = el("div", "io-item", host);
    const info = el("div", "io-item__info", item);
    const nrow = el("div", "io-item__namerow", info);
    el("div", "io-item__name", nrow, r.name);
    /* Подсказка принадлежит строке, а не колонке описания: колонка кончается
       там, где начинается контрол. Так это устроено и в панели
       (`fields_editor_view.ts`), и во всех остальных строках прототипа; здесь
       стояла колонка, и подсказка раскрывалась в 181 точку (У-116). */
    if (r.tip) attachTipItem(nrow, item, r);
    subComment(nrow, info, "element/" + r.key);
    rich(el("div", "io-item__desc", info), r.desc);
    const ctl = el("div", "io-item__control", item);
    if (r.options) {
      const s = selectEl(ctl, r.options, value, r.name + " for " + f.name);
      s.addEventListener("change", () => { apply(s.value); renderContent(); });
      return;
    }
    const input = textEl(ctl, value, r.ph, r.name + " for " + f.name, "io-text io-text--mono",
      r.needed === true);
    input.addEventListener("input", () => { apply(input.value); refreshPreviews(); });
    if (r.picker) attachEmojiPicker(input, item, v => { apply(v); renderContent(); });
  };

  /* Знак обязателен: Field типа `element` без него не даёт панели открыться
     вовсе — измерено на его `data.json` от 2026-09-22. */
  row({ name:"Emoji-prefix", key:"marker", ph:"one character or emoji", needed:true, picker:true,
    desc:"The character that stands in front of the Value in the line",
    tip:"This is how the Field is recognised: the plugin reads <code>📅 2026-08-27</code> as this Field only because <code>📅</code> stands in front. Give it a character no other Field uses, or the plugin takes the two for one" },
    f.marker, v => { f.marker = v; });

  row({ name:"Value format", key:"format", ph:"YYYY-MM-DD / HHmm / 1",
    desc:"The shape of the Value: a date, a time or a number",
    tip:"Spell out the shape you want to see in the line. A date or a time is built from " +
        "<code>YYYY</code> (year), <code>MM</code> (month), <code>DD</code> (day), " +
        "<code>HH</code> (hour), <code>mm</code> (minute), <code>ss</code> (second), with any " +
        "separators between them: <code>YYYY-MM-DD</code> writes <code>2026-08-27</code>, " +
        "<code>DD.MM</code> writes <code>27.08</code>, <code>HHmm</code> writes <code>1435</code>. " +
        "Digits alone make a counter, and the number of digits is the width it keeps: " +
        "<code>1</code> counts <code>1</code>, <code>2</code>, <code>3</code>, while " +
        "<code>001</code> counts <code>001</code>, <code>002</code>. Anything else is taken as " +
        "plain text and never steps" },
    f.format, v => { f.format = v; });

  row({ name:"Steps by", key:"step",
    desc:"What should happen with the Value when you use <code>next</code> or <code>previous</code> command",
    tip:"<b>Fixed step</b> adds the same amount on every press: a day to a date, one to a counter. " +
        "<b>Command</b> throws the old Value away and writes a fresh one — the time of the press, " +
        "or a random string for an id. <b>Custom step</b> walks a list of steps you write yourself, " +
        "and can end the cycle by removing the Value from the line",
    options:[
      { value:"increment", label:"Fixed step" },
      { value:"command",   label:"Command" },
      { value:"custom",    label:"Custom step" }
    ] },
    f.step, v => { f.step = v; });

  /* Показывается только то, чем шагает выбранный режим: три поля разом сбивают
     с толку. */
  if (f.step === "increment") {
    row({ name:"Amount", key:"amount", ph:"1",
      desc:"How much one press adds to the Value",
      tip:"<code>next</code> adds this much, <code>previous</code> takes the same back. What one unit means comes from <code>Value format</code>: with <code>YYYY-MM-DD</code> it is a day, with <code>HHmm</code> a minute, with a counter just one" },
      f.amount || "1", v => { f.amount = v; });
  } else if (f.step === "command") {
    row({ name:"Command", key:"command",
      desc:"What the press writes into the Value instead of stepping it",
      tip:"<code>The current date and time</code> writes the moment of the press in the shape set by <code>Value format</code>. The random ones fill the Value with numbers or letters, which is what an id needs",
      options:[
        { value:"now",     label:"The current date and time" },
        { value:"randomN", label:"Random numbers" },
        { value:"randomE", label:"Random characters" }
      ] },
      f.command || "now", v => { f.command = v; });
  } else {
    row({ name:"Steps", key:"steps", ph:"1 (3)",
      desc:"One step per line, in the order the presses walk them",
      tip:"A line is a number, and a number in brackets after it says how many presses stay on that step: <code>1 (3)</code> moves by one for three presses. <code>END</code> ends the cycle and removes the Value" },
      f.steps || "", v => { f.steps = v; });
  }
}


/* The note property belongs to the Field, not to a table somewhere else:
   it is set here, next to everything else the Field decides. */
/*
 * Короткое имя, которым Field подписан в tagWheel. Своя строка, а не кусок
 * шапки: в шапке она стояла между чипом типа и красной корзиной и читалась
 * как случайный набор (замечание заказчика, шестой круг). Название строки —
 * `Name in tagWheel`, словами заказчика: «short name» не говорило, где это
 * имя видно.
 */
function nameInWheelRow(host, f) {
  const row = el("div", "io-item", host);
  const info = el("div", "io-item__info", row);
  const nrow = el("div", "io-item__namerow", info);
  el("div", "io-item__name", nrow, "Name in tagWheel");
  /* «?» стоит до поля ввода, а не после: подпись, знак вопроса, потом правка
     — так это читается слева направо (замечание заказчика 2026-08-27). */
  attachTipItem(nrow, row, { name:"Name in tagWheel",
    tip:"tagWheel puts every Field side by side, so a long name crowds its neighbours. Writing <b>Status</b> as <b>Stat</b> keeps that row readable. Your notes keep the full name" });
  subComment(nrow, info, "field-editor/short-name");
  el("div", "io-item__desc", info, "A shorter name for the tagWheel row, where there is little room");
  const ctl = el("div", "io-item__control", row);
  const nin = textEl(ctl, f.short, f.name, "Name in tagWheel for " + f.name, "io-text io-text--prop");
  nin.addEventListener("input", () => { f.short = nin.value; refreshPreviews(); });
}


function propertyRow(host, f) {
  /*
   * Свойства заметки — свой раздел, а не строка внутри `Behavior`
   * (замечание заказчика 2026-08-27). Полный набор приехал сюда решением
   * заказчика 2026-08-28: имя свойства, тип, правило значения и то, что
   * будет записано. Блока `Note properties` на вкладке Transform больше
   * нет — настройка живёт там, где живёт Field.
   */
  const head = el("div", "io-sub io-item__namerow", host);
  foldableSub(head, "yaml", "YAML property", subPaints);
  el("span", null, head, "YAML property");
  attachTipItem(head, host, { name:"YAML property",
    tip:"<code>Inline to note</code> on the Transform tab turns a line into a note, and it writes any Field into a property of that note — the same properties you see at the top of a note in Obsidian. This is where you say which property a Field goes to. Start typing and it offers the ones your vault already uses. Leave it empty and the Field is simply not copied" });
  subComment(head, host, "field-editor/yaml-header");

  /* Один ряд раздела: имя, «?», описание, контрол. */
  const row = (r, fill) => {
    const item = el("div", "io-item", host);
    const info = el("div", "io-item__info", item);
    const nrow = el("div", "io-item__namerow", info);
    el("div", "io-item__name", nrow, r.name);
    /* Хостом подсказки идёт строка, а не колонка описания: колонка
       кончается у контрола, и подсказка выходила её шириной (У-116). */
    helpButton(nrow, info, r, item);
    subComment(nrow, info, "field-editor/" + r.key);
    rich(el("div", "io-item__desc", info), r.desc);
    fill(el("div", "io-item__control", item));
  };

  /* У строки `Property` своей «?» нет: подсказка раздела стоит прямо над
     ней (замечание заказчика 2026-08-27, третий круг). */
  row({
    name:"Property", key:"property",
    desc:"If you use inline2note, to which YAML property this Field should go",
  }, ctl => propertyPicker(ctl, f, renderContent));

  row({
    name:"Property type", key:"yaml-type",
    desc:"Whether the property holds one Value or a list",
    tip:"<b>Auto</b> works it out for you: a list when more than one Field writes to the same property, a single Value otherwise. Set it by hand only when Auto guesses wrong",
  }, ctl => {
    const s = selectEl(ctl, [
      { value:"auto", label:"Auto" },
      { value:"one",  label:"One Value" },
      { value:"list", label:"A list" }
    ], f.cardinality || "auto", "Property type for " + f.name);
    s.addEventListener("change", () => { f.cardinality = s.value; renderContent(); refreshPreviews(); });
  });

  row({
    name:"How to show Value in YAML", key:"yaml-rule",
    desc:"How the Value is written into the property",
    tip:"<b>Raw</b> copies the Value exactly as it appears in your line, hash and all. <b>Clean</b> strips the decoration — no <code>#</code> on a tag, no emoji on a date, no <code>[[ ]]</code> around a link — which is what you want if you plan to search or sort by the property. The rule belongs to the Field and applies to every one of its Values",
  }, ctl => {
    const s = selectEl(ctl, [
      { value:"raw",   label:"Raw" },
      { value:"clean", label:"Clean" }
    ], f.valueRule || "raw", "How to show Value in YAML for " + f.name);
    s.addEventListener("change", () => { f.valueRule = s.value; renderContent(); refreshPreviews(); });
  });

  row({
    name:"Preview", key:"yaml-written",
    desc:"How this Value will look like in YAML",
    tip:"It follows the three choices above and updates as you change them. Two Fields can share one property name, and then both Values go into the same list",
  /* Превью — не контрол, а вывод, но стоит справа и ровно той ширины, что
     поле свойства над ним (замечание заказчика 2026-08-28). */
  }, ctl => {
    const written = f.property ? yamlLineFor(f) : "";
    const box = el("div", "io-yamlex" + (written ? "" : " io-yamlex--empty"), ctl);
    el("div", "io-yamlex__line", box, written || "not written");
  });
}

function placementRows(host, f) {
  /* Один ряд настройки внутри правой колонки: имя, «?», описание, контрол. */
  const row = (r, value, apply, options) => {
    const item = el("div", "io-item", host);
    const info = el("div", "io-item__info", item);
    const nrow = el("div", "io-item__namerow", info);
    el("div", "io-item__name", nrow, r.name);
    /* Хостом подсказки идёт строка, а не колонка описания: колонка
       кончается у контрола, и подсказка выходила её шириной (У-116). */
    helpButton(nrow, info, r, item);
    subComment(nrow, info, "placement/" + r.key);
    rich(el("div", "io-item__desc", info), r.desc);
    const ctl = el("div", "io-item__control", item);
    const s = selectEl(ctl, options || r.options, value, r.name + " for " + f.name);
    s.addEventListener("change", () => { apply(s.value); renderContent(); });
  };

  /*
   * Работает ли Field вообще. Настройка живая и читается рантаймом: при `no`
   * Field выключен везде, при `hotkey_only` его команды работают, а из
   * tagWheel он убран. Значения в конфиге прежние (З1) — меняются подписи.
   * Возвращена решением заказчика 2026-08-27: в первой версии этой колонки
   * контрола не было, и настройка становилась недостижимой.
   */
  row({ name:"Active", key:"active",
    desc:"Whether this Field is offered, and where",
    tip:"<b>No</b> switches the Field off everywhere: tagWheel does not show it and its commands do nothing. " +
        "<b>Commands only</b> keeps the commands working and takes the Field out of tagWheel",
    options:[{ value:"yes", label:"Yes" }, { value:"no", label:"No" },
             { value:"hotkey_only", label:"Commands only" }] },
    f.active || "yes", v => { f.active = v; });

  row({ name:"Prefix behavior", key:"behavior", options:BEHAVIORS,
    desc:"How this Field affects the line Prefix",
    tip:"<b>Strict</b> writes the Value in its own Block and changes the line Prefix. " +
        "<b>Insert only</b> writes the Value in its own Block and does not change the line Prefix. " +
        "<b>Free</b> inserts the Value where the cursor is now" },
    f.behavior, v => { f.behavior = v; });

  /*
   * Дочерний Field есть только у Field типа Tag. У ссылки дочернего Field
   * нет: родитель её значения — это значение ДРУГОГО Field
   * (`__ioParentBinding`), а не соседняя ссылка, и заводится он своим
   * контролом, а не этим. У Field типа Emoji значений нет вовсе (З8).
   *
   * Выключенный дочерний Field не появляется в tagWheel после выбора
   * родительского значения, даже если значения у него заведены.
   */
  if (f.type === "tag") {
    /* Четыре положения, как в панели (`CHILD_OPTIONS` в `fields_editor_view.ts`):
       три его словом 2026-09-19 и `Show when press Alt` (`З-36`, 2026-09-22).
       Здесь до 2026-09-23 стояли два прежних — `Yes` и `No`. */
    row({ name:"Child Field", key:"child",
      desc:"When the child Field is offered: after a parent Value, always, on an Alt press, or never",
      tip:"A child Field is a second Field that only makes sense under this one: its Values are the ones marked child in the table below. <b>After parent</b> offers it once the parent has a Value \u2014 that is how it has always worked \u2014 and a press of <code>Alt</code> on the parent opens it before that. <b>Show always</b> offers it on any line: tagWheel shows it with no parent picked, and its commands step through every child Value in turn. <b>Show when press Alt</b> keeps it out of tagWheel until you press <code>Alt</code> on the parent: it appears next to the parent, so you can step onto it and pick a Value \u2014 even before the parent has one, and then the Value stands without a parent. Press <code>Alt</code> again and it hides, and the Value you picked stays on the line. <code>Alt</code> together with another key is a hotkey and does not open it. Its commands work as with <b>After parent</b>. <b>Hide</b> keeps it out of tagWheel and out of its commands even when its Values are set up",
      options:[
        { value:"after-parent", label:"After parent" },
        { value:"always",       label:"Show always" },
        { value:"alt",          label:"Show when press Alt" },
        { value:"hide",         label:"Hide" }
      ] },
      f.childMode || (f.childOn === false ? "hide" : "after-parent"),
      v => { f.childMode = v; f.childOn = v !== "hide"; });
  }

  prerequisiteRows(host, f, row);
}

/*
 * Предусловие Field (10.13.4). Field ждёт другой Field: пока у того в
 * строке нет значения, этот не показывается ни в tagWheel, ни в командах, ни
 * в самой строке. Выбрано значение — можно сузить и до него одного.
 *
 * В конфиг это ложится двумя ключами, которые рантайм понимает давно:
 * `dependsOn` и `enabledForParentValues`. Кого можно ждать, решает рантайм:
 * ссылка и элемент (список определений `rightMode`) ждут кого угодно, тег
 * (`leftMode`) — только тега. Граница списков открыта в одну сторону, потому
 * что `dependsOn` у левого Field значит для движка ещё и «дочерний тег».
 */
function prerequisiteRows(host, f, row) {
  /* Тег ждёт только тега; ссылка и элемент — кого угодно: граница списков
     определений открыта в одну сторону (решение заказчика 2026-08-27). */
  const canWaitFor = x => (f.type === "tag" ? x.type === "tag" : true);
  const others = FIELDS.filter(x => x.id !== f.id && canWaitFor(x));
  /* Некого ждать — и строки нет: контрол, который никуда не ведёт, не
     показывается (З8). */
  if (!others.length && !f.prereq) return;

  row({ name:"Prerequisite Field", key:"prereq",
    desc:"Show this Field only after another Field has a Value",
    tip:"A Field with a prerequisite stays out of tagWheel, out of its commands and out of the line until the Field it waits for has a Value. " +
        "Picking a different Value in that Field clears this one" },
    f.prereq ? "yes" : "no",
    v => { f.prereq = v === "yes" ? (f.prereq || (others[0] && others[0].id) || "") : ""; f.prereqValue = ""; },
    [{ value:"no", label:"No" }, { value:"yes", label:"Yes" }]);

  if (!f.prereq) return;

  row({ name:"Choose prerequisite Field", key:"prereq-field",
    desc:"Which Field this one waits for",
    tip:"A Link or an Emoji Field can wait for any other Field, a Tag Field only for another Tag Field. " +
        "Two Tag Fields tied this way are also kept next to each other in the line" },
    f.prereq, v => { f.prereq = v; f.prereqValue = ""; },
    others.map(x => ({ value:x.id, label:x.strict || x.name })));

  const chosen = FIELDS.find(x => x.id === f.prereq);
  const values = chosen && Array.isArray(chosen.values) ? chosen.values : [];
  row({ name:"Prerequisite Value", key:"prereq-value",
    desc:"Which Value of that Field this one waits for",
    tip:"Left at <b>Any Value</b> this Field appears as soon as the prerequisite Field has a Value of any kind. " +
        "Name one, and it waits for that Value alone" },
    f.prereqValue || "",
    v => { f.prereqValue = v; },
    [{ value:"", label:"Any Value" }].concat(values.map(x => ({ value:x.token, label:x.token }))));
}

/* ============================================================ Cycle order */

function renderCycleOrder(host) {
  const on = ctx.get("navigation.moveSelection.prefixCyclerEnabled");
  const box = el("div", "io-sortable" + (on ? "" : " io-sortable--off"), host);

  CYCLE_ORDER.forEach((row, i) => {
    const r = el("div", "io-sortrow", box);
    const grip = el("span", "io-grip", r, "\u283F");
    if (on) dragHandle(grip, r, (f, t) => moveIn(CYCLE_ORDER, f, t), i);
    el("span", "io-sortrow__n", r, String(i + 1));
    const input = textEl(r, row.text, "no Prefix (plain text)", "Prefix " + (i + 1), "io-text io-text--mono");
    input.style.setProperty("flex", "1 1 auto");
    input.disabled = !on;
    input.addEventListener("input", () => { row.text = input.value; });

    const move = el("div", "io-sortrow__move", r);
    const up = iconBtn(move, "\u25B2", "Move Prefix " + (i + 1) + " up");
    up.disabled = i === 0 || !on;
    up.addEventListener("click", () => moveIn(CYCLE_ORDER, i, i - 1));
    const down = iconBtn(move, "\u25BC", "Move Prefix " + (i + 1) + " down");
    down.disabled = i === CYCLE_ORDER.length - 1 || !on;
    down.addEventListener("click", () => moveIn(CYCLE_ORDER, i, i + 1));
    const rm = iconBtn(move, "\u2715", "Remove Prefix " + (i + 1));
    rm.disabled = CYCLE_ORDER.length < 2 || !on;
    rm.addEventListener("click", () => { CYCLE_ORDER.splice(i, 1); renderContent(); });
    subComment(move, r, "cycle-order/" + (i + 1));

  });

  const actions = el("div", "io-rowactions", host);
  const add = el("button", "io-btn io-btn--sm", actions, "Add Prefix");
  add.type = "button";
  add.disabled = !on;
  add.addEventListener("click", () => { CYCLE_ORDER.push({ text:"" }); renderContent(); });
  el("span", "io-note", actions, "Drag a row, or use the arrows, to change the order");
}

/* Предпросмотр каретки (10.13.33 Ц8).

   Показывает три настройки сразу — цвет, толщину и скорость мерцания — и
   мерцает так же, как мерцает редактор: `steps(1)`, то есть половину времени
   видна и половину не видна, без плавного затухания. Скорость приходит
   переменной, а саму анимацию держит стиль: перерисовка на каждом шаге
   слайдера иначе сбрасывала бы мерцание в начало.

   Скорость 0 значит «не мигает». Тогда анимация снимается совсем, и каретка
   просто стоит: гасить её нулевой длительностью нельзя — нулевая длительность
   в CSS означает «мгновенно», а не «никогда». */
function caretPreviewVars(node) {
  const speed = Number(ctx.get("visual.caret.blinkSpeed"));
  const shaped = ctx.get("visual.caret.shapeEnabled") === true;
  const width = shaped ? Number(ctx.get("visual.caret.width")) || 2 : 1.2;
  const color = ctx.get("visual.caret.enabled") === true ? String(ctx.get("visual.caret.color") || "") : "";
  cssVar(node, "--io-caret-width", width + "px");
  cssVar(node, "--io-caret-shift", (-width / 2) + "px");
  cssVar(node, "--io-caret-color", color || "var(--text-normal)");
  const still = shaped && Number.isFinite(speed) && speed <= 0;
  cssVar(node, "--io-caret-blink", (shaped ? caretBlinkMs(speed) : 1200) + "ms");
  node.classList.toggle("io-caretline--still", still);
}

/* Скорость 1..10 в миллисекунды. 5 — то, чем Obsidian мерцает сейчас (1200),
   поэтому умолчание слайдера и есть 5: включённый тумблер сам по себе ничего
   не меняет, пока человек не подвинул ползунок. */
function caretBlinkMs(speed) {
  const s = Number.isFinite(speed) ? Math.max(1, Math.min(10, speed)) : 5;
  return 2200 - s * 200;
}

/**
 * Как выглядит подсветка места, куда прыгнул курсор (Н5).
 *
 * Круг рисуется тем же набором переменных, каким его нарисует слой редактора:
 * радиус, цвет и время. Гасит его **анимация**, а не таймер — так же, как в
 * самом плагине: таймер пришлось бы снимать при выгрузке, а анимация уезжает
 * вместе с узлом.
 *
 * Задержка между прыжками здесь не показывается, и это сказано словом: у
 * предпросмотра прыжок один, а её предмет — второй прыжок следом за первым.
 */
function jumpFlashVars(node) {
  const color = String(ctx.get("visual.jumpFlash.color") || "");
  cssVar(node, "--io-jump-radius", (Number(ctx.get("visual.jumpFlash.radius")) || 18) + "px");
  cssVar(node, "--io-jump-fade", (Number(ctx.get("visual.jumpFlash.fadeMs")) || 450) + "ms");
  cssVar(node, "--io-jump-color", color || "var(--interactive-accent)");
}

function renderJumpFlashPreview(host) {
  const pt = PREVIEW_TEXTS["jump-flash-preview"];
  const box = previewShell(host, pt.cap, pt.tip);
  const holder = el("div", null, box);
  /*
   * **Круг мигает сам, и это его слово 2026-09-17:** "не видно как работает
   * jump-flash-delay… сделай, чтобы оно работало циклично всегда". Прежде
   * круг возникал по нажатию на строку или на смену настройки, и задержку
   * между прыжками увидеть было не на чем: её предмет — второй прыжок
   * следом за первым, а прыжок был один.
   *
   * Круг тухнет анимацией, а ждёт — таймером, и оба срока берутся из
   * настроек: `fadeMs` — сколько он живёт, `quietMs` — сколько тишины
   * после него. При нуле тишины круг идёт подряд, и это ровно то, что
   * говорит сама строка: "at 0 every jump gets its circle".
   *
   * Таймер снимается перед каждой новой отрисовкой и не заводится заново
   * на узле, которого нет на странице: иначе каждая перерисовка вкладки
   * оставляла бы по кругу, тикающему в отцепленном дереве.
   */
  let timer = 0;
  const draw = () => {
    if (timer) { clearTimeout(timer); timer = 0; }
    holder.textContent = "";
    const row = el("div", "io-jumpline", holder);
    el("span", null, row, PREVIEW_LINE_TEXT);
    jumpFlashVars(row);
    const pulse = () => {
      if (!row.isConnected) { timer = 0; return; }
      const old = row.querySelector(".io-jumpflash");
      if (old) old.remove();
      const spot = el("span", "io-jumpflash", row);
      /* Круг встаёт на конец написанного — там же, где после прыжка
         каретка. Место едет переменной, а не свойством узла: вид живёт в
         листе стилей (правило каталога Р7). */
      cssVar(spot, "--io-jump-x", "calc(8px + " + PREVIEW_LINE_TEXT.length + "ch)");
      const fade = Number(ctx.get("visual.jumpFlash.fadeMs")) || 450;
      const quiet = Number(ctx.get("visual.jumpFlash.quietMs")) || 0;
      timer = setTimeout(pulse, fade + quiet);
    };
    pulse();
    /* Абзаца под предпросмотром нет, когда сказать нечего: пустой <p>
       оставляет отступ, а строки в нём не видно. */
    if (pt.note) el("p", "io-preview__note", holder, pt.note);
  };
  draw();
  previewRefreshers.push(draw);
  ["visual.jumpFlash.enabled", "visual.jumpFlash.color",
   "visual.jumpFlash.radius", "visual.jumpFlash.fadeMs",
   "visual.jumpFlash.quietMs"].forEach(p => bind(p, draw));
}

/* how many fields share this property decides Auto */
function isList(f, sharing) {
  const c = f.cardinality || "auto";
  if (c === "list") return true;
  if (c === "one") return false;
  return sharing > 1;
}

function yamlValueFor(f) {
  /* the plain form never carries a marker: no hash on a tag, no emoji on an
     element, no brackets on a link */
  const plain = f.type === "element" ? f.format
    : f.type === "link" ? String(f.values[0] ? f.values[0].token : "value").replace(/^\[\[|\]\]$/g, "")
    : (f.values[0] ? f.values[0].token : "value");
  const asWritten = f.type === "element" ? f.marker + plain
    : f.type === "tag" ? "#" + plain
    : "[[" + plain + "]]";
  return (f.valueRule || "raw") === "clean" ? plain : asWritten;
}

function yamlLineFor(f) {
  const sharing = FIELDS.filter(x => x.property && x.property === f.property).length;
  const v = yamlValueFor(f);
  return isList(f, sharing) ? f.property + ": [" + v + "]" : f.property + ": " + v;
}

/* a property name is picked from what the vault already has, or typed */
function propertyPicker(host, f, redraw) {
  const wrap = el("div", "io-pick2", host);
  const input = textEl(wrap, f.property || "", "select Property", "YAML property for " + f.name, "io-text io-text--mono io-text--prop");

  /* Стереть выбранное свойство одним нажатием (замечание 1.4.1.2.6):
     руками это значило выделить текст в поле, которое на каждое нажатие
     открывает список подсказок. Нечего стирать — кнопки нет (З8). */
  if (String(f.property || "").trim()) {
    const clear = el("button", "io-clear", wrap, "\u2715");
    clear.type = "button";
    clear.setAttribute("aria-label", "Clear the property of " + f.name);
    clear.title = "Clear the property of " + f.name;
    clear.addEventListener("click", () => { f.property = ""; redraw(); });
  }

  const list = el("div", "io-pick2__list", wrap);
  let open = false;
  const close = () => { open = false; list.textContent = ""; list.classList.remove("io-pick2__list--open"); };
  const fill = () => {
    list.textContent = "";
    const q = String(input.value || "").trim().toLowerCase();
    const hits = VAULT_PROPERTIES.filter(p => !q || p.name.toLowerCase().includes(q));
    if (!hits.length) { close(); return; }
    open = true;
    list.classList.add("io-pick2__list--open");
    hits.slice(0, 8).forEach(p => {
      const b = el("button", "io-pick2__opt", list);
      b.type = "button";
      el("span", null, b, p.name);
      el("span", "io-pick2__type", b, p.type);
      b.addEventListener("mousedown", e => {
        e.preventDefault();
        f.property = p.name;
        input.value = p.name;
        close();
        redraw();
        refreshPreviews();
      });
    });
  };
  input.addEventListener("focus", fill);
  input.addEventListener("input", () => { f.property = input.value; fill(); });
  input.addEventListener("blur", () => { setTimeout(() => { close(); redraw(); refreshPreviews(); }, 60); });
  return wrap;
}

/* ============================================================ Order lists */

function sortableList(host, items, label, onMove, render) {
  const box = el("div", "io-sortable", host);
  items.forEach((it, i) => {
    const row = el("div", "io-sortrow", box);
    const grip = el("span", "io-grip", row, "\u283F");
    dragHandle(grip, row, onMove, i);
    el("span", "io-sortrow__n", row, String(i + 1));
    render(row, it);
    const move = el("div", "io-sortrow__move", row);
    const up = iconBtn(move, "\u25B2", "Move " + label + " " + (i + 1) + " up");
    up.disabled = i === 0;
    up.addEventListener("click", () => onMove(i, i - 1));
    const down = iconBtn(move, "\u25BC", "Move " + label + " " + (i + 1) + " down");
    down.disabled = i === items.length - 1;
    down.addEventListener("click", () => onMove(i, i + 1));

  });
  return box;
}
function moveIn(arr, from, to) {
  if (to < 0 || to >= arr.length) return;
  arr.splice(to, 0, arr.splice(from, 1)[0]);
  renderContent();
}

function renderFieldOrderList(host) {
  const note = el("p", "io-note", host, "The Field nearest the top wins a conflict. Drag a row, or use the arrows");
  note.style.setProperty("margin-top", "0");
  sortableList(host, FIELDS, "field", (a, b) => moveIn(FIELDS, a, b), (row, f) => {
    el("span", null, row, f.name);
    { const c = el("span", "io-chip io-chip--typed", row, TYPE_LABEL[f.type]); cssVar(c, "--io-chip-bg", TYPE_COLOR[f.type]); cssVar(c, "--io-chip-fg", typeInk(f.type)); }
  });
}
function renderPrefixOrderList(host) {
  const note = el("p", "io-note", host,
    "The Prefix nearest the top wins, whichever Field produced it. Drag a row, or use the arrows");
  note.style.setProperty("margin-top", "0");
