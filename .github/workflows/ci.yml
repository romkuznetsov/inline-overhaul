name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Settings layer gates
        run: npm run gate

      # Прототип нормативен (PRD Р8), поэтому расхождение с ним ловится
      # здесь же: гейты схемы, дымовой рендер, проверки по выводу и
      # перегенерация раздела 9 с Приложением B без diff (Г24).
      - name: Prototype gates
        run: npm run gate:prototype

      # Седьмой шаг: вид панели и подложка в заметке настоящим Chromium.
      #
      # До 2026-09-11 он гонялся только руками — решением 2026-09-08, потому
      # что Chromium это 115 МБ на машину разработчика. На сервере эта цена
      # чужая: браузер ставится в свежую машину, которую всё равно выбросят.
      # А цена «забыть прогнать» — своя: заглушка DOM не считает ни одного
      # пикселя, и за одну неделю через неё прошли четыре дефекта, которые
      # нашли только глаза заказчика (PRD 15.4).
      #
      # Ставится ровно один браузер, а не все три: гейт открывает Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser gate
        run: npm run gate:browser

      - name: Build
        run: npm run build

      - name: Bundle sanity
        run: node --check dist/main.js
